<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الامتحان التجريبي — TELC Voll</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style>
.mock-root{direction:ltr;max-width:1280px;margin:0 auto;padding:18px 22px 130px}
.mock-top{direction:ltr;position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);padding:10px 0}
.mock-top-inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.mock-brand{font-weight:950;color:var(--ink);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mock-status{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.mock-timer{font-variant-numeric:tabular-nums;font-weight:950;font-size:20px;padding:8px 16px;border-radius:14px;background:rgba(244,123,32,0.1);color:#f47b20;min-width:105px;text-align:center;border:1.5px solid rgba(244,123,32,0.3);box-shadow:0 2px 10px rgba(244,123,32,0.1)}
.mock-timer.danger{background:#fff0ee;color:#b7372d;border-color:#e6a39d;animation:pulseTimer 1s infinite alternate}
@keyframes pulseTimer{from{transform:scale(1)}to{transform:scale(1.03)}}
.mock-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mock-tab{border:1.5px solid var(--line);background:var(--white);color:var(--ink);border-radius:14px;padding:9px 12px;cursor:pointer;font:inherit;font-weight:900;box-shadow:var(--shadow-sm);min-width:0;transition:all .18s ease;text-align:center}
.mock-tab small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.mock-tab.active{border-color:#f47b20;box-shadow:0 0 0 2px rgba(244,123,32,0.18);background:rgba(244,123,32,0.08);color:#f47b20}
.mock-tab:disabled{opacity:.4;cursor:not-allowed}
.mock-progress{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:16px 0}
.mock-progress-bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;flex:1}
.mock-progress-bar i{display:block;height:100%;background:linear-gradient(90deg,#f47b20,#ff9a4d);border-radius:inherit;transition:width .25s ease}
.mock-card{direction:ltr;background:var(--white);border:1.5px solid var(--line);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,0.04);padding:32px;box-sizing:border-box}
html[data-theme="dark"] .mock-card{direction:ltr;background:rgba(18,24,21,0.85);backdrop-filter:blur(16px);border-color:rgba(255,255,255,0.08);box-shadow:0 12px 36px rgba(0,0,0,0.4)}
.mock-section-label{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.mock-section-label .tag{font-weight:900;background:rgba(244,123,32,0.12);color:#f47b20;border:1px solid rgba(244,123,32,0.3);padding:5px 14px;border-radius:999px;font-size:13px}
.mock-task-count{font-size:14px;font-weight:850;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:5px 12px;border-radius:999px}
.mock-reading-panel{font-size:17px;line-height:1.9;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:24px;margin:20px 0}

/* Inline select inside Sprachbausteine text */
.mock-inline-gap-select{display:inline-block;vertical-align:middle;padding:5px 12px;margin:3px 5px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink);font-weight:850;font-size:14px;cursor:pointer;transition:all .18s ease;box-shadow:0 2px 6px rgba(0,0,0,0.03);outline:none;max-width:230px}
.mock-inline-gap-select:hover{border-color:#f47b20}
.mock-inline-gap-select.answered{border-color:#f47b20;background:rgba(244,123,32,0.1);color:#f47b20;font-weight:900}
html[data-theme="dark"] .mock-inline-gap-select{background:#1a231f;border-color:rgba(255,255,255,0.12);color:#fff}
html[data-theme="dark"] .mock-inline-gap-select.answered{background:rgba(244,123,32,0.2);border-color:#f47b20;color:#ff9a4d}

/* Questions container below text */
.mock-spb-container{margin-top:28px;padding-top:22px;border-top:1.5px solid var(--line)}
.mock-spb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.mock-spb-head h3{margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.mock-spb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mock-spb-card{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:all .18s ease}
.mock-spb-card.answered{border-color:rgba(244,123,32,0.4);background:rgba(244,123,32,0.02)}
.mock-spb-card-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14.5px;color:var(--ink)}
.mock-spb-card-title .mock-num-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(244,123,32,0.12);color:#f47b20;font-size:13px;font-weight:950}
.mock-spb-options{display:grid;gap:8px}
.mock-spb-option-btn{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);background:var(--white);color:var(--ink);border-radius:12px;padding:10px 14px;text-align:start;cursor:pointer;font:inherit;font-size:14px;font-weight:750;transition:all .18s ease}
.mock-spb-option-btn:hover{border-color:#f47b20;background:rgba(244,123,32,0.04)}
.mock-spb-option-btn.selected{border-color:#f47b20;background:rgba(244,123,32,0.12);color:#f47b20;box-shadow:0 0 0 1px #f47b20;font-weight:900}
.mock-btn-key{font-weight:950;color:#f47b20;min-width:24px}
html[data-theme="dark"] .mock-spb-card{background:#141c18;border-color:rgba(255,255,255,0.08)}
html[data-theme="dark"] .mock-spb-option-btn{background:#1b2520;border-color:rgba(255,255,255,0.1);color:#fff}

/* Word Bank (Sprachbausteine 2) */
.mock-wordbank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.mock-word-card{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--white);border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-weight:800;color:var(--ink);transition:all .18s ease;box-shadow:0 1px 4px rgba(0,0,0,0.02)}
.mock-word-card small{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:rgba(244,123,32,0.12);color:#f47b20;font-size:12px;font-weight:950}
.mock-word-card.used{opacity:.5;background:var(--bg);border-style:dashed}
.mock-word-card .mock-word-check{margin-inline-start:auto;color:#2d9b68;font-weight:950}
html[data-theme="dark"] .mock-word-card{background:#1a231f;border-color:rgba(255,255,255,0.1);color:#fff}

/* Headings Bank (Lesen 1) */
.mock-headings-bank{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:20px;margin-bottom:24px}
.mock-headings-bank h3{margin:0 0 12px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.mock-headings-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.mock-heading-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--white);border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.6}
.mock-heading-letter{font-weight:950;color:#f47b20;min-width:24px}

/* Lesen 3: Ads and situations */
.mock-ads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:32px}
.mock-ad-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.mock-ad-card .ad-tag{display:inline-block;background:#0f172a;color:#fff;font-weight:900;font-size:12.5px;padding:3px 10px;border-radius:6px;align-self:flex-start}
.mock-ad-card h4{margin:4px 0 6px;font-size:16px;font-weight:850;color:#2d9b68}
.mock-ad-card .ad-body{font-size:14px;line-height:1.75;color:var(--ink)}

/* Audio player */
.mock-audio{padding:18px 22px;border:1.5px solid var(--line);background:var(--white);border-radius:20px;margin:20px 0;box-shadow:0 4px 16px rgba(0,0,0,0.04);display:flex;flex-direction:column;gap:12px}
.mock-audio-header{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:900}
.mock-audio-header span:first-child{color:#2d9b68;display:flex;align-items:center;gap:6px}
.mock-audio audio{width:100%;height:46px;border-radius:12px;accent-color:#2d9b68}

/* Generic question item */
.mock-item{border:1.5px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;background:var(--bg);transition:all .18s ease}
.mock-item.answered{border-color:rgba(244,123,32,0.35)}
.mock-item-prompt{font-weight:850;font-size:16px;line-height:1.7;margin-bottom:14px;color:var(--ink)}
.mock-select{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);font:inherit;font-size:14.5px;font-weight:800;color:var(--ink);cursor:pointer;outline:none;transition:all .18s ease}
.mock-select:hover,.mock-select:focus{border-color:#f47b20}
.mock-select.answered{border-color:#f47b20;background:rgba(244,123,32,0.04)}

/* True/False buttons */
.mock-tf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mock-tf-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--white);color:var(--ink);font-size:15px;font-weight:900;cursor:pointer;transition:all .18s ease}
.mock-tf-btn:hover{border-color:#f47b20}
.mock-tf-btn.selected.tf-richtig{background:rgba(45,155,104,0.15);border-color:#2d9b68;color:#2d9b68;box-shadow:0 0 0 1px #2d9b68}
.mock-tf-btn.selected.tf-falsch{background:rgba(201,74,67,0.15);border-color:#c94a43;color:#c94a43;box-shadow:0 0 0 1px #c94a43}

/* Writing Box */
.mock-writing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mock-writing-box{border:1.5px solid var(--line);border-radius:20px;padding:22px;background:var(--bg)}
.mock-writing-box h3{margin-top:0;font-size:18px;font-weight:900;color:var(--ink)}
.mock-writing-editor textarea{width:100%;min-height:420px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:18px;background:var(--white);font:inherit;font-size:15.5px;line-height:1.85;box-sizing:border-box;color:var(--ink);outline:none;transition:border-color .18s ease}
.mock-writing-editor textarea:focus{border-color:#f47b20;box-shadow:0 0 0 2px rgba(244,123,32,0.15)}
.mock-editor-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:800;margin-top:8px}

/* Bottom Actions Toolbar */
.mock-actions{direction:ltr;position:fixed;bottom:0;left:0;right:0;z-index:60;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1.5px solid var(--line);padding:14px 20px;box-shadow:0 -4px 24px rgba(0,0,0,0.06)}
.mock-actions-inner{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.mock-nav-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;transition:all .2s ease;text-decoration:none;border:none}
.mock-nav-btn.light{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}
.mock-nav-btn.light:hover:not(:disabled){border-color:#f47b20;color:#f47b20}
.mock-nav-btn.light:disabled{opacity:.4;cursor:not-allowed}
.mock-nav-btn.dark{background:#111827;color:#fff}
.mock-nav-btn.dark:hover{background:#1f2937;transform:translateY(-1px)}
.mock-nav-btn.btn-finish-mock{background:#f47b20 !important;color:#fff !important;box-shadow:0 4px 18px rgba(244,123,32,0.4) !important}
.mock-nav-btn.btn-finish-mock:hover{background:#e06912 !important;transform:scale(1.02)}

.mock-finish{max-width:720px;margin:80px auto;text-align:center;padding:40px;border-radius:24px;background:var(--white);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.mock-finish .spinner{width:48px;height:48px;border:4px solid var(--line);border-top-color:#f47b20;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .mock-top-inner{grid-template-columns:auto 1fr}
  .mock-status{grid-column:2;grid-row:1}
  .mock-tabs{grid-column:1/-1;grid-row:2}
  .mock-writing-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .mock-root{padding:12px 12px 120px}
  .mock-top-inner{gap:8px}
  .mock-brand{font-size:13px}
  .mock-status .muted{display:none}
  .mock-timer{font-size:17px;min-width:92px;padding:7px 10px}
  .mock-tabs{grid-template-columns:repeat(2,1fr)}
  .mock-card{padding:18px}
  .mock-reading-panel{font-size:15px;padding:16px}
  .mock-actions{padding:10px 14px}
  .mock-nav-btn{font-size:13px;padding:10px 14px}
}
</style>
<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>

<body>
<header class="mock-top">
  <div class="mock-root" style="padding:0 22px">
    <div class="mock-top-inner">
      <a class="back-link" href="/dashboard.html" aria-label="العودة">←</a>
      <a class="mock-brand" href="/dashboard.html">
        <span class="brand-dot"></span>
        <span>TELC Voll · Prüfungssimulation</span>
      </a>
      <div class="mock-status">
        <span class="muted" data-i18n="time_left">الوقت المتبقي للامتحان</span>
        <strong id="examTimer" class="mock-timer">--:--</strong>
        <span class="header-actions"></span>
      </div>
      <nav id="mockTabs" class="mock-tabs" aria-label="أقسام الامتحان"></nav>
    </div>
  </div>
</header>
<main id="app" class="mock-root"><div class="student-loading">جارٍ تحميل الامتحان…</div></main>
<script src="/assets/i18n.js"></script><script src="/assets/app.js"></script>
<script>
const sessionId = qs('session');
const SECTION_ORDER = ['Lesen','Hören','Sprachbausteine','Schreiben'];
const SECTION_LABEL = {Lesen:'Lesen',Hören:'Hören',Sprachbausteine:'Sprachbausteine',Schreiben:'Schreiben'};
const state = {session:null,models:{},currentIndex:0,timerHandle:null,finishing:false};
const app = document.getElementById('app');
var text = window.text || ((ar,de)=>getLang()==='ar'?ar:de);

function escBody(v){return esc(v||'').replace(/\n/g,'<br>')}
function getSession(){
  try{
    const s = JSON.parse(localStorage.getItem('telc_mock_exam')||'null');
    return s && s.id === sessionId ? s : null;
  }catch{return null;}
}
function saveSession(){
  if(!state.session) return;
  state.session.currentIndex = state.currentIndex;
  localStorage.setItem('telc_mock_exam', JSON.stringify(state.session));
}
function currentTask(){return state.session?.tasks?.[state.currentIndex]}
function currentSection(){return currentTask()?.section||'Lesen'}
function sectionIndexes(section){return (state.session?.tasks||[]).map((x,i)=>x.section===section?i:-1).filter(i=>i>=0)}
function remaining(){return Math.max(0,Math.ceil((Number(state.session?.examEndsAt||0)-Date.now())/1000))}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function tick(){
  const n = remaining();
  const el = document.getElementById('examTimer');
  if(el){el.textContent=formatTime(n);el.classList.toggle('danger',n<=300)}
  if(n<=0){finishExam();return}
  state.timerHandle = setTimeout(tick, 500);
}
function sectionFirstIndex(section){const i = (state.session?.tasks||[]).findIndex(x=>x.section===section);return i<0?0:i}
function jumpToSection(section){
  const i = sectionFirstIndex(section);
  if(i<0) return;
  persistCurrent();
  state.currentIndex = i;
  render();
}
function renderTabs(){
  const tabs = document.getElementById('mockTabs');
  if(!tabs) return;
  tabs.innerHTML = SECTION_ORDER.map(s=>{
    const inds = sectionIndexes(s);
    const exists = inds.length > 0;
    return `<button class="mock-tab ${currentSection()===s?'active':''}" data-section="${s}" ${exists?'':'disabled'}>${SECTION_LABEL[s]}<small>${exists?inds.length+' Aufgabe':'nicht verfügbar'}</small></button>`;
  }).join('');
  document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>jumpToSection(b.dataset.section));
}
function baseShell(inner){
  const sec = currentSection();
  const inds = sectionIndexes(sec);
  const local = Math.max(0, inds.indexOf(state.currentIndex));
  const total = inds.length;
  const pct = total ? ((local+1)/total)*100 : 0;
  return `
    <div class="mock-progress">
      <strong>${esc(SECTION_LABEL[sec])}</strong>
      <span class="muted">${local+1} / ${total}</span>
      <div class="mock-progress-bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="mock-card">${inner}</div>`;
}

function itemAnswer(id){return state.session?.answersByExercise?.[String(id)]||{}}

function parseSettings(x){
  if(!x||!x.settings_json)return {};
  if(typeof x.settings_json==='object')return x.settings_json;
  try{return JSON.parse(x.settings_json);}catch(_){return {};}
}

function getExerciseBody(model){
  const ex = model?.exercise || {};
  const st = parseSettings(ex);
  const candidates = [
    ex.body,
    ex.instructions,
    st.text,
    st.body,
    st.passage,
    st.reading_text,
    st.reading,
    st.article,
    st.content,
    st.situation,
    st.situation_text,
    st.thema_text,
    model?.items?.[0]?.body,
    ...(Array.isArray(model?.items) ? model.items.map(it => it?.body).filter(Boolean) : [])
  ];
  for (const c of candidates) {
    if (typeof c === 'string' && c.trim()) return c.trim();
  }
  return '';
}


function formatAudioTime(seconds){
  const n=Number(seconds);
  if(!Number.isFinite(n)||n<0)return '0:00';
  return Math.floor(n/60)+':'+Math.floor(n%60).toString().padStart(2,'0');
}
function renderUnifiedAudioPlayer(audioUrl) {
  const hasAudio = Boolean(String(audioUrl || '').trim());
  if (!hasAudio) {
    return `
      <div class="hoeren-audio-player-card is-unavailable" data-hoeren-player>
        <div class="hoeren-audio-unavailable" role="status">
          <span class="hoeren-audio-unavailable-icon" aria-hidden="true">♪</span>
          <div>
            <strong>${text('الصوت غير متوفر', 'Audio nicht verfügbar')}</strong>
            <small>${text('لا يوجد ملف صوتي لهذا الامتحان حالياً.', 'Für diese Prüfung ist derzeit keine Audiodatei verfügbar.')}</small>
          </div>
        </div>
      </div>`;
  }
  return `
    <div class="hoeren-audio-player-card" data-hoeren-player>
      <audio class="hoeren-native-audio" preload="metadata" src="${esc(audioUrl)}"></audio>
      <div class="hoeren-audio-controls-group">
        <button type="button" class="hoeren-audio-play" data-audio-play aria-label="${text('تشغيل الصوت','Audio abspielen')}" title="${text('تشغيل / إيقاف مؤقت','Abspielen / Pause')}">
          <span class="hoeren-audio-play-icon" aria-hidden="true">▶</span>
        </button>
        <button type="button" class="hoeren-audio-icon-btn hoeren-audio-skip-btn" data-audio-skip="-5" title="${text('تراجع 5 ثوانٍ','5s zurück')}" aria-label="${text('تراجع 5 ثوانٍ','5s zurück')}">
          <span>↺ 5s</span>
        </button>
        <button type="button" class="hoeren-audio-icon-btn hoeren-audio-skip-btn" data-audio-skip="5" title="${text('تقدم 5 ثوانٍ','5s vor')}" aria-label="${text('تقدم 5 ثوانٍ','5s vor')}">
          <span>5s ↻</span>
        </button>
      </div>
      <div class="hoeren-audio-main">
        <div class="hoeren-audio-topline">
          <span class="hoeren-audio-label">${text('الملف الصوتي TELC Hören','Audiodatei TELC Hören')}</span>
          <span class="hoeren-audio-time"><span data-audio-current>0:00</span><span> / </span><span data-audio-duration>0:00</span></span>
        </div>
        <input class="hoeren-audio-progress" data-audio-progress type="range" min="0" max="100" value="0" step="0.1" aria-label="${text('تقدم الصوت','Audiofortschritt')}">
      </div>
      <div class="hoeren-audio-actions">

function bindHoerenAudioPlayer(){
  const cards=document.querySelectorAll('[data-hoeren-player]');
  cards.forEach(card => {
    const audio=card.querySelector('.hoeren-native-audio');
    const play=card.querySelector('[data-audio-play]');
    const icon=card.querySelector('.hoeren-audio-play-icon');
    const progress=card.querySelector('[data-audio-progress]');
    const current=card.querySelector('[data-audio-current]');
    const durationEl=card.querySelector('[data-audio-duration]');
    const mute=card.querySelector('[data-audio-mute]');
    const volume=card.querySelector('[data-audio-volume]');
    const volumeIcon=card.querySelector('[data-audio-volume-icon]');
    const speedBtn=card.querySelector('[data-audio-speed]');
    const speedLabel=card.querySelector('[data-audio-speed-label]');
    const skipBtns=card.querySelectorAll('[data-audio-skip]');
    if(!audio||!play)return;
    const markUnavailable=()=>{
      card.classList.add('is-unavailable');
      card.innerHTML = `<div class="hoeren-audio-unavailable" role="status"><span class="hoeren-audio-unavailable-icon" aria-hidden="true">♪</span><div><strong>${text('الصوت غير متوفر','Audio nicht verfügbar')}</strong><small>${text('تعذر تحميل الملف الصوتي لهذا الامتحان.','Die Audiodatei für diese Prüfung konnte nicht geladen werden.')}</small></div></div>`;
    };
    audio.addEventListener('error', markUnavailable, {once:true});
    const sync=()=>{ if(card.classList.contains('is-unavailable')) return;
      const dur=Number.isFinite(audio.duration)?audio.duration:0;
      current.textContent=formatAudioTime(audio.currentTime);
      durationEl.textContent=formatAudioTime(dur);
      const pct = dur ? (audio.currentTime / dur * 100) : 0;
      progress.value = pct;
      progress.style.background = `linear-gradient(to right, var(--green) 0%, var(--green) ${pct}%, var(--line) ${pct}%, var(--line) 100%)`;
      icon.textContent=audio.paused?'▶':'❚❚';
      card.classList.toggle('is-playing',!audio.paused);
      play.setAttribute('aria-label',audio.paused?text('تشغيل الصوت','Audio abspielen'):text('إيقاف مؤقت','Pause'));
    };
    const syncVolume=()=>{
      const v=audio.muted?0:audio.volume;
      if (volume) {
        volume.value=v;
        const vPct = v * 100;
        volume.style.background = `linear-gradient(to right, var(--green) 0%, var(--green) ${vPct}%, var(--line) ${vPct}%, var(--line) 100%)`;
      }
      if (volumeIcon) volumeIcon.textContent=v===0?'🔇':v<.5?'🔉':'🔊';
    };
    play.onclick=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();
    audio.addEventListener('loadedmetadata',sync); audio.addEventListener('timeupdate',sync); audio.addEventListener('play',sync); audio.addEventListener('pause',sync); audio.addEventListener('ended',sync);
    progress.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(progress.value)/100*audio.duration;};
    if (volume) volume.oninput=()=>{audio.muted=false;audio.volume=Number(volume.value);syncVolume();};
    if (mute) mute.onclick=()=>{audio.muted=!audio.muted;syncVolume();};
    if (speedBtn) {
      const speeds = [1, 1.2, 0.8];
      let sIdx = 0;
      speedBtn.onclick=()=>{
        sIdx = (sIdx + 1) % speeds.length;
        audio.playbackRate = speeds[sIdx];
        if (speedLabel) speedLabel.textContent = speeds[sIdx] + 'x';
      };
    }
    skipBtns.forEach(sb => {
      sb.onclick=()=>{
        const delta = Number(sb.dataset.audioSkip || 0);
        if (Number.isFinite(audio.currentTime)) audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + delta));
      };
    });
    sync();
    syncVolume();
  });
}

function getExerciseHeadings(model){
  const ex = model?.exercise || {};
  const st = parseSettings(ex);
  if (Array.isArray(st.headings) && st.headings.filter(Boolean).length) return st.headings.filter(Boolean);
  if (Array.isArray(ex.headings) && ex.headings.filter(Boolean).length) return ex.headings.filter(Boolean);
  if (Array.isArray(st.situations) && st.situations.filter(Boolean).length) return st.situations.filter(Boolean);
  if (Array.isArray(st.anzeigen) && st.anzeigen.filter(Boolean).length) return st.anzeigen.filter(Boolean);
  if (Array.isArray(st.ads) && st.ads.filter(Boolean).length) return st.ads.filter(Boolean);

  const optMap = new Map();
  (model?.items || []).forEach(it => {
    (it.options || []).forEach(o => {
      const k = String(o.option_key || '').trim().toUpperCase();
      const txt = String(o.option_text || '').trim();
      if (k && !optMap.has(k)) optMap.set(k, txt || k);
    });
  });
  if (optMap.size > 0) return [...optMap.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(e=>e[1]);
  return [];
}

function parseAdText(raw){
  if(!raw) return {title:'', body:''};
  if(typeof raw === 'object') return {title: String(raw.title||raw.ad_title||'').trim(), body: String(raw.body||raw.text||raw.content||'').trim()};
  const str = String(raw).trim();
  const nl = str.indexOf('\n');
  if(nl !== -1) return { title: str.slice(0, nl).trim(), body: str.slice(nl+1).trim() };
  return { title: str, body: '' };
}

function sharedOptions(model){
  const ex = model?.exercise || {};
  const st = parseSettings(ex);
  if (Array.isArray(st.shared_options)) return st.shared_options.map((o,i)=>[String(o.key||String.fromCharCode(97+i)), String(o.text||o)]);
  if (Array.isArray(ex.shared_options_json)) return ex.shared_options_json.map((o,i)=>[String(o.key||String.fromCharCode(97+i)), String(o.text||o)]);
  const map = new Map();
  (model.items||[]).forEach(it=>(it.options||[]).forEach(o=>{
    if(o.option_text && !map.has(o.option_key)) map.set(o.option_key, o.option_text);
  }));
  return [...map.entries()];
}

/* ─── Task Content Dispatcher ─── */
function renderTaskContent(model){
  const ex = model?.exercise || {};
  const sec = ex.section || '';
  const teil = ex.teil || '';
  const ttype = ex.task_type || '';

  if (sec === 'Schreiben' || ttype === 'WRITING') return renderWriting(model);
  if (sec === 'Sprachbausteine') {
    if (teil === 'Teil 1') return renderMockSpb1(model);
    if (teil === 'Teil 2') return renderMockSpb2(model);
  }
  if (sec === 'Lesen') {
    if (teil === 'Teil 1') return renderMockLesen1(model);
    if (teil === 'Teil 2') return renderMockLesen2(model);
    if (teil === 'Teil 3') return renderMockLesen3(model);
  }
  if (sec === 'Hören') return renderMockHoeren(model);
  return renderChoice(model);
}

function bind(){
  bindHoerenAudioPlayer();
  // Two-way sync for gap selects and option buttons
  document.querySelectorAll('[data-answer-q]').forEach(el => {
    const handleAnswer = () => {
      const q = String(el.dataset.answerQ);
      const val = el.dataset.answer !== undefined ? el.dataset.answer : el.value;
      window.__mockAnswers = window.__mockAnswers || {};
      window.__mockAnswers[q] = val || '';
      const taskObj = currentTask();
      const mObj = state.models[taskObj.id];
      const isL3 = mObj?.exercise?.section === 'Lesen' && mObj?.exercise?.teil === 'Teil 3';
      if (isL3 && val && String(val).toUpperCase() !== 'X') {
        Object.keys(window.__mockAnswers).forEach(k => {
          if (k !== q && String(window.__mockAnswers[k]).toUpperCase() === String(val).toUpperCase()) {
            delete window.__mockAnswers[k];
          }
        });
      }
      state.session.answersByExercise[String(currentTask().id)] = {...window.__mockAnswers};
      saveSession();

      // Sync inline select if an option button was clicked
      const gapSel = document.querySelector(`select[data-gap-q="${CSS.escape(q)}"]`);
      if (gapSel && gapSel.value !== val) {
        gapSel.value = val;
        gapSel.classList.toggle('answered', Boolean(val));
      }

      // Sync option buttons if select was changed
      document.querySelectorAll(`button[data-answer-q="${CSS.escape(q)}"]`).forEach(b => {
        const isMatch = String(b.dataset.answer).toLowerCase() === String(val).toLowerCase();
        b.classList.toggle('selected', isMatch);
      });

      // Update word bank used status if on Sprachbausteine 2
      document.querySelectorAll('.mock-word-card').forEach(card => {
        const key = card.dataset.wordKey;
        const isUsed = Object.values(window.__mockAnswers).some(ans => String(ans).toLowerCase() === String(key).toLowerCase());
        card.classList.toggle('used', isUsed);
      });
    };

    if (el.tagName === 'SELECT') {
      el.onchange = handleAnswer;
    } else {
      el.onclick = handleAnswer;
    }
  });

    document.querySelectorAll('[data-mock-ad-select]').forEach(sel => sel.onchange = () => {
    const letter = sel.dataset.mockAdSelect;
    const sitNo = sel.value;
    const task = currentTask();
    const m = state.models[task.id];
    const items = m?.items || [];
    window.__mockAnswers = window.__mockAnswers || {};

    items.forEach(it => {
      const q = String(it.position_no);
      if (String(window.__mockAnswers[q] || '').toUpperCase() === letter) {
        delete window.__mockAnswers[q];
      }
    });

    if (sitNo && sitNo !== 'X') {
      window.__mockAnswers[sitNo] = letter;
    }

    state.session.answersByExercise[String(task.id)] = {...window.__mockAnswers};
    saveSession();
    render();
  });
  const ta = document.getElementById('writingAnswer');
  if (ta) {
    const update = () => {
      const words = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
      document.getElementById('writingWords').textContent = words + ' Wörter';
      state.session.writingByExercise[String(currentTask().id)] = ta.value;
      saveSession();
    };
    ta.oninput = update;
    update();
  }

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.onclick = prev;
  if (nextBtn) nextBtn.onclick = next;
}

function persistCurrent(){
  const task = currentTask();
  if(!task) return;
  const m = state.models[task.id];
  if(!m) return;
  state.session.answersByExercise = state.session.answersByExercise || {};
  state.session.writingByExercise = state.session.writingByExercise || {};
  if (window.__mockAnswers) state.session.answersByExercise[String(m.exercise.id)] = {...window.__mockAnswers};
  const ta = document.getElementById('writingAnswer');
  if (ta) state.session.writingByExercise[String(m.exercise.id)] = ta.value;
  saveSession();
}

function next(){
  persistCurrent();
  if (state.currentIndex < state.session.tasks.length - 1) {
    state.currentIndex++;
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }
  finishExam();
}

function prev(){
  persistCurrent();
  if (state.currentIndex > 0) {
    state.currentIndex--;
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

async function loadModel(id){
  if(state.models[id]) return state.models[id];
  const m = await api('exercise-get?id=' + encodeURIComponent(id));
  state.models[id] = m;
  return m;
}

async function render(){
  clearTimeout(state.timerHandle);
  renderTabs();
  const task = currentTask();
  if(!task) return finishExam();
  tick();

  const model = await loadModel(task.id);
  const inner = renderTaskContent(model);
  app.innerHTML = inner + `<div class="mock-error" id="mockError"></div>`;

  const isFirst = state.currentIndex === 0;
  const isLast = state.currentIndex === state.session.tasks.length - 1;

  document.querySelector('.mock-actions')?.remove();
  const nextBtnLabel = isLast ? text('حفظ وإنهاء الامتحان وعرض النتيجة 🏁', 'Prüfung beenden und Ergebnis anzeigen 🏁') : text('التالي →', 'Weiter →');
  const prevBtnLabel = text('← السابق', '← Zurück');

  document.body.insertAdjacentHTML('beforeend', `
    <div class="mock-actions">
      <div class="mock-actions-inner">
        <button id="prevBtn" class="mock-nav-btn light" ${isFirst ? 'disabled' : ''}>
          ${prevBtnLabel}
        </button>
        <button id="nextBtn" class="mock-nav-btn ${isLast ? 'btn-finish-mock' : 'dark'}">
          ${nextBtnLabel}
        </button>
      </div>
    </div>
  `);
  bind();
}

async function finishExam(){
  if(state.finishing) return;
  state.finishing = true;
  persistCurrent();
  clearTimeout(state.timerHandle);
  document.querySelector('.mock-actions')?.remove();
  app.innerHTML = `
    <div class="mock-finish">
      <div class="spinner"></div>
      <h2>${text('جارٍ تصحيح الامتحان وحساب النتائج…', 'Prüfung wird korrigiert…')}</h2>
      <p class="muted">${text('يتم الآن فحص الإجابات ومطابقتها وفق معايير TELC الرسمية وتقييم Schriftlicher Ausdruck…', 'Antworten werden nach offiziellen TELC-Kriterien ausgewertet…')}</p>
    </div>`;

  try {
    const tasks = state.session.tasks.map(t => ({
      id: t.id,
      section: t.section,
      teil: t.teil,
      answers: state.session.answersByExercise?.[String(t.id)] || {}
    }));

    const objective = await api('mock-submit', {
      method: 'POST',
      body: { level: state.session.level, tasks }
    });

    const result = {
      level: state.session.level,
      sections: { ...(objective.sections || {}) },
      finishedAt: Date.now(),
      writing: null,
      totalMax: 225
    };

    const w = state.session.tasks.find(t => t.section === 'Schreiben');
    if (w) {
      const answer = state.session.writingByExercise?.[String(w.id)] || '';
      if (answer.trim()) {
        try {
          const r = await api('ai-writing-correct', { method: 'POST', body: { exercise_id: w.id, answer } });
          result.writing = {
            score: Number(r.overall_score || 0),
            max: 45,
            percent: Number(r.max_score ? ((r.overall_score || 0) / r.max_score * 100) : 0),
            criteria: r.criteria || [],
            summary_ar: r.summary_ar || '',
            summary_de: r.summary_de || ''
          };
        } catch(e) {
          result.writing = { score: 0, max: 45, percent: 0, error: e.message };
        }
      } else {
        result.writing = { score: 0, max: 45, percent: 0, error: 'empty' };
      }
      result.sections.Schreiben = { score: result.writing.score, max: 45, percent: result.writing.percent };
    }

    localStorage.setItem('telc_mock_result', JSON.stringify(result));
    localStorage.removeItem('telc_mock_exam');
    location.href = '/self-test-result.html?mock=1';
  } catch(e) {
    state.finishing = false;
    app.innerHTML = `
      <div class="alert bad" style="max-width:700px;margin:40px auto;padding:20px;border-radius:16px;">
        <h3>${text('تعذر تصحيح الامتحان', 'Fehler bei der Korrektur')}</h3>
        <p>${esc(e.message || text('حدث خطأ أثناء التصحيح', 'Ein Fehler ist aufgetreten'))}</p>
        <div style="text-align:center;margin-top:20px">
          <button class="btn" onclick="finishExam()">${text('إعادة المحاولة', 'Wiederholen')}</button>
          <button class="btn light" style="margin-inline-start:10px" onclick="location.reload()">${text('العودة للأسئلة', 'Zurück zu den Aufgaben')}</button>
        </div>
      </div>`;
  }
}

  document.documentElement.setAttribute('dir','ltr');
  document.body.setAttribute('dir','ltr');
  document.documentElement.classList.add('mock-ltr');
}

  enforceMockLTR();
  render();

(async () => {
  state.session = getSession();
  if (!state.session) { location.href = '/dashboard.html'; return; }
  state.session.tasks = (state.session.tasks || []).filter(t => SECTION_ORDER.includes(t.section));
  if (!state.session.tasks.length) { location.href = '/self-test.html'; return; }
  state.currentIndex = Math.min(Number(state.session.currentIndex) || 0, state.session.tasks.length - 1);
  if (Number(state.session.examDurationSeconds) !== 8400 || !Number(state.session.examEndsAt)) {
    state.session.examDurationSeconds = 8400;
    state.session.examEndsAt = Number(state.session.startedAt || Date.now()) + 8400 * 1000;
    saveSession();
  }
  await render();
})();
</script>
</body>
</html>
