<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب جديد | TELC Voll</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style>
.auth-page{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg)}
.auth-nav{padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.auth-box-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,34px);width:min(520px,100%);box-shadow:var(--shadow-lg);box-sizing:border-box}
.auth-card-head{margin-bottom:20px;text-align:center}
.auth-card-head .tag{margin-bottom:8px}
.auth-card-head h1{font-size:26px;margin:6px 0 6px;color:var(--ink);letter-spacing:-.03em}
.auth-card-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:12px;font-weight:900;color:var(--ink);margin-bottom:6px}
.auth-field input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:var(--bg);color:var(--ink);transition:border-color .2s}
.auth-field input:focus{border-color:var(--green);outline:none;background:var(--white)}
.password-wrap{position:relative}
.password-toggle{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
[dir="ltr"] .password-toggle{left:auto;right:12px}
.auth-submit-btn{width:100%;padding:13px;font-size:15px;font-weight:900;border-radius:12px;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:var(--muted);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.google-btn{width:100%;background:var(--white);border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:12px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-sizing:border-box;transition:border-color .2s,background .2s}
.google-btn:hover{border-color:#cbd5e1;background:#f8fafc}
.google-btn svg{width:18px;height:18px;flex-shrink:0}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.auth-switch a{color:var(--green);font-weight:900;text-decoration:none}
.auth-switch a:hover{text-decoration:underline}
.alert-box{margin-bottom:16px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:800}
.alert-box.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-box.good{background:#e8f7ee;color:#0e7039;border:1px solid #b7ebc7}
.auth-footer{text-align:center;padding:18px;font-size:12px;color:var(--muted)}
@media(max-width:540px){.grid-2{grid-template-columns:1fr}}
/* Autofill fix for light & dark mode */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 1000px var(--bg) inset !important;
  -webkit-text-fill-color: var(--ink) !important;
  caret-color: var(--ink);
  transition: background-color 5000s ease-in-out 0s;
}
.apple-btn{width:100%;background:var(--white);border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:12px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-sizing:border-box;transition:border-color .2s,background .2s}
.apple-btn:hover{border-color:#cbd5e1;background:#f8fafc}
.social-login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:440px){.social-login-grid{grid-template-columns:1fr}}
</style>
<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
<header class="auth-nav">
  <a class="brand" href="/" aria-label="TELC Voll"><span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span></a>
  <div class="header-actions" style="display:flex;gap:10px;align-items:center;">
    <a href="/login.html" class="btn small-btn light">تسجيل الدخول</a>
  </div>
</header>

<main class="auth-box-wrap">
  <div class="auth-card">
    <div class="auth-card-head">
      <span class="tag">حساب طالب جديد</span>
      <h1>إنشاء حساب مجاني</h1>
      <p>ابدأ التدرب فوراً على التمارين المجانية في جميع المهارات بدون قيود.</p>
    </div>

    <div id="alertBox"></div>

    <!-- Quick Social Sign-Up (Google + Apple) -->
    <div class="social-login-grid">
      <div id="googleBtnWrap">
        <div id="g_id_onload"></div>
        <div id="googleBtnCustom" class="google-btn">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </div>
        <div id="googleOfficialBtn" style="display:none;width:100%;margin-top:6px;"></div>
      </div>

      <div id="appleBtnCustom" class="apple-btn">
        <svg viewBox="0 0 170 170" width="18" height="18" fill="currentColor">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.6-7.7-11.71-13.98-5.44-8.38-9.75-17.76-12.93-28.14-3.18-10.37-4.77-20.3-4.77-29.8 0-14.67 3.73-26.69 11.19-36.08 7.46-9.39 16.63-14.16 27.5-14.33 5.43 0 11.13 1.34 17.11 4.02 5.97 2.68 9.77 4.09 11.4 4.23 2.12-.34 6.13-1.85 12.03-4.53 5.9-2.68 11.23-3.9 15.99-3.68 11.58.67 20.73 4.87 27.46 12.61-10.05 6.08-14.98 14.51-14.79 25.29.2 8.38 3.39 15.42 9.57 21.13 6.18 5.71 13.59 9.07 22.24 10.09-2.23 6.94-4.8 13.78-7.7 20.52zM119.22 33.15c0-6.72 2.45-13.11 7.35-19.16 4.9-6.06 11.08-9.99 18.54-11.79.56 1.45.84 2.9.84 4.35 0 6.6-2.52 13.06-7.56 19.38-5.04 6.32-11.23 10.22-18.57 11.69-.22-1.45-.6-3.03-.6-4.47z"/>
        </svg>
        <span>Apple</span>
      </div>
    </div>

    <div class="auth-divider">أو عبر البيانات الشخصية</div>

    <!-- Registration Form -->
    <form id="regForm" autocomplete="on">
      <div class="grid-2">
        <div class="auth-field">
          <label for="firstName">الاسم الأول *</label>
          <input type="text" id="firstName" name="firstName" required placeholder="مثال: اسمك" autocomplete="given-name">
        </div>
        <div class="auth-field">
          <label for="lastName">اللقب / العائلة</label>
          <input type="text" id="lastName" name="lastName" placeholder="مثال: لقبك" autocomplete="family-name">
        </div>
      </div>

      <div class="auth-field">
        <label for="email">البريد الإلكتروني *</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email" dir="ltr" style="text-align:right;">
      </div>

      <div class="auth-field">
        <label for="phone">رقم الهاتف (اختياري)</label>
        <input type="tel" id="phone" name="phone" placeholder="05 / 06 / 07XXXXXXXX" autocomplete="tel" dir="ltr" style="text-align:right;">
      </div>

      <div class="grid-2">
        <div class="auth-field">
          <label for="password">كلمة المرور (6 أحرف فأكثر) *</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••" autocomplete="new-password" dir="ltr" style="text-align:right;">
            <button type="button" class="password-toggle" id="togglePassword">👁</button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirmPassword">تأكيد كلمة المرور *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="••••••••" autocomplete="new-password" dir="ltr" style="text-align:right;">
        </div>
      </div>

      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;cursor:pointer;margin:12px 0 16px;color:var(--muted);line-height:1.5;">
        <input type="checkbox" id="termsCheck" required style="margin-top:2px;accent-color:var(--green);">
        <span>أوافق على <a href="/#about" target="_blank" style="color:var(--green);font-weight:700;">شروط الاستخدام</a> وسياسة الخصوصية لمنصة TELC Voll.</span>
      </label>

      <button type="submit" id="submitBtn" class="btn auth-submit-btn">
        <span>إنشاء الحساب والبدء مجاناً</span>
        <span>←</span>
      </button>
    </form>

    <div class="auth-switch">
      لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a>
    </div>
  </div>
</main>

<footer class="auth-footer">
  TELC Voll — منصة التدريب والتحضير لامتحانات اللغة الألمانية B1 · B2 · C1
</footer>

<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
const $ = id => document.getElementById(id);
const alertBox = $('alertBox');

function showAlert(msg, bad=true) {
  alertBox.innerHTML = `<div class="alert-box ${bad ? 'bad' : 'good'}">${esc(msg)}</div>`;
}
function clearAlert() { alertBox.innerHTML = ''; }

// Toggle password
$('togglePassword').onclick = () => {
  const p = $('password');
  const isPwd = p.type === 'password';
  p.type = isPwd ? 'text' : 'password';
  $('togglePassword').textContent = isPwd ? '🙈' : '👁';
};

// Handle Registration
$('regForm').onsubmit = async (e) => {
  e.preventDefault();
  clearAlert();

  const firstName = $('firstName').value.trim();
  const lastName = $('lastName').value.trim();
  const email = $('email').value.trim();
  const phone = $('phone').value.trim();
  const password = $('password').value;
  const confirmPassword = $('confirmPassword').value;

  if (!firstName) {
    showAlert('يرجى إدخال الاسم الأول.');
    return;
  }
  if (!email || !email.includes('@')) {
    showAlert('يرجى إدخال بريد إلكتروني صحيح.');
    return;
  }
  if (password.length < 6) {
    showAlert('كلمة المرور يجب أن تتكون من 6 أحرف أو أرقام على الأقل.');
    return;
  }
  if (password !== confirmPassword) {
    showAlert('كلمتا المرور غير متطابقتين.');
    return;
  }

  const submitBtn = $('submitBtn');
  submitBtn.disabled = true;
  submitBtn.style.opacity = '0.7';
  const originalHtml = submitBtn.innerHTML;
  submitBtn.innerHTML = '<span>جارٍ إنشاء الحساب…</span>';

  try {
    const res = await api('auth-register', {
      method: 'POST',
      body: {
        firstName,
        lastName,
        first_name: firstName,
        last_name: lastName,
        name: [firstName, lastName].filter(Boolean).join(' ') || firstName,
        email,
        phone,
        password
      }
    });

    if (res.token) {
      try { localStorage.setItem('telc_student_token', res.token); } catch (_) {}
    }

    let redirectUrl = qs('redirect');
    let hasPendingCheckout = false;
    try { hasPendingCheckout = !!sessionStorage.getItem('telc_pending_checkout'); } catch (_) {}

    if (hasPendingCheckout || redirectUrl === 'checkout') {
      location.href = '/#plans?checkout=1';
    } else if (redirectUrl) {
      location.href = redirectUrl;
    } else if (res.verification_sent) {
      location.href = `/verify-email.html?email=${encodeURIComponent(email)}`;
    } else {
      location.href = '/dashboard.html?new_user=1';
    }
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.style.opacity = '1';
    submitBtn.innerHTML = originalHtml;

    const code = err.data?.error || err.message;
    if (code === 'email_already_registered') {
      showAlert('هذا البريد الإلكتروني مسجل بالفعل. يرجى تسجيل الدخول أو استخدام خيار استعادة كلمة المرور.');
    } else {
      showAlert(err.data?.error || err.message || 'تعذر إنشاء الحساب. يرجى المحاولة مرة أخرى.');
    }
  }
};

// Handle Post-Auth Routing
function routeAfterAuth() {
  let redirectUrl = qs('redirect');
  let hasPendingCheckout = false;
  try { hasPendingCheckout = !!sessionStorage.getItem('telc_pending_checkout'); } catch (_) {}

  if (hasPendingCheckout || redirectUrl === 'checkout') {
    location.href = '/#plans?checkout=1';
  } else if (redirectUrl) {
    location.href = redirectUrl;
  } else {
    location.href = '/dashboard.html?new_user=1';
  }
}

// Google SSO
async function handleGoogleCredential(credential) {
  clearAlert();
  showAlert('جارٍ إنشاء الحساب عبر Google…', false);

  try {
    const res = await api('auth-google', {
      method: 'POST',
      body: { credential }
    });

    if (res.token) {
      try { localStorage.setItem('telc_student_token', res.token); } catch (_) {}
    }

    routeAfterAuth();
  } catch (err) {
    showAlert(err.data?.message || err.data?.error || 'فشل التسجيل عبر Google.');
  }
}

// Apple SSO
$('appleBtnCustom').onclick = () => {
  showAlert('التسجيل عبر Apple يتطلب ضبط معرّف الخدمة. يمكنك التسجيل الفوري بالبريد أو Google مجاناً وبدون قيود.');
};

api('auth-config').then(cfg => {
  if (cfg.googleClientId && window.google) {
    window.google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: (resp) => {
        if (resp.credential) handleGoogleCredential(resp.credential);
      }
    });

    const customBtn = $('googleBtnCustom');
    if (customBtn) {
      customBtn.onclick = () => window.google.accounts.id.prompt();
    }

    const officialBtnEl = $('googleOfficialBtn');
    if (officialBtnEl) {
      officialBtnEl.style.display = 'block';
      if (customBtn) customBtn.style.display = 'none';
      window.google.accounts.id.renderButton(officialBtnEl, {
        theme: 'outline',
        size: 'large',
        width: '100%',
        text: 'signup_with',
        locale: 'ar'
      });
    }
  } else {
    $('googleBtnCustom').onclick = () => {
      showAlert('تسجيل الدخول عبر Google سيتوفر قريباً بعد ضبط معرّف العميل. يمكنك إنشاء حسابك بالبريد وكلمة المرور فوراً.');
    };
  }
}).catch(() => {
  $('googleBtnCustom').onclick = () => {
    showAlert('تسجيل الدخول عبر Google سيتوفر قريباً. يمكنك إنشاء حسابك بالبريد وكلمة المرور فوراً.');
  };
});
</script>
</body>
</html>
