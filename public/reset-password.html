<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعيين كلمة مرور جديدة | TELC Voll</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style>
.auth-page{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg)}
.auth-nav{padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.auth-box-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,34px);width:min(480px,100%);box-shadow:var(--shadow-lg);box-sizing:border-box}
.auth-card-head{margin-bottom:22px;text-align:center}
.auth-card-head .tag{margin-bottom:8px}
.auth-card-head h1{font-size:24px;margin:6px 0 6px;color:var(--ink);letter-spacing:-.03em}
.auth-card-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:12px;font-weight:900;color:var(--ink);margin-bottom:6px}
.auth-field input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:var(--bg);color:var(--ink);transition:border-color .2s}
.auth-field input:focus{border-color:var(--green);outline:none;background:var(--white)}
.password-wrap{position:relative}
.password-toggle{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
[dir="ltr"] .password-toggle{left:auto;right:12px}
.auth-submit-btn{width:100%;padding:13px;font-size:15px;font-weight:900;border-radius:12px;display:flex;justify-content:center;align-items:center;gap:8px}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.auth-switch a{color:var(--green);font-weight:900;text-decoration:none}
.auth-switch a:hover{text-decoration:underline}
.alert-box{margin-bottom:16px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:800;line-height:1.6}
.alert-box.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-box.good{background:#e8f7ee;color:#0e7039;border:1px solid #b7ebc7}
.auth-footer{text-align:center;padding:18px;font-size:12px;color:var(--muted)}
</style>
<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>
</head>
<body class="auth-page">
<header class="auth-nav">
  <a class="brand" href="/" aria-label="TELC Voll"><span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span></a>
</header>

<main class="auth-box-wrap">
  <div class="auth-card">
    <div class="auth-card-head">
      <span class="tag">أمان الحساب</span>
      <h1>تعيين كلمة مرور جديدة</h1>
      <p>اختر كلمة مرور قوية وجديدة لحسابك في TELC Voll.</p>
    </div>

    <div id="alertBox"></div>

    <form id="resetForm">
      <div class="auth-field">
        <label for="password">كلمة المرور الجديدة (6 أحرف فأكثر) *</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••" autocomplete="new-password" dir="ltr" style="text-align:right;">
          <button type="button" class="password-toggle" id="togglePassword">👁</button>
        </div>
      </div>

      <div class="auth-field">
        <label for="confirmPassword">تأكيد كلمة المرور الجديدة *</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="••••••••" autocomplete="new-password" dir="ltr" style="text-align:right;">
      </div>

      <button type="submit" id="submitBtn" class="btn auth-submit-btn">
        <span>تحديث كلمة المرور والدخول</span>
        <span>←</span>
      </button>
    </form>

    <div class="auth-switch">
      <a href="/login.html">العودة لصفحة تسجيل الدخول</a>
    </div>
  </div>
</main>

<footer class="auth-footer">
  TELC Voll — منصة التدريب والتحضير لامتحانات اللغة الألمانية B1 · B2 · C1
</footer>

<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
const $ = id => document.getElementById(id);
const alertBox = $('alertBox');

function showAlert(msg, bad=true) {
  alertBox.innerHTML = `<div class="alert-box ${bad ? 'bad' : 'good'}">${esc(msg)}</div>`;
}

const token = qs('token');
if (!token) {
  showAlert('رابط إعادة تعيين كلمة المرور غير صالح أو مفقود. يرجى طلب رابط جديد.');
  $('resetForm').style.display = 'none';
}

// Toggle password
$('togglePassword').onclick = () => {
  const p = $('password');
  const isPwd = p.type === 'password';
  p.type = isPwd ? 'text' : 'password';
  $('togglePassword').textContent = isPwd ? '🙈' : '👁';
};

$('resetForm').onsubmit = async (e) => {
  e.preventDefault();
  const password = $('password').value;
  const confirmPassword = $('confirmPassword').value;

  if (password.length < 6) {
    showAlert('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');
    return;
  }
  if (password !== confirmPassword) {
    showAlert('كلمتا المرور غير متطابقتين.');
    return;
  }

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.style.opacity = '0.7';
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<span>جارٍ التحديث…</span>';

  try {
    const res = await api('auth-reset-password', {
      method: 'POST',
      body: { token, password }
    });

    if (res.token) {
      try { localStorage.setItem('telc_student_token', res.token); } catch (_) {}
    }

    location.href = '/login.html?reset=1';
  } catch (err) {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.innerHTML = originalHtml;

    const code = err.data?.error || err.message;
    if (code === 'invalid_or_expired_token' || err.status === 400) {
      showAlert('انتهت صلاحية هذا الرابط أو تم استخدامه مسبقاً. يرجى طلب رابط جديد من صفحة نسيت كلمة المرور.');
    } else {
      showAlert(err.data?.error || err.message || 'فشل تحديث كلمة المرور.');
    }
  }
};
</script>
</body>
</html>
