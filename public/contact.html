<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14201D"><title>اتصل بنا — TELC Voll</title><link rel="stylesheet" href="/assets/app.css"><link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><style>
.contact-shell{max-width:900px;margin:auto}.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.contact-account{display:flex;text-decoration:none;color:inherit;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:var(--shadow);transition:.2s}.contact-account:hover{transform:translateY(-2px);border-color:var(--exercise-accent)}.contact-account{align-items:center;gap:14px;text-align:right;cursor:pointer}.contact-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--exercise-accent-soft);color:var(--exercise-accent);font-size:23px;font-weight:950;flex:none}.contact-icon svg{width:24px;height:24px;fill:currentColor;display:block}.contact-account strong{font-size:19px}.contact-account small{display:block;color:var(--muted);margin-top:5px}.contact-form{display:grid;gap:12px}.contact-form input,.contact-form select,.contact-form textarea{width:100%}.contact-form textarea{min-height:120px}.selected-contact{padding:10px 14px;border-radius:12px;background:var(--exercise-accent-soft);color:var(--exercise-accent);font-weight:800}@media(max-width:650px){.contact-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/">TELC Voll</a><nav><a href="/#plans">الخطط</a><a href="/contact.html">اتصل بنا</a></nav></header><main class="wrap contact-shell"><section class="panel"><span class="tag">TELC Voll</span><h1>اتصل بنا</h1><p class="muted">اختر وسيلة التواصل المناسبة، ثم املأ بيانات الطلب.</p><div id="accounts" class="contact-grid"><div class="card">جارٍ تحميل حسابات التواصل…</div></div><div id="formWrap" hidden><div class="selected-contact" id="selectedContact"></div><form id="contactForm" class="contact-form" style="margin-top:14px"><input name="name" placeholder="الاسم الكامل" required><select name="plan" id="planSelect" required><option value="">اختر الخطة</option></select><input name="country" placeholder="البلد" required><input name="contact" placeholder="رقمك أو بريدك الإلكتروني" required><textarea name="message" placeholder="رسالة إضافية (اختياري)"></textarea><button class="btn" type="submit">إرسال الطلب</button></form><div id="formMsg"></div></div></section></main><footer>TELC Voll — منصة تدريب B1 · B2 · C1</footer><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script>
let accounts=[];let chosen=null;const escv=s=>esc(s);const params=new URLSearchParams(location.search);
const DEFAULT_CONTACTS=[
  {id:'facebook',label:'Facebook',value:'TELC Voll',url:'https://www.facebook.com/TELCVoll',icon:'facebook',active:true},
  {id:'messenger',label:'Messenger',value:'TELC Voll',url:'https://m.me/TELCVoll',icon:'messenger',active:true}
];
function iconSvg(type){
  if(type==='messenger') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.477 3 2 6.94 2 11.8c0 2.77 1.45 5.22 3.72 6.75V22l3.3-1.81c.93.26 1.93.4 2.98.4 5.523 0 10-3.94 10-8.79S17.523 3 12 3Zm.55 12.12-2.56-2.73-5 2.73 5.53-5.87 2.56 2.73 4.98-2.73-5.51 5.87Z"/></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 21v-8h2.7l.4-3.1h-3.1V8c0-.9.25-1.5 1.55-1.5h1.65V3.72c-.29-.04-1.29-.12-2.47-.12-2.45 0-4.13 1.5-4.13 4.25v2.05H7.2V13H10v8h3.4Z"/></svg>';
}
async function load(){
  const [c,p]=await Promise.allSettled([api('public-contact'),api('public-plans')]);
  const remote=(c.status==='fulfilled'&&Array.isArray(c.value.accounts))?c.value.accounts:[];
  accounts=[...remote];
  for(const d of DEFAULT_CONTACTS){if(!accounts.some(a=>String(a.url||'').replace(/\/$/,'')===d.url))accounts.push(d);}
  accounts=accounts.filter(a=>a&&a.active!==false);
  accountsEl.innerHTML=accounts.map((a,i)=>`<a class="contact-account" href="${escv(a.url||'#')}" target="_blank" rel="noopener noreferrer" data-account="${i}"><span class="contact-icon ${escv(a.icon||'')}" aria-hidden="true">${iconSvg(a.icon)}</span><span><strong>${escv(a.label)}</strong><small>${escv(a.value)}</small></span></a>`).join('');
  const plans=p.status==='fulfilled'?(p.value.plans||[]):[];
  planSelect.innerHTML='<option value="">اختر الخطة</option>'+plans.map(x=>`<option value="${escv(x.name)}">${escv(x.name)} — ${escv(x.duration_days)} يوم</option>`).join('');
  const wanted=params.get('plan');if(wanted){const opt=[...planSelect.options].find(o=>o.value===wanted||o.textContent.startsWith(wanted));if(opt)planSelect.value=opt.value;}
}
accountsEl.onclick=e=>{const b=e.target.closest('[data-account]');if(!b)return;chosen=accounts[Number(b.dataset.account)];if(!chosen)return;selectedContact.textContent='وسيلة التواصل المختارة: '+chosen.label+' — '+chosen.value;formWrap.hidden=false;};
contactForm.onsubmit=e=>{e.preventDefault();if(!chosen)return;const fd=new FormData(contactForm);const subject='TELC Voll — طلب خطة '+fd.get('plan');const body=`الاسم: ${fd.get('name')}\nالخطة: ${fd.get('plan')}\nالبلد: ${fd.get('country')}\nوسيلة التواصل: ${fd.get('contact')}\nالرسالة: ${fd.get('message')||'-'}`;let url=chosen.url||'';if(!url){if(/whatsapp/i.test(chosen.label)){const num=String(chosen.value).replace(/\D/g,'');url='https://wa.me/'+num+'?text='+encodeURIComponent(body);}else if(/telegram/i.test(chosen.label)){url='https://t.me/'+String(chosen.value).replace(/^@/,'')+'?text='+encodeURIComponent(body);}else if(/email|mail/i.test(chosen.label)){url='mailto:'+chosen.value+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);}}if(url){window.open(url,'_blank','noopener');formMsg.innerHTML='<div class="alert ok">تم تجهيز الرسالة. أكمل الإرسال في وسيلة التواصل.</div>';}else formMsg.innerHTML='<div class="alert bad">لم يتم إعداد رابط مباشر لهذا الحساب.</div>';};
load().catch(e=>{accounts=DEFAULT_CONTACTS;accountsEl.innerHTML=accounts.map((a,i)=>`<a class="contact-account" href="${a.url}" target="_blank" rel="noopener noreferrer" data-account="${i}"><span class="contact-icon">${iconSvg(a.icon)}</span><span><strong>${a.label}</strong><small>${a.value}</small></span></a>`).join('');});
</script></body></html>
