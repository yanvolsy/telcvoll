.pres-studio-active-grid { display: block !important; width: 100% !important; grid-column: 1 / -1; }
/* In-app Student Notification Center */
.notif-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.notif-bell-btn.icon-btn {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.18s ease;
  padding: 0;
  box-sizing: border-box;
}
.notif-bell-btn.icon-btn:hover {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--green);
}
.notif-badge {
  position: absolute;
  top: -4px;
  inset-inline-end: -4px;
  background: var(--green, #f47b20);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  min-width: 17px;
  height: 17px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border: 2px solid var(--white);
  line-height: 1;
}
.notif-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  inset-inline-end: 0;
  width: min(360px, calc(100vw - 28px));
  max-height: 420px;
  background: var(--white, #fff);
  border: 1px solid var(--line, #e2e8e5);
  border-radius: 18px;
  box-shadow: 0 16px 40px rgba(16, 35, 30, 0.15);
  z-index: 1200;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  text-align: right;
}
.notif-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.notif-btn-text {
  background: none;
  border: none;
  color: var(--green, #f47b20);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  padding: 4px 6px;
}
.notif-btn-text:hover { text-decoration: underline; }
.notif-list {
  overflow-y: auto;
  max-height: 360px;
}
.notif-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
  transition: background 0.15s;
}
.notif-item:last-child { border-bottom: none; }
.notif-item.unread {
  background: var(--green-soft);
}
.notif-item.unread::before {
  content: "";
  position: absolute;
  top: 14px;
  inset-inline-end: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.notif-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.notif-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  margin: 0;
}
.notif-badge-pill {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  display: inline-block;
}
.notif-pill-important, .notif-pill-urgent { background: rgba(239, 68, 68, 0.14); color: var(--danger); }
.notif-pill-warning { background: rgba(245, 158, 11, 0.14); color: var(--gold); }
.notif-pill-info { background: rgba(59, 130, 246, 0.14); color: #3b82f6; }
.notif-pill-success { background: rgba(34, 197, 94, 0.14); color: #16a34a; }
.notif-pill-announcement { background: rgba(168, 85, 247, 0.14); color: #9333ea; }
.notif-msg {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin: 4px 0 6px;
}
.notif-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
}
.notif-mark-single-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
}
.notif-mark-single-btn:hover { color: var(--green); }
.notif-empty {
  padding: 30px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
html[data-theme="dark"] .notif-dropdown {
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
}
</style>

<script>
const SECTION_ORDER=['Lesen','Hören','Sprachbausteine','Schreiben','Sprechen'];
const TEIL_ORDER={Lesen:['Teil 1','Teil 2','Teil 3'],Hören:['Teil 1','Teil 2','Teil 3'],Sprachbausteine:['Teil 1','Teil 2'],Schreiben:['Teil 1'],Sprechen:['Teil 1','Teil 2','Teil 3']};
const SECTION_AR={Lesen:'Lesen',Hören:'Hören',Sprachbausteine:'Sprachbausteine',Schreiben:'Schreiben',Sprechen:'Sprechen'};
let state={level:'B2',section:'Lesen',exercises:[],student:null,subscription:null};
let remainingDays=0;
let shuffleEnabled=true;
let shuffleOrderKey='';
let shuffleOrder=[];
let selectedTeil='';
let renderedTopicGroups=[];
function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,'');}
function calcRemainingDays(){const raw=state.subscription?.expires_at;if(!raw)return 0;const ms=new Date(raw).getTime()-Date.now();return Math.max(0,Math.ceil(ms/86400000));}
const $=id=>document.getElementById(id);
function lang(){return getLang();}
var text = window.text || ((ar,de)=>(typeof getLang==='function' && getLang()==='de')?de:ar);
var sectionIcon = window.sectionIcon || (s=>({Lesen:'📖',Hören:'🎧',Sprachbausteine:'🧩',Schreiben:'✍️',Sprechen:'🎙️'})[s]||'📄');
const TELC_DURATIONS = {
  B1: {
    Lesen: { 'Teil 1': 20, 'Teil 2': 20, 'Teil 3': 15, _default: 20 },
    Sprachbausteine: { 'Teil 1': 10, 'Teil 2': 10, _default: 10 },
    Hören: { 'Teil 1': 10, 'Teil 2': 10, 'Teil 3': 10, _default: 10 },
    Schreiben: { 'Teil 1': 30, _default: 30 },
    Sprechen: { 'Teil 1': 4, 'Teil 2': 5, 'Teil 3': 5, _default: 5 }
  },
  B2: {
    Lesen: { 'Teil 1': 20, 'Teil 2': 25, 'Teil 3': 20, _default: 20 },
    Sprachbausteine: { 'Teil 1': 15, 'Teil 2': 10, _default: 15 },
    Hören: { 'Teil 1': 6, 'Teil 2': 8, 'Teil 3': 6, _default: 7 },
    Schreiben: { 'Teil 1': 30, _default: 30 },
    Sprechen: { 'Teil 1': 5, 'Teil 2': 5, 'Teil 3': 5, _default: 5 }
  },
  C1: {
    Lesen: { 'Teil 1': 25, 'Teil 2': 25, 'Teil 3': 20, _default: 25 },
    Sprachbausteine: { 'Teil 1': 20, 'Teil 2': 20, _default: 20 },
    Hören: { 'Teil 1': 12, 'Teil 2': 15, 'Teil 3': 13, _default: 13 },
    Schreiben: { 'Teil 1': 70, _default: 70 },
    Sprechen: { 'Teil 1': 6, 'Teil 2': 6, 'Teil 3': 6, _default: 6 }
  }
};
function exerciseDuration(x){
  const explicit = Number(x?.settings_json?.duration_seconds || x?.duration_seconds || x?.time_limit_seconds || 0);
  if(explicit > 0 && explicit <= 180) return explicit;
  if(explicit > 180) return Math.round(explicit / 60);
  const lvl = String(x?.level || 'B2').toUpperCase();
  const sec = String(x?.section || '');
  const teil = String(x?.teil || 'Teil 1').trim();
  const lvlMap = TELC_DURATIONS[lvl] || TELC_DURATIONS.B2;
  const secMap = lvlMap[sec] || TELC_DURATIONS.B2[sec];
  if(!secMap) return 20;
  for(const k of Object.keys(secMap)){
    if(k !== '_default' && (teil.includes(k) || k.includes(teil))) return secMap[k];
  }
  return secMap._default || 20;
}
function sectionLabel(s){return ({Lesen:'Lesen',Hören:'Hören',Sprachbausteine:'Sprachbausteine',Schreiben:'Schreiben',Sprechen:'Sprechen'})[s]||s;}
function taskTypeLabel(type){const map={MATCHING:{ar:'مطابقة',de:'Zuordnung'},MCQ:{ar:'اختيار من متعدد',de:'Multiple Choice'},AUDIO_TF:{ar:'صحيح / خطأ',de:'Richtig / Falsch'},WRITING:{ar:'كتابة',de:'Schreiben'},SPEAKING:{ar:'تحدث',de:'Sprechen'}};const x=map[type];return x?text(x.ar,x.de):type;}
function levelAvailable(level){return state.exercises.some(x=>(x.level||'B2')===level);}
function availableTeileFor(section, level=state.level){
  const order=TEIL_ORDER[section]||['Teil 1'];
  const present=new Set(state.exercises.filter(x=>(x.level||'B2')===level&&x.section===section).map(x=>String(x.teil||'').trim()).filter(Boolean));
  if(!present.size) return order.slice();
  return order.filter(t=>present.has(t)).concat([...present].filter(t=>!order.includes(t)).sort((a,b)=>a.localeCompare(b,'de',{numeric:true})));
}
function levelExercises(level=state.level){return state.exercises.filter(x=>(x.level||'B2')===level);}
function totalCountForLevel(){return levelExercises().length;}
function completedCountForLevel(){return levelExercises().filter(x=>isExerciseCompleted(x.id)).length;}
function levelProgressPercent(){const total=totalCountForLevel();return total?Math.round((completedCountForLevel()/total)*100):0;}
function render(){
  const contentEl = $('content');
  if(!contentEl) return;
  const list=state.exercises.filter(x=>(x.level||'B2')===state.level && x.section===state.section);
  const availableTeile=availableTeileFor(state.section);
  if(!availableTeile.includes(selectedTeil)) selectedTeil=availableTeile[0]||'';
  const has=levelAvailable(state.level);
  contentEl.innerHTML=`
    <section class="hub-head">
      <div class="hub-title-block"><span class="hub-greeting"><span>✨</span> ${text('مرحباً، '+(state.student?.name||'الطالب'),'Hallo, '+(state.student?.name||'Student'))}</span><h1>${text('منصة الطالب','Student Platform')}</h1><p class="muted">${text('اختر المستوى والقسم ثم افتح التمرين.','Wähle Niveau und Prüfungsteil und öffne anschließend die Übung.')}</p></div>
      <div class="hub-kpis">
        <div class="hub-kpi days-kpi ${remainingDays<=2?'warning':''}"><strong>${remainingDays}</strong><span>${text('يوم متبقٍ','Tage verbleibend')}</span></div>
        <div class="hub-progress-card" aria-label="${text('تقدم الطالب','Lernfortschritt')}">
          <div class="hub-progress-top"><span>${text('تقدمك','Dein Fortschritt')}</span><strong>${levelProgressPercent()}%</strong></div>
          <div class="hub-progress-bar"><i style="width:${levelProgressPercent()}%"></i></div>
          <div class="hub-progress-bottom"><span>${completedCountForLevel()} / ${totalCountForLevel()} ${text('تمرين','Übungen')}</span><span>${text('المستوى','Niveau')} ${state.level}</span></div>
        </div>
      </div>
    </section>
    <section class="level-switch" aria-label="TELC Voll Niveau">
      ${['B1','B2','C1'].map(l=>`<button type="button" class="level-btn ${String(state.level).toUpperCase()===l?'active':''} ${!levelAvailable(l)?'empty':''}" data-level="${l}" aria-pressed="${String(state.level).toUpperCase()===l?'true':'false'}">Telc ${l}</button>`).join('')}
    </section>
    <nav class="section-switch" aria-label="Prüfungsteile">
      ${SECTION_ORDER.map(s=>{const count=state.exercises.filter(x=>(x.level||'B2')===state.level && x.section===s).length;return `<button class="section-btn ${state.section===s?'active':''}" data-section="${s}"><span>${sectionIcon(s)}</span><span class="section-btn-copy"><b>${s}</b><small>${count} ${text('تمرين','Übungen')}</small></span></button>`}).join('')}
    </nav>
    <section class="topic-toolbar ${availableTeile.length <= 1 ? 'no-teil-tabs' : ''}">
      <button id="shuffleToggle" class="shuffle-toggle" type="button" aria-pressed="${shuffleEnabled?'true':'false'}" title="${shuffleEnabled?text('الخلط مفعّل — اضغط لإيقافه','Shuffle aktiv — klicken zum Ausschalten'):text('الترتيب العادي — اضغط لتفعيل الخلط','Normale Reihenfolge — klicken zum Aktivieren')}"><span class="shuffle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4.5c3.8 0 4.7 5 8.5 5H21"/><path d="m18 8 3-1-3-1"/><path d="M3 17h4.5c3.8 0 4.7 5 8.5 5H21"/><path d="m18 16 3 1-3 1"/></svg></span><span class="shuffle-label">${shuffleEnabled?text('خلط','Mischen'):text('ترتيب','Reihenfolge')}</span></button>
      ${availableTeile.length > 1 ? `<div class="teil-tabs" role="tablist" aria-label="Teil auswählen">${availableTeile.map(t=>`<button type="button" class="teil-tab ${selectedTeil===t?'active':''}" data-teil="${t}">${t}</button>`).join('')}</div>` : ''}
      <div class="topic-search-wrap">
        <input id="search" class="topic-search-input" type="search" placeholder="${text('ابحث عن الموضوع…','Thema suchen…')}" autocomplete="off" aria-label="${text('ابحث عن الموضوع','Thema suchen')}"/>
      </div>
    </section>
    <div id="topicGrid" class="topic-grid"></div>

    <a id="telcStudyFloat" class="telc-study-float" href="/telc-chat.html" aria-label="مساعد TELC" title="مساعد TELC">✦ <span data-i18n="chat_float_label">مساعد TELC</span></a>
    <section class="self-test">
      <div class="self-test-badge">${text('امتحان كامل','Vollständige Prüfung')}</div>
      <h2>${text('محاكاة الامتحان الكامل','Vollständige Prüfungssimulation')}</h2>
      <p>${text('في كل مرة يختار النظام تمارين من المواضيع المنشورة الموجودة في أقسام المنصة. لا توجد نسخة ثانية من المحتوى: بنك التمارين الحالي هو المصدر.','Die Simulation wählt jedes Mal veröffentlichte Aufgaben aus den vorhandenen Bereichen. Es gibt keinen zweiten Inhaltsbestand.')}</p>
      <div class="self-test-features">
        <article><b>${text('خلط عشوائي','Zufällige Auswahl')}</b><span>${text('اختيار عشوائي من المواضيع المتاحة','Zufällige Aufgaben aus dem verfügbaren Bestand')}</span></article>
        <article><b>${text('تخصيص كامل','Vollständig anpassbar')}</b><span>${text('اختيار المستوى والأجزاء قبل البدء','Niveau und Teile vor dem Start wählen')}</span></article>
        <article><b>${text('نتيجة كاملة','Gesamtergebnis')}</b><span>${text('تجميع نتائج الأسئلة المصححة آلياً','Zusammenfassung der automatisch bewerteten Aufgaben')}</span></article>
      </div>
      <a class="btn self-test-btn" href="/self-test.html?level=${encodeURIComponent(state.level)}">${text('ابدأ امتحان عشوائي','Zufällige Prüfung starten')} <span>←</span></a>
    </section>`;
  document.querySelectorAll('.level-switch .level-btn[data-level]').forEach(b=>b.onclick=()=>{state.level=String(b.dataset.level||'B2').toUpperCase();state.section='Lesen';selectedTeil=availableTeileFor('Lesen',state.level)[0]||'';render();});
  document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;selectedTeil=availableTeileFor(state.section)[0]||'';render();});
  document.querySelectorAll('[data-teil]').forEach(b=>b.onclick=()=>{selectedTeil=b.dataset.teil;renderTopics();});
  const nav=$('telcChatNav'); if(nav) nav.href='/telc-chat.html';
  const searchInput=$('search'); if(searchInput) searchInput.oninput=renderTopics;
  const shuffleBtn=$('shuffleToggle'); if(shuffleBtn) shuffleBtn.onclick=()=>{shuffleEnabled=!shuffleEnabled; shuffleOrderKey=''; shuffleOrder=[]; updateShuffleButton(); renderTopics();};
  renderTopics();
}
function shuffleArray(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function updateShuffleButton(){
  const b=$('shuffleToggle'); if(!b)return;
  b.classList.toggle('is-active',shuffleEnabled);
  b.setAttribute('aria-pressed',shuffleEnabled?'true':'false');
  b.title=shuffleEnabled?text('الخلط مفعّل — اضغط لإيقافه','Shuffle aktiv — klicken zum Ausschalten'):text('الترتيب العادي — اضغط لتفعيل الخلط','Normale Reihenfolge — klicken zum Aktivieren');
  const label=b.querySelector('.shuffle-label'); if(label) label.textContent=shuffleEnabled?text('خلط','Mischen'):text('ترتيب','Reihenfolge');
}
let activeSpeakButton=null;
function stopSpeaking(){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
  if(activeSpeakButton){
    activeSpeakButton.classList.remove('speaking-active');
    activeSpeakButton.setAttribute('aria-pressed','false');
    activeSpeakButton=null;
  }
}
function speakGerman(raw,btn=null){
  const source=String(raw||'').trim();
  if(!source)return;
  if(btn && activeSpeakButton===btn && window.speechSynthesis.speaking){
    stopSpeaking();
    return;
  }
  stopSpeaking();
  const u=new SpeechSynthesisUtterance(source);
  u.lang='de-DE';
  u.rate=.9;
  if(btn){
    activeSpeakButton=btn;
    btn.classList.add('speaking-active');
    btn.setAttribute('aria-pressed','true');
    u.onend=()=>{
      if(activeSpeakButton===btn){
        btn.classList.remove('speaking-active');
        btn.setAttribute('aria-pressed','false');
        activeSpeakButton=null;
      }
    };
    u.onerror=u.onend;
  }
  window.speechSynthesis.speak(u);
}
async function translateText(source,target='ar'){
  const raw=String(source||'').trim();
  if(!raw) return '';
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(raw);
  const r=await fetch(url);
  if(!r.ok) throw new Error('translation failed');
  const d=await r.json();
  return (d?.[0]||[]).map(x=>x?.[0]||'').join('').trim();
}

function loadSavedPres(catKey, lvl){
  try {
    const key = 'telc_saved_pres_' + catKey + '_' + (lvl || state?.level || 'B2');
    const fallbackKey = 'telc_saved_pres_' + catKey;
    const raw = localStorage.getItem(key) || localStorage.getItem(fallbackKey);
    return raw ? JSON.parse(raw) : null;
  } catch(_){ return null; }
}

function savePresData(data){
  if(!data) return;
  const cat = data.category || currentPresCategory;
  const lvl = data.level || state?.level || 'B2';
  try {
    const str = JSON.stringify(data);
    localStorage.setItem('telc_saved_pres_' + cat + '_' + lvl, str);
    localStorage.setItem('telc_saved_pres_' + cat, str);
  } catch(_){}
}

function deleteSavedPres(catKey, lvl){
  try {
    localStorage.removeItem('telc_saved_pres_' + catKey + '_' + (lvl || state?.level || 'B2'));
    localStorage.removeItem('telc_saved_pres_' + catKey);
  } catch(_){}
}

async function copyPresText(str, btn){
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(str);
      ok = true;
    }
  } catch(_) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok = true;
    } catch(_) {}
  }
  if (btn) {
    const span = btn.querySelector('span') || btn;
    const old = span.textContent;
    btn.style.borderColor = '#228151';
    btn.style.color = '#228151';
    span.textContent = text('تم النسخ بنجاح ✓','Kopiert ✓');
    setTimeout(() => {
      span.textContent = old;
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2200);
  }
}

function renderTopics(){
  const q=($('search')?.value||'').trim().toLowerCase();
  const availableTeile=availableTeileFor(state.section);
  const teil=selectedTeil || availableTeile[0] || (TEIL_ORDER[state.section]||[])[0] || '';
  const isTeil1Speaking = (state.section==='Sprechen' && teil==='Teil 1');

  const shuffleToggle = $('shuffleToggle');
  const searchWrap = document.querySelector('.topic-search-wrap');
  if(shuffleToggle) shuffleToggle.style.display = isTeil1Speaking ? 'none' : '';
  if(searchWrap) searchWrap.style.display = isTeil1Speaking ? 'none' : '';

  updateShuffleButton();
  document.querySelectorAll('.teil-tab').forEach(b=>b.classList.toggle('active',b.dataset.teil===selectedTeil));
  const gridEl=$('topicGrid');
  if(gridEl){
    if(isTeil1Speaking){
      gridEl.className = 'topic-grid pres-studio-active-grid';
      gridEl.innerHTML = renderTeil1StudioDashboard();
      bindTeil1StudioDashboardEvents();
      return;
    }
    gridEl.className = 'topic-grid';
    const base=state.exercises.filter(x=>(x.level||'B2')===state.level && x.section===state.section);
    const orderKey=state.level+'|'+state.section;
    if(orderKey!==shuffleOrderKey || !shuffleOrder.length || shuffleOrder.length!==base.length){
      shuffleOrderKey=orderKey;
      shuffleOrder=shuffleEnabled?shuffleArray(base):base.slice();
    }else if(!shuffleEnabled){
      shuffleOrder=base.slice();
    }
    let list=shuffleOrder.slice();
    if(teil) list=list.filter(x=>x.teil===teil);
    if(q) list=list.filter(x=>{
      const isAudioQuery = (q === 'صوت' || q === 'صوتي' || q === 'audio' || q === 'hör') && (!!x.audio_url || x.section === 'Hören');
      const isVarQuery = (q === 'معدل' || q === 'تعديل' || q === 'تعديلات') && (parseVariationInfo(x.title, x.settings_json).isVariation);
      return isAudioQuery || isVarQuery || ((x.title||'')+' '+(x.body||'')+' '+(x.teil||'')+' '+(taskTypeLabel(x.task_type)||'')).toLowerCase().includes(q);
    });

    const groups = groupTopicExercises(list);
    renderedTopicGroups = groups;

    gridEl.innerHTML = groups.length ? groups.map((g, i) => {
      const primaryItem = g.items[0];
      const primaryEx = primaryItem.ex;
      const anyDone = g.items.some(it => isExerciseCompleted(it.ex.id));
      const hasAudio = g.items.some(it => !!it.ex.audio_url);
      const dur = exerciseDuration(primaryEx);
      const isMulti = g.items.length > 1;

      return `<article class="topic-card ${isMulti ? 'has-variations' : ''}">
        <div class="topic-card-head">
          <span class="topic-index">${String(i+1).padStart(2,'0')}</span>
          <div class="topic-card-tags">
            <span class="tag">Telc ${esc(primaryEx.level||'B2')}</span>
            ${isMulti ? `<span class="tag tag-variation" title="${g.items.length} ${text('تعديلات متاحة لهذا التمرين','Versionen verfügbar')}">📚 ${g.items.length} ${text('تعديلات','Versionen')}</span>` : ''}
          </div>
        </div>
        <h3 class="topic-card-title">
          <span class="topic-status-dot ${anyDone?'is-done':'is-new'}" title="${anyDone?text('تم التدريب على هذا الموضوع من قبل','Bereits trainiert'):text('لم يتم التدريب على هذا الموضوع بعد','Noch nicht trainiert')}" aria-label="${anyDone?text('تم التدريب من قبل','Bereits trainiert'):text('لم يتم التدريب بعد','Noch nicht trainiert')}"></span>
          <span>${esc(g.baseTitle)}</span>
        </h3>
        <div class="topic-meta">
          <span class="topic-meta-pill">${esc(primaryEx.teil)}</span>
          <span class="topic-meta-pill">${esc(taskTypeLabel(primaryEx.task_type))}</span>
          <span class="topic-meta-pill">⏱ ${dur} ${text('دقيقة','Min.')}</span>
        </div>
        ${isMulti ? `
          <button type="button" class="btn light topic-open-btn topic-variation-btn" data-group-idx="${i}">
            ${text('فتح التمرين','Übung öffnen')} ▾
          </button>
        ` : `
          <a class="btn light topic-open-btn" href="/exercise.html?id=${primaryEx.id}&duration=${dur*60}">${text('فتح التمرين','Übung öffnen')} →</a>
        `}
      </article>`;
    }).join('') : `<div class="empty-panel"><h3>${text('لا توجد تمارين منشورة هنا','Keine veröffentlichten Übungen')}</h3><p class="muted">${text('يمكن للمشرف إضافة الموضوع من لوحة الإدارة.','Der Administrator kann Aufgaben im Adminbereich hinzufügen.')}</p></div>`;

    gridEl.querySelectorAll('.topic-variation-btn[data-group-idx]').forEach(btn => {
      btn.onclick = () => {
        const idx = Number(btn.dataset.groupIdx);
        const group = renderedTopicGroups[idx];
        if (group) openVariationModal(group);
      };
    });
  }
}

function parseVariationInfo(rawTitle, settings = {}) {
  const str = String(rawTitle || '').trim();
  if (settings && settings.variation_label) {
    return {
      baseTitle: String(settings.base_title || str).trim(),
      isVariation: true,
      variationNumber: Number(settings.variation_no || 1),
      label: String(settings.variation_label).trim()
    };
  }

  // 1. Explicit Arabic variation keywords: "معدل", "تعديل", "نسخة"
  const arabicMatch = str.match(/^(.*?)(?:[\s\-_–—]+|\s*[\(\[])(?:معدل|تعديل|نسخة|النسخة المعدلة)[\s\-_–—]*(\d+)?[\)\]]?$/i);
  if (arabicMatch && arabicMatch[1].trim()) {
    const base = arabicMatch[1].trim();
    const num = arabicMatch[2] ? parseInt(arabicMatch[2], 10) : 1;
    return {
      baseTitle: base,
      isVariation: true,
      variationNumber: num,
      label: num > 1 ? `المعدل ${num}` : (arabicMatch[2] ? `المعدل ${num}` : 'المعدل 1')
    };
  }

  // 2. Explicit Latin variation keywords: "modifiziert", "variant", "variation", "v1", "v2"
  const latinMatch = str.match(/^(.*?)(?:[\s\-_–—]+|\s*[\(\[])(?:modifiziert|variant|variation|var\.?|v\.?)[\s\-_–—]*(\d+)?[\)\]]?$/i);
  if (latinMatch && latinMatch[1].trim()) {
    const base = latinMatch[1].trim();
    const num = latinMatch[2] ? parseInt(latinMatch[2], 10) : 1;
    return {
      baseTitle: base,
      isVariation: true,
      variationNumber: num,
      label: num > 1 ? `المعدل ${num}` : `المعدل 1`
    };
  }

  // 3. Trailing number after hyphen or space e.g. "Sport ist gesund - 1", "Sport ist gesund 1", "Sport ist gesund (1)"
  const numMatch = str.match(/^(.*?)(?:[\s\-_–—]+|\s*[\(\[])(\d+)[\)\]]?$/);
  if (numMatch && numMatch[1].trim()) {
    const base = numMatch[1].trim();
    const num = parseInt(numMatch[2], 10);
    if (base.length >= 3 && num >= 1 && num <= 20) {
      return {
        baseTitle: base,
        isVariation: true,
        variationNumber: num,
        label: `المعدل ${num}`
      };
    }
  }

  return {
    baseTitle: str,
    isVariation: false,
    variationNumber: 0,
    label: text('الأساسي', 'Standard')
  };
}

function groupTopicExercises(exercisesList) {
  const groupsMap = new Map();

  exercisesList.forEach(ex => {
    const settings = ex.settings_json && typeof ex.settings_json === 'object' ? ex.settings_json : {};
    const info = parseVariationInfo(ex.title, settings);
    const groupKey = norm(info.baseTitle);

    if (!groupsMap.has(groupKey)) {
      groupsMap.set(groupKey, {
        groupKey,
        baseTitle: info.baseTitle,
        items: []
      });
    }
    groupsMap.get(groupKey).items.push({ ex, info });
  });

  const grouped = [];
  groupsMap.forEach(group => {
    group.items.sort((a, b) => {
      if (!a.info.isVariation && b.info.isVariation) return -1;
      if (a.info.isVariation && !b.info.isVariation) return 1;
      return (a.info.variationNumber - b.info.variationNumber) || (a.ex.id - b.ex.id);
    });

    if (group.items.length > 1) {
      const hasBase = group.items.some(x => !x.info.isVariation);
      if (!hasBase) {
        group.items[0].info.label = text('الأساسي', 'Standard');
        for (let j = 1; j < group.items.length; j++) {
          group.items[j].info.label = (typeof getLang === 'function' && getLang() === 'de') ? `Modifiziert ${j}` : `المعدل ${j}`;
        }
      }
    }

    grouped.push(group);
  });

  return grouped;
}

function openVariationModal(group) {
  if (!group || !group.items || !group.items.length) return;
  const modalEl = $('variationModal');
  if (!modalEl) return;

  const titleEl = $('variationModalTitle');
  const subEl = $('variationModalSub');
  const listEl = $('variationList');
  const topicNameEl = $('variationTopicName');
  const topicTransEl = $('variationTopicTrans');
  const topicIconEl = $('variationTopicIcon');

  const primaryEx = group.items[0]?.ex;
  const translation = primaryEx?.translation || primaryEx?.settings_json?.translation || '';

  if (topicNameEl) topicNameEl.textContent = group.baseTitle;
  if (topicTransEl) topicTransEl.textContent = translation ? `(${translation})` : '';
  if (topicIconEl) topicIconEl.textContent = sectionIcon(primaryEx?.section || state.section);

  if (titleEl) titleEl.textContent = text('التعديلات المتاحة', 'Verfügbare Versionen');
  if (subEl) subEl.textContent = text(`اختر من النسخ الـ ${group.items.length} المتاحة لهذا التمرين`, `Wähle aus den ${group.items.length} verfügbaren Versionen`);

  if (listEl) {
    listEl.innerHTML = group.items.map((it, idx) => {
      const ex = it.ex;
      const dur = exerciseDuration(ex);
      const isCompleted = isExerciseCompleted(ex.id);
      const label = it.info.label || (idx === 0 ? text('الأساسي', 'Standard') : ((typeof getLang === 'function' && getLang() === 'de') ? `Modifiziert ${idx}` : `المعدل ${idx}`));
      return `
        <a href="/exercise.html?id=${ex.id}&duration=${dur * 60}" class="variation-item-btn">
          <span class="variation-item-content">
            <span class="variation-item-label">${esc(label)}</span>
            ${ex.audio_url ? `<span class="variation-audio-badge" title="${text('ملف صوتي','Audio')}">🎧</span>` : ''}
            ${isCompleted ? `<span class="variation-done-badge" title="${text('تم التدريب مسبقاً','Bereits trainiert')}">✓</span>` : ''}
          </span>
          <span class="variation-play-icon" aria-hidden="true">▷</span>
        </a>
      `;
    }).join('');
  }

  modalEl.hidden = false;
  document.body.classList.add('modal-open');
}

function closeVariationModal() {
  const modalEl = $('variationModal');
  if (modalEl) modalEl.hidden = true;
  document.body.classList.remove('modal-open');
}
window.closeVariationModal = closeVariationModal;

document.addEventListener('click', (e) => {
  if (e.target && (e.target.id === 'closeVariationModal' || e.target.closest('#closeVariationModal') || e.target.classList?.contains('variation-modal-close'))) {
    closeVariationModal();
  } else if (e.target && (e.target.id === 'variationModal' || e.target.classList?.contains('variation-modal-overlay'))) {
    closeVariationModal();
  }
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('variationModal')?.hidden) closeVariationModal();
});

const logoutBtn=$('logoutLink');
if(logoutBtn) logoutBtn.onclick=async e=>{e.preventDefault();try{localStorage.removeItem('telc_student_token');}catch(_){}await api('auth-logout',{method:'POST'});location.href='/';};

// Student Notifications
let dashboardNotifications = [];
const notifBellBtn = $('notifBellBtn');
const notifBadge = $('notifBadge');
const notifDropdown = $('notifDropdown');
const notifList = $('notifList');
const notifCountTag = $('notifCountTag');
const markAllReadBtn = $('markAllReadBtn');

function formatNotifDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('ar-DZ', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderNotifications() {
  const unreadCount = dashboardNotifications.filter(n => !n.read_at).length;
  if (unreadCount > 0) {
    notifBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    notifBadge.style.display = 'inline-flex';
  } else {
    notifBadge.style.display = 'none';
  }
  if (notifCountTag) notifCountTag.textContent = dashboardNotifications.length;

  if (!dashboardNotifications.length) {
    notifList.innerHTML = `<div class="notif-empty">${text('لا توجد تنبيهات حالياً', 'Keine Benachrichtigungen vorhanden')}</div>`;
    return;
  }

  notifList.innerHTML = dashboardNotifications.map(n => {
    const isUnread = !n.read_at;
    const typeClass = (n.type === 'important' || n.priority === 'urgent' || n.priority === 'high' || n.type === 'code_expired') ? 'notif-pill-important' :
                      (n.type === 'warning' || n.type === 'code_expiry') ? 'notif-pill-warning' :
                      (n.type === 'success') ? 'notif-pill-success' :
                      (n.type === 'announcement') ? 'notif-pill-announcement' : 'notif-pill-info';

    const typeName = (n.type === 'code_expiry' || n.type === 'code_expired') ? 'تنبيه اشتراك' :
                     (n.type === 'important') ? 'هام' :
                     (n.type === 'warning') ? 'تحذير' :
                     (n.type === 'success') ? 'تأكيد' :
                     (n.type === 'announcement') ? 'إعلان' : 'تنبيه';

    return `
      <div class="notif-item ${isUnread ? 'unread' : ''}" data-id="${esc(n.id)}" data-source="${esc(n.source || 'system')}">
        <div class="notif-item-top">
          <h4 class="notif-title">${esc(n.title)}</h4>
          <span class="notif-badge-pill ${typeClass}">${typeName}</span>
        </div>
        <div class="notif-msg">${esc(n.message)}</div>
        <div class="notif-meta">
          <span>${formatNotifDate(n.created_at)}</span>
          ${isUnread ? `<button type="button" class="notif-mark-single-btn" onclick="markNotificationRead('${esc(n.id)}', '${esc(n.source || 'system')}')">${text('تحديد كمقروء', 'Als gelesen markieren')}</button>` : '<span style="color:#a0b0a8;">✓ مقروء</span>'}
        </div>
      </div>
    `;
  }).join('');
}

async function loadNotifications() {
  try {
    const res = await api('notifications');
    dashboardNotifications = Array.isArray(res?.notifications) ? res.notifications : [];
    renderNotifications();
  } catch (err) {
    console.warn('[NOTIFICATIONS LOAD ERROR]', err);
  }
}

async function markNotificationRead(id, source) {
  try {
    await api('notifications-read', {
      method: 'POST',
      body: source === 'admin' ? { admin_id: id } : { id: id }
    });
    const found = dashboardNotifications.find(n => String(n.id) === String(id) && (n.source || 'system') === source);
    if (found) found.read_at = new Date().toISOString();
    renderNotifications();
  } catch (err) {
    console.error('Failed to mark read', err);
  }
}
window.markNotificationRead = markNotificationRead;

if (notifBellBtn) {
  notifBellBtn.onclick = (e) => {
    e.stopPropagation();
    const isShown = notifDropdown.style.display === 'flex';
    notifDropdown.style.display = isShown ? 'none' : 'flex';
  };
}

if (markAllReadBtn) {
  markAllReadBtn.onclick = async () => {
    try {
      await api('notifications-read', { method: 'POST', body: { all: true } });
      dashboardNotifications.forEach(n => { n.read_at = new Date().toISOString(); });
      renderNotifications();
    } catch (err) {
      console.error('Failed to mark all read', err);
    }
  };
}

document.addEventListener('click', (e) => {
  if (notifDropdown && notifDropdown.style.display === 'flex' && !notifDropdown.contains(e.target) && e.target !== notifBellBtn) {
    notifDropdown.style.display = 'none';
  }
});

(async()=>{
  try {
    const d = await api('me');
    state.exercises = Array.isArray(d?.exercises) ? d.exercises : [];
    state.student = d?.student || {};
    state.subscription = d?.subscription || null;
    remainingDays = calcRemainingDays();
    const urlLevel = qs('level');
    if (['B1','B2','C1'].includes(String(urlLevel||'').toUpperCase())) state.level = String(urlLevel).toUpperCase();
    try {
      const saved = JSON.parse(sessionStorage.getItem('telc_dashboard_return') || 'null');
      if (saved) {
        if (['B1','B2','C1'].includes(String(saved.level||'').toUpperCase())) state.level = String(saved.level).toUpperCase();
        if (SECTION_ORDER.includes(saved.section)) state.section = saved.section;
        if (availableTeileFor(state.section).includes(saved.teil)) selectedTeil = saved.teil;
        window.__telcRestoreSearch = saved.search || '';
        window.__telcRestoreScroll = Number(saved.scrollY) || 0;
        sessionStorage.removeItem('telc_dashboard_return');
      }
    } catch (_) {}
    render();
    if (window.__telcRestoreSearch && $('search')) $('search').value = window.__telcRestoreSearch;
    renderTopics();
    loadNotifications();
    setTimeout(() => {
      if (window.__telcRestoreScroll) window.scrollTo(0, window.__telcRestoreScroll);
    }, 80);
  } catch(e) {
    console.error('Dashboard init error:', e);
    if (e?.status === 401) {
      try { localStorage.removeItem('telc_student_token'); } catch (_) {}
      location.href = '/?error=session';
    } else {
      const isDe = (typeof getLang === 'function' && getLang() === 'de');
      const title = isDe ? 'Fehler beim Laden' : 'تعذر تحميل بيانات التمارين';
      const msg = isDe ? 'Beim Laden der Aufgaben ist ein Fehler aufgetreten. Bitte erneut versuchen.' : 'حدث خطأ أثناء تحميل التمارين. يرجى الضغط على زر إعادة المحاولة.';
      const retry = isDe ? 'Erneut versuchen' : 'إعادة المحاولة';
      const contentEl = $('content');
      if (contentEl) {
        contentEl.innerHTML = `
          <div class="empty-panel" style="margin:60px auto;max-width:520px;text-align:center;padding:30px;border-radius:20px;background:var(--white)">
            <h3 style="margin-bottom:10px">${esc(title)}</h3>
            <p class="muted" style="margin-bottom:20px">${esc(msg)}</p>
            <button class="btn" type="button" onclick="location.reload()">${esc(retry)}</button>
          </div>`;
      }
    }
  }
})();
document.addEventListener('langchange', render);
</script>
