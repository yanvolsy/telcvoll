<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A2F"><title>لوحة الطالب</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">

</head>
<body>
<header class="top">
  <a class="brand" href="/dashboard.html" aria-label="TELC Voll"><span class="brand-dot"></span><span class="brand-name"><span class="brand-telc">TELC</span> <span class="brand-voll">Voll</span></span></a>
  <nav>
    <a href="/self-test.html" id="mockExamNav" data-i18n="nav_mock">امتحان تجريبي</a><a href="/telc-chat.html" id="telcChatNav" data-i18n="nav_speaking">مساعد TELC</a><a href="/profile.html" id="profileLink" data-i18n="profile_link">ملفي</a><a href="#" id="logoutLink" data-i18n="nav_logout">خروج</a>
  </nav>
</header>
<main class="student-hub" id="content"><div class="student-loading">جارٍ التحميل…</div></main>
<script src="/assets/i18n.js"></script><script src="/assets/app.js"></script>
<script>
const SECTION_ORDER=['Lesen','Hören','Sprachbausteine','Schreiben','Sprechen'];
const TEIL_ORDER={Lesen:['Teil 1','Teil 2','Teil 3'],Hören:['Teil 1','Teil 2','Teil 3'],Sprachbausteine:['Teil 1','Teil 2'],Schreiben:['Teil 1'],Sprechen:['Teil 1','Teil 2','Teil 3']};
const SECTION_AR={Lesen:'Lesen',Hören:'Hören',Sprachbausteine:'Sprachbausteine',Schreiben:'Schreiben',Sprechen:'Sprechen'};
let state={level:'B2',section:'Lesen',exercises:[],student:null,subscription:null};
let remainingDays=0;
let shuffleEnabled=true;
let shuffleOrderKey='';
let shuffleOrder=[];
let selectedTeil='';
function calcRemainingDays(){const raw=state.subscription?.expires_at;if(!raw)return 0;const ms=new Date(raw).getTime()-Date.now();return Math.max(0,Math.ceil(ms/86400000));}
const $=id=>document.getElementById(id);
function lang(){return getLang();}
function text(ar,de){return lang()==='ar'?ar:de;}
function exerciseDuration(x){return Number(x.settings_json?.duration_seconds||x.duration_seconds||90)||90;}
function sectionIcon(s){
  const icons = {
    Lesen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></svg>',
    Hören: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M2 14h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H2v-7Zm16 0h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2v-7Z"/></svg>',
    Schreiben: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>',
    Sprechen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    Sprachbausteine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="8" y="13" width="8" height="8" rx="2"/></svg>'
  };
  return icons[s]||'•';
}
function sectionLabel(s){return ({Lesen:'Lesen',Hören:'Hören',Sprachbausteine:'Sprachbausteine',Schreiben:'Schreiben',Sprechen:'Sprechen'})[s]||s;}
function taskTypeLabel(type){const map={MATCHING:{ar:'مطابقة',de:'Zuordnung'},MCQ:{ar:'اختيار من متعدد',de:'Multiple Choice'},AUDIO_TF:{ar:'صحيح / خطأ',de:'Richtig / Falsch'},WRITING:{ar:'كتابة',de:'Schreiben'},SPEAKING:{ar:'تحدث',de:'Sprechen'}};const x=map[type];return x?text(x.ar,x.de):type;}
function levelAvailable(level){return state.exercises.some(x=>(x.level||'B2')===level);}
function availableTeileFor(section, level=state.level){const order=TEIL_ORDER[section]||[];const present=new Set(state.exercises.filter(x=>(x.level||'B2')===level&&x.section===section).map(x=>String(x.teil||'').trim()).filter(Boolean));return order.filter(t=>present.has(t)).concat([...present].filter(t=>!order.includes(t)).sort((a,b)=>a.localeCompare(b,'de',{numeric:true})));}
function levelExercises(level=state.level){return state.exercises.filter(x=>(x.level||'B2')===level);}
function completedCountForLevel(){return levelExercises().filter(x=>{const s=getExerciseStatus(x.id,state.attemptsMap||{}).status;return s==='passed'||s==='failed';}).length;}
function levelProgressPercent(){const total=totalCountForLevel();return total?Math.round((completedCountForLevel()/total)*100):0;}
function render(){
  const list=state.exercises.filter(x=>(x.level||'B2')===state.level && x.section===state.section);
  const availableTeile=availableTeileFor(state.section);
  if(!availableTeile.includes(selectedTeil)) selectedTeil=availableTeile[0]||'';
  const has=levelAvailable(state.level);
  $('content').innerHTML=`
    <section class="hub-head">
      <div class="hub-title-block"><span class="hub-greeting">${text('مرحباً، '+(state.student?.name||'الطالب'),'Hallo, '+(state.student?.name||'Student'))}</span><h1>${text('منصة الطالب','Student Platform')}</h1><p class="muted">${text('اختر المستوى والقسم ثم افتح التمرين. تدرب بذكاء وادخل الامتحان بثقة.','Wähle Niveau und Prüfungsteil und öffne anschließend die Übung.')}</p></div>
      <div class="hub-kpis">
        <div class="hub-kpi days-kpi ${remainingDays<=2?'warning':''}"><strong>${remainingDays}</strong><span>${text('يوم متبقٍ','Tage verbleibend')}</span></div>
        <div class="hub-progress-card" aria-label="${text('تقدم الطالب','Lernfortschritt')}">
          <div class="hub-progress-top"><span>${text('تقدمك','Dein Fortschritt')}</span><strong>${levelProgressPercent()}%</strong></div>
          <div class="hub-progress-bar"><i style="width:${levelProgressPercent()}%"></i></div>
          <div class="hub-progress-bottom"><span>${completedCountForLevel()} / ${totalCountForLevel()} ${text('تمرين مكتمل','Übungen')}</span><span>${text('المستوى','Niveau')} ${state.level}</span></div>
        </div>
      </div>
    </section>
    <div class="brand-alert-banner">
      <div class="brand-alert-lead">
        <span class="brand-alert-dot"></span>
        <span class="brand-alert-tag">${text('معلومة / تنبيه','Hinweis')}</span>
        <span>${text('واصل التدريب لتحقيق أفضل النتائج في امتحانك.','Übe kontinuierlich weiter, um die besten Ergebnisse in deiner Prüfung zu erzielen.')}</span>
      </div>
      <button type="button" class="brand-alert-close" onclick="this.closest('.brand-alert-banner').style.display='none'" aria-label="${text('إغلاق','Schließen')}">×</button>
    </div>
    <section class="level-switch" aria-label="TELC Voll Niveau">
      ${['B1','B2','C1'].map(l=>`<button class="level-btn ${state.level===l?'active':''} ${!levelAvailable(l)?'empty':''}" data-level="${l}">Telc ${l}</button>`).join('')}
    </section>
    <nav class="section-switch" aria-label="Prüfungsteile">
      ${SECTION_ORDER.map(s=>{const count=state.exercises.filter(x=>(x.level||'B2')===state.level && x.section===s).length;return `<button class="section-btn ${state.section===s?'active':''}" data-section="${s}"><span>${sectionIcon(s)}</span><span class="section-btn-copy"><b>${s}</b><small>${count} ${text('تمرين','Übungen')}</small></span></button>`}).join('')}
    </nav>
    <section class="topic-toolbar">
      <button id="shuffleToggle" class="shuffle-toggle" type="button" aria-pressed="${shuffleEnabled?'true':'false'}" title="${shuffleEnabled?text('الخلط مفعّل — اضغط لإيقافه','Shuffle aktiv — klicken zum Ausschalten'):text('الترتيب العادي — اضغط لتفعيل الخلط','Normale Reihenfolge — klicken zum Aktivieren')}"><span class="shuffle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4.5c3.8 0 4.7 5 8.5 5H21"/><path d="m18 8 3-1-3-1"/><path d="M3 17h4.5c3.8 0 4.7 5 8.5 5H21"/><path d="m18 16 3 1-3 1"/></svg></span><span class="shuffle-label">${shuffleEnabled?text('خلط','Mischen'):text('ترتيب','Reihenfolge')}</span></button>
      <div class="teil-tabs" role="tablist" aria-label="Teil auswählen">${availableTeile.map(t=>`<button type="button" class="teil-tab ${selectedTeil===t?'active':''}" data-teil="${t}">${t}</button>`).join('')}</div>
      <div class="topic-search-wrap">
        <input id="search" class="topic-search-input" type="search" placeholder="${text('ابحث عن الموضوع…','Thema suchen…')}" autocomplete="off" aria-label="${text('ابحث عن الموضوع','Thema suchen')}"/>
      </div>
    </section>
    <div id="topicGrid" class="topic-grid"></div>

    <a id="telcStudyFloat" class="telc-study-float" href="/telc-chat.html" aria-label="مساعد TELC" title="مساعد TELC">✦ <span data-i18n="chat_float_label">مساعد TELC</span></a>
    <section class="self-test">
      <div class="self-test-badge">${text('امتحان كامل','Vollständige Prüfung')}</div>
      <h2>${text('محاكاة الامتحان الكامل','Vollständige Prüfungssimulation')}</h2>
      <p>${text('في كل مرة يختار النظام تمارين من المواضيع المنشورة الموجودة في أقسام المنصة. لا توجد نسخة ثانية من المحتوى: بنك التمارين الحالي هو المصدر.','Die Simulation wählt jedes Mal veröffentlichte Aufgaben aus den vorhandenen Bereichen. Es gibt keinen zweiten Inhaltsbestand.')}</p>
      <div class="self-test-features">
        <article><b>${text('خلط عشوائي','Zufällige Auswahl')}</b><span>${text('اختيار عشوائي من المواضيع المتاحة','Zufällige Aufgaben aus dem verfügbaren Bestand')}</span></article>
        <article><b>${text('تخصيص كامل','Vollständig anpassbar')}</b><span>${text('اختيار المستوى والأجزاء قبل البدء','Niveau und Teile vor dem Start wählen')}</span></article>
        <article><b>${text('نتيجة كاملة','Gesamtergebnis')}</b><span>${text('تجميع نتائج الأسئلة المصححة آلياً','Zusammenfassung der automatisch bewerteten Aufgaben')}</span></article>
      </div>
      <a class="btn self-test-btn" href="/self-test.html?level=${encodeURIComponent(state.level)}">${text('ابدأ امتحان عشوائي','Zufällige Prüfung starten')} <span>←</span></a>
    </section>`;
  document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;state.section='Lesen';selectedTeil=availableTeileFor('Lesen',state.level)[0]||'';render();});
  document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;selectedTeil=availableTeileFor(state.section)[0]||'';render();});
  document.querySelectorAll('[data-teil]').forEach(b=>b.onclick=()=>{selectedTeil=b.dataset.teil;renderTopics();});
  const nav=$('telcChatNav'); if(nav) nav.href='/telc-chat.html';
  $('search').oninput=renderTopics;
  const shuffleBtn=$('shuffleToggle'); if(shuffleBtn) shuffleBtn.onclick=()=>{shuffleEnabled=!shuffleEnabled; shuffleOrderKey=''; shuffleOrder=[]; updateShuffleButton(); renderTopics();};
  renderTopics();
}
function shuffleArray(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function updateShuffleButton(){
  const b=$('shuffleToggle'); if(!b)return;
  b.classList.toggle('is-active',shuffleEnabled);
  b.setAttribute('aria-pressed',shuffleEnabled?'true':'false');
  b.title=shuffleEnabled?text('الخلط مفعّل — اضغط لإيقافه','Shuffle aktiv — klicken zum Ausschalten'):text('الترتيب العادي — اضغط لتفعيل الخلط','Normale Reihenfolge — klicken zum Aktivieren');
  const label=b.querySelector('.shuffle-label'); if(label) label.textContent=shuffleEnabled?text('خلط','Mischen'):text('ترتيب','Reihenfolge');
}
function renderTopics(){
  const q=($('search')?.value||'').trim().toLowerCase(); const teil=selectedTeil || (TEIL_ORDER[state.section]||[])[0] || '';
  const base=state.exercises.filter(x=>(x.level||'B2')===state.level && x.section===state.section);
  const orderKey=state.level+'|'+state.section;
  if(orderKey!==shuffleOrderKey || !shuffleOrder.length || shuffleOrder.length!==base.length){
    shuffleOrderKey=orderKey;
    shuffleOrder=shuffleEnabled?shuffleArray(base):base.slice();
  }else if(!shuffleEnabled){
    shuffleOrder=base.slice();
  }
  let list=shuffleOrder.slice();
  if(teil) list=list.filter(x=>x.teil===teil);
  if(q) list=list.filter(x=>(x.title+' '+(x.body||'')).toLowerCase().includes(q));
  updateShuffleButton();
  document.querySelectorAll('.teil-tab').forEach(b=>b.classList.toggle('active',b.dataset.teil===selectedTeil));
  $('topicGrid').innerHTML=list.length?list.map((x,i)=>{
    const st=getExerciseStatus(x.id, state.attemptsMap||{});
    const badgeText=getLang()==='ar'?st.labelAr:st.labelDe;
    const isDone=st.status==='passed'||st.status==='failed';
    const isInProgress=st.status==='in-progress';
    const isPassed=st.status==='passed';
    const isFailed=st.status==='failed';
    const statusClass='status-'+st.status;

    return `
    <article class="topic-card ${statusClass}">
      <div class="topic-card-head">
        <div class="topic-head-badges">
          <span class="level-badge">${esc(x.level||state.level||'B2')}</span>
          <span class="topic-state-badge ${statusClass}">${esc(badgeText)}</span>
        </div>
        <span class="topic-bookmark ${statusClass}" title="${esc(badgeText)}">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="${isDone||isInProgress?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </span>
      </div>
      <h3 class="topic-card-title">
        <span class="topic-status-dot ${statusClass}"></span>
        <span>${esc(x.title)}</span>
      </h3>
      <div class="topic-meta">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/></svg> ${esc(x.teil)}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ${esc(taskTypeLabel(x.task_type))}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${exerciseDuration(x)} ${text('دقيقة','Min.')}</span>
      </div>
      <a class="btn ${isPassed?'btn-passed':isFailed?'btn-failed':isInProgress?'btn-in-progress':''}" href="/exercise.html?id=${x.id}" onclick="markExerciseEntered(${x.id})">${isInProgress?text('متابعة التدريب ←','Weiterüben →'):isDone?text('إعادة التدريب ↻','Erneut üben ↻'):text('ابدأ التمرين ←','Starten →')}</a>
    </article>`;
  }).join(''):`<div class="empty-panel"><h3>${text('لا توجد تمارين منشورة هنا','Keine veröffentlichten Übungen')}</h3><p class="muted">${text('يمكن للمشرف إضافة الموضوع من لوحة الإدارة.','Der Administrator kann Aufgaben im Adminbereich hinzufügen.')}</p></div>`;
}

document.addEventListener('click',e=>{const a=e.target.closest('a[href*="/exercise.html"]');if(!a)return;try{sessionStorage.setItem('telc_dashboard_return',JSON.stringify({level:state.level,section:state.section,teil:selectedTeil,search:$('search')?.value||'',scrollY:window.scrollY}));}catch{}});

logoutLink.onclick=async e=>{e.preventDefault();await api('auth-logout',{method:'POST'});location.href='/';};
(async()=>{try{const d=await api('me');state.exercises=d.exercises||[];state.student=d.student;state.subscription=d.subscription||null;state.attempts=d.attempts||[];state.attemptsMap=(d.attempts||[]).reduce((acc,at)=>{acc[String(at.exercise_id)]=at;return acc;},{});remainingDays=calcRemainingDays();const urlLevel=qs('level');if(['B1','B2','C1'].includes(urlLevel))state.level=urlLevel;
try{const saved=JSON.parse(sessionStorage.getItem('telc_dashboard_return')||'null');if(saved){if(['B1','B2','C1'].includes(saved.level))state.level=saved.level;if(SECTION_ORDER.includes(saved.section))state.section=saved.section;if(availableTeileFor(state.section).includes(saved.teil))selectedTeil=saved.teil;window.__telcRestoreSearch=saved.search||'';window.__telcRestoreScroll=Number(saved.scrollY)||0;sessionStorage.removeItem('telc_dashboard_return');}}catch{}
render();if(window.__telcRestoreSearch&&$('search'))$('search').value=window.__telcRestoreSearch;renderTopics();setTimeout(()=>{if(window.__telcRestoreScroll)window.scrollTo(0,window.__telcRestoreScroll);},80);}catch(e){location.href='/?error=session';}})();
document.addEventListener('langchange',render);
</script></body></html>
