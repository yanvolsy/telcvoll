<script>
const id=new URLSearchParams(location.search).get('id');
const $=x=>document.getElementById(x); let ex=null, history=[], transcript=[], recognition=null, busy=false, voiceRunning=false, speakingNow=false, turnToken=0, modelBusy=false, isPaidStudent=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addBubble(who,msg,autoSpeak=false){const d=document.createElement('div');d.className='bubble '+who;const safe=String(msg||'');d.innerHTML=`<div class="bubble-tools"><b>${who==='jerry'?'Jerry':who==='partner'?'Partner':'Du'}</b><span style="margin-inline-start:auto"></span><button type="button" class="icon-btn" data-bubble-speak aria-label="Nachricht anhören">🔊</button><button type="button" class="bubble-translate" data-bubble-translate aria-label="Nachricht übersetzen">文</button></div><div class="bubble-text">${esc(safe)}</div><div class="bubble-translation" hidden></div>`;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;const vb=d.querySelector('[data-bubble-speak]');vb.onclick=()=>speak(safe);const tb=d.querySelector('[data-bubble-translate]');tb.onclick=async()=>{const box=d.querySelector('.bubble-translation');box.hidden=!box.hidden;if(!box.hidden){box.textContent='…';try{box.textContent=await translateText(safe)}catch{box.textContent='Übersetzung nicht verfügbar.'}}};if(autoSpeak)setTimeout(()=>speak(safe),120)}
async function translateText(raw){const source=String(raw||'').trim();if(!source)return '';const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=ar&dt=t&q='+encodeURIComponent(source);const r=await fetch(url);if(!r.ok)throw new Error('translation failed');const d=await r.json();return (d?.[0]||[]).map(x=>x?.[0]||'').join('').trim()}
function currentTeil(){return String(ex?.teil||'Teil 1').match(/Teil\s*[123]/i)?.[0]||'Teil 1'}
function parseSpeakingTasks(body){const raw=String(body||'').replace(/\r/g,'');const settings=ex?.settings_json&&typeof ex.settings_json==='object'?ex.settings_json:{};const a=[];const src=Array.isArray(settings.tasks)?settings.tasks:Array.isArray(settings.aufgaben)?settings.aufgaben:[];src.forEach(x=>{const v=typeof x==='string'?x:(x?.text||x?.title||'');if(v.trim())a.push(v.trim())});if(!a.length)raw.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{const m=line.match(/^(?:[-•]\s*)?\d{1,2}[.)]\s*(.+)$/);if(m)a.push(m[1].trim())});return [...new Set(a)].slice(0,12)}
function renderTeil3Tasks(){if(currentTeil()!=='Teil 3')return '';const tasks=parseSpeakingTasks(ex?.body||'');if(!tasks.length)return '';return `<section class=\"speaking-tasks-panel\"><div class=\"speaking-section-head\"><div><span class=\"speaking-section-kicker\">Aufgaben — الخطوات والمطلوب</span><h2>Aufgaben</h2></div></div><div class=\"speaking-task-list\">${tasks.map((x,i)=>`<article class=\"speaking-task-item\"><span class=\"speaking-task-number\">${i+1}</span><div class=\"speaking-task-item-body\"><b>${esc(x)}</b></div></article>`).join('')}</div></section>`}
function speak(text,done){if(!('speechSynthesis'in window)){done?.();return} speechSynthesis.cancel(); speakingNow=true; const u=new SpeechSynthesisUtterance(String(text||''));u.lang='de-DE';u.rate=.98;u.pitch=1; const voices=speechSynthesis.getVoices(); const v=voices.find(x=>x.lang?.toLowerCase().startsWith('de-de'))||voices.find(x=>x.lang?.toLowerCase().startsWith('de')); if(v)u.voice=v; u.onend=()=>{speakingNow=false;done?.()};u.onerror=()=>{speakingNow=false;done?.()};speechSynthesis.speak(u)}
function setVoiceStatus(text){$('voiceStatus').textContent=text}
function setPhase(t){const u=new URLSearchParams(location.search); if(t===currentTeil())return; u.set('teil',t); location.href='/speaking.html?id='+encodeURIComponent(id)+'&teil='+encodeURIComponent(t)}
function renderPhases(){const selected=currentTeil(); $('phases').innerHTML=['Teil 1','Teil 2','Teil 3'].map(t=>`<button class="btn phase ${t===selected?'active':''}" data-t="${t}">${t}</button>`).join('');document.querySelectorAll('.phase').forEach(b=>b.onclick=()=>setPhase(b.dataset.t))}
function modelSpeak(text){if(String(text||'').trim())speak(text)}
function modelSection(title,items){if(!Array.isArray(items)||!items.length)return '';return `<div class="speaking-model-section"><h4>${esc(title)}</h4><ul class="speaking-model-list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function renderModel(out){
 const c=$('modelContent');
 const dialogue=Array.isArray(out.dialogue)?out.dialogue:[];
 const questions=Array.isArray(out.questions)?out.questions:[];
 const phrases=Array.isArray(out.redemittel)?out.redemittel:[];
 const isT3=currentTeil()==='Teil 3';
 let html=`<div class="speaking-model-head" style="margin-top:4px"><div><span class="tag">${esc(currentTeil())}</span><h3>${esc(out.title||(isT3?'Gemeinsam etwas planen':'Modellantwort'))}</h3></div><small>${esc(out.note||'Trainingsbeispiel – keine offizielle telc Musterlösung.')}</small></div>`;
 if(dialogue.length){html+=`<div class="speaking-model-dialogue">${dialogue.map((x,i)=>{const txt=String(x.text||'');const who=x.speaker==='student'?'Schüler (Kandidat A)':x.speaker==='partner'?'Partner (Kandidat B)':'Jerry';return `<div class="speaking-model-line model-${esc(x.speaker||'partner')}"><div><b>${esc(who)}</b><p>${esc(txt)}</p><div class="speaking-model-translation" hidden></div></div><span class="speaking-model-tools"><button class="icon-btn speaking-model-speak" type="button" aria-label="Anhören" data-speak="${esc(txt)}">🔊</button><button class="bubble-translate" type="button" data-model-translate>文</button></span></div>`}).join('')}</div>`}
 if(out.structure&&typeof out.structure==='object'){
   const st=out.structure;
   if(isT3){
     html+=modelSection('Planungsschritte — خطوات التخطيط',st.planung);
     html+=modelSection('Aufgabenverteilung — توزيع المهام',st.verteilung);
     html+=modelSection('Vereinbarung & Treffen — الاتفاق النهائي وموعد اللقاء',st.vereinbarung);
   } else {
     html+=modelSection('Inhalt',st.inhalt);
     html+=modelSection('Meinung',st.meinung||st.meinung1);
     html+=modelSection('Erfahrung',st.erfahrung||st.erfahrung1);
     html+=modelSection('Vorteile',st.vorteile);
     html+=modelSection('Nachteile',st.nachteile);
     html+=modelSection('Planung / Vereinbarung',st.planung);
   }
 }
 if(questions.length){
   html+=`<div class="speaking-model-questions"><div class="speaking-model-questions-head"><h4>أسئلة للتدرب مع إجابات مقترحة</h4><small>نماذج أسئلة وإجابات متوقعة للتدرب عليها مع الشريك أو الممتحن.</small></div><div class="speaking-qa-list">${questions.map((item,i)=>{
     const qText=typeof item==='string'?item:(item.question||item.q||'');
     const aText=typeof item==='object'?(item.answer||item.a||''):'';
     return `<div class="speaking-model-qa-card"><div class="speaking-model-q-row"><span class="speaking-qa-badge q-badge">سؤال ${i+1}</span><div class="speaking-qa-text"><b>${esc(qText)}</b></div><span class="speaking-model-tools"><button class="icon-btn speaking-model-speak" type="button" data-speak="${esc(qText)}" title="استمع للسؤال">🔊</button><button class="bubble-translate" type="button" data-qa-translate title="ترجمة">文</button></span></div><div class="speaking-qa-translation" hidden></div>${aText?`<div class="speaking-model-a-row"><span class="speaking-qa-badge a-badge">الإجابة المقترحة</span><div class="speaking-qa-text"><p>${esc(aText)}</p></div><span class="speaking-model-tools"><button class="icon-btn speaking-model-speak" type="button" data-speak="${esc(aText)}" title="استمع للإجابة">🔊</button><button class="bubble-translate" type="button" data-qa-translate title="ترجمة">文</button></span></div><div class="speaking-qa-translation" hidden></div>`:''}</div>`}).join('')}</div></div>`;
 }
 if(phrases.length){html+=`<div class="speaking-model-phrases"><h4>Redemittel</h4><div>${phrases.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`}
 c.innerHTML=html;c.hidden=false;
 c.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>modelSpeak(b.dataset.speak));
 c.querySelectorAll('[data-model-translate]').forEach(b=>b.onclick=async()=>{const line=b.closest('.speaking-model-line');const box=line?.querySelector('.speaking-model-translation');const source=line?.querySelector('p')?.textContent||'';if(!box||!source)return;box.hidden=!box.hidden;if(!box.hidden)return;box.textContent='…';try{box.textContent=await translateText(source)}catch{box.textContent='Übersetzung nicht verfügbar.'}});
 c.querySelectorAll('[data-qa-translate]').forEach(b=>b.onclick=async()=>{const row=b.closest('.speaking-model-q-row')||b.closest('.speaking-model-a-row');const box=row?.nextElementSibling;const source=row?.querySelector('.speaking-qa-text')?.textContent||'';if(!box||!source)return;box.hidden=!box.hidden;if(!box.hidden)return;box.textContent='…';try{box.textContent=await translateText(source)}catch{box.textContent='Übersetzung nicht verfügbar.'}});
}

let presRecognition = null;
let presRecording = false;
let presTranscript = '';
let presTimer = null;
let presSeconds = 0;

function loadSavedPres(catKey, lvl){
  try {
    const key = 'telc_saved_pres_' + catKey + '_' + (lvl || ex?.level || 'B2');

    const raw = localStorage.getItem(key) || localStorage.getItem(fallbackKey);
    return raw ? JSON.parse(raw) : null;
  } catch(_){ return null; }
}

function savePresData(data){
  if(!data) return;
  const cat = data.category || currentPresCategory;
  const lvl = data.level || ex?.level || 'B2';
  try {
    const str = JSON.stringify(data);
    localStorage.setItem('telc_saved_pres_' + cat + '_' + lvl, str);
    localStorage.setItem('telc_saved_pres_' + cat, str);
  } catch(_){}
}

function deleteSavedPres(catKey, lvl){
  try {
    localStorage.removeItem('telc_saved_pres_' + catKey + '_' + (lvl || ex?.level || 'B2'));
    localStorage.removeItem('telc_saved_pres_' + catKey);
  } catch(_){}
}

async function copyPresText(str, btn){
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(str);
      ok = true;
    }
  } catch(_) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok = true;
    } catch(_) {}
  }
  if (btn) {
    const span = btn.querySelector('span') || btn;
    const old = span.textContent;
    btn.style.borderColor = '#228151';
    btn.style.color = '#228151';
    span.textContent = 'تم النسخ بنجاح ✓';
    setTimeout(() => {
      span.textContent = old;
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2200);
  }
}

function getRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return null; const r=new SR();r.lang='de-DE';r.interimResults=true;r.continuous=false;r.maxAlternatives=1; return r}
function startListening(){if(!voiceRunning||busy||speakingNow)return; if(!recognition)recognition=getRecognition(); if(!recognition){setVoiceStatus('هذا المتصفح لا يدعم التعرف على الكلام. استخدم Chrome على الكمبيوتر أو خيار الكتابة.');return} $('voicePanel').classList.add('active');$('mic').classList.add('listening');$('mic').disabled=true;$('stop').disabled=false;setVoiceStatus('Jerry يستمع إليك… تحدث الآن بالألمانية');$('liveTranscript').textContent='…';let finalText='';
 recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}$('liveTranscript').textContent=(finalText+interim).trim()||'…'};
 recognition.onend=()=>{ $('mic').classList.remove('listening'); if(!voiceRunning){$('mic').disabled=false;$('stop').disabled=true;return} const text=finalText.trim(); if(text){send(text,true)} else { $('mic').disabled=false; setVoiceStatus('لم أسمع كلامًا واضحًا. تحدث مرة أخرى.'); if(voiceRunning)setTimeout(startListening,450)}};
 recognition.onerror=e=>{ $('mic').classList.remove('listening'); $('mic').disabled=false; if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceRunning=false;$('stop').disabled=true;setVoiceStatus('يرجى السماح للمتصفح باستخدام الميكروفون.')} else if(voiceRunning){setVoiceStatus('تعذر سماع الكلام. حاول مرة أخرى.')}};
 try{recognition.start()}catch{setTimeout(()=>{try{recognition.start()}catch{}},300)}
}
async function send(text,fromVoice=false){text=String(text||'').trim();if(!text||busy)return;busy=true;turnToken++;const myToken=turnToken;$('send').disabled=true;$('liveTranscript').textContent=text;addBubble('me',text);transcript.push('Schüler: '+text);history.push({role:'student',content:text});$('input').value='';setVoiceStatus('Jerry يفكر في ردّه…');
 try{const r=await api('ai-speaking-session',{method:'POST',body:{id,mode:'turn',transcript:transcript.join('\n'),history,teil:currentTeil()}});if(r.reply){addBubble('partner',r.reply);history.push({role:'partner',content:r.reply});setVoiceStatus('Jerry يتحدث…');if(voiceRunning){speak(r.reply,()=>{if(voiceRunning&&myToken===turnToken)setTimeout(startListening,350)})}else speak(r.reply)}}catch(e){addBubble('jerry','Entschuldigung, ich konnte gerade nicht antworten.');setVoiceStatus('حدث خطأ في الاتصال بـ Jerry. حاول مرة أخرى.')}finally{busy=false;$('send').disabled=false;if(!voiceRunning)$('mic').disabled=false}}
$('send').onclick=()=>send($('input').value,false);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send($('input').value,false)});
$('mic').onclick=()=>{if(!getRecognition()){setVoiceStatus('هذا المتصفح لا يدعم المحادثة الصوتية. استخدم Chrome على الكمبيوتر.');return} if(voiceRunning){voiceRunning=false;turnToken++;speechSynthesis?.cancel();recognition?.stop();$('voicePanel').classList.remove('active');$('mic').classList.remove('listening');$('mic').disabled=false;$('stop').disabled=true;setVoiceStatus('تم إيقاف المحادثة الصوتية. اضغط الميكروفون للمتابعة.')}else{voiceRunning=true;setVoiceStatus('جارٍ تشغيل المحادثة الصوتية…');startListening()}};
$('stop').onclick=()=>{voiceRunning=false;turnToken++;speechSynthesis?.cancel();if(recognition)try{recognition.stop()}catch{}$('voicePanel').classList.remove('active');$('mic').classList.remove('listening');$('mic').disabled=false;$('stop').disabled=true;setVoiceStatus('تم إيقاف المحادثة. يمكنك المتابعة بالضغط على الميكروفون.')};
$('finish').onclick=async()=>{if(busy||!transcript.length)return;voiceRunning=false;turnToken++;speechSynthesis?.cancel();if(recognition)try{recognition.stop()}catch{}$('mic').disabled=true;$('stop').disabled=true;busy=true;$('finish').disabled=true;setVoiceStatus('جارٍ تقييم المحادثة…');try{const r=await api('ai-speaking-session',{method:'POST',body:{id,mode:'evaluate',transcript:transcript.join('\n'),teil:currentTeil()}});$('eval').hidden=false;$('eval').innerHTML='<h2>Jerry · Bewertung</h2><p><b>Gesamt: '+esc(r.total)+' / 25</b></p><div class="eval-grid">'+(r.criteria||[]).map(c=>`<div class="eval-item"><b>${esc(c.label)}</b><div class="eval-score">${esc(c.score)} / ${esc(c.max||5)}</div><div>${esc(c.comment)}</div></div>`).join('')+'</div><hr><h3>Stärken</h3><ul>'+(r.strengths||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h3>Prioritäten</h3><ul>'+(r.priorities||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p>'+esc(r.summary_de||'')+'</p><p>'+esc(r.summary_ar||'')+'</p>';$('eval').scrollIntoView({behavior:'smooth'})}catch(e){setVoiceStatus('حدث خطأ أثناء التقييم: '+(e?.message||'AI'))}finally{busy=false;$('finish').disabled=false}};
