<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><title>TELC Voll · Sprechen</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style>
.spk-shell{max-width:980px;margin:auto}.spk-task{direction:ltr;text-align:left;white-space:pre-wrap;line-height:1.7}
.spk-chat{display:flex;flex-direction:column;gap:12px;margin-top:18px;max-height:46vh;overflow:auto;padding:4px}
.bubble{padding:14px 16px;border-radius:16px;max-width:82%;line-height:1.65;white-space:pre-wrap;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.bubble.jerry{align-self:flex-start;background:#111b17;border:1px solid rgba(255,255,255,.07);direction:ltr;text-align:left}.bubble.partner{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);direction:ltr;text-align:left}.bubble.me{align-self:flex-end;background:rgba(255,130,0,.14);border:1px solid rgba(255,130,0,.25);direction:ltr;text-align:left}
.voice-panel{margin-top:16px;padding:18px;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:rgba(255,255,255,.025);text-align:center}
.voice-status{font-size:13px;opacity:.72;min-height:20px;margin:8px 0 12px}.voice-mic{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;font-size:30px;background:#ff922f;color:#fff;box-shadow:0 10px 28px rgba(255,130,0,.24);transition:.2s}.voice-mic:hover{transform:translateY(-1px)}.voice-mic.listening{animation:micPulse 1.15s infinite;box-shadow:0 0 0 10px rgba(255,130,0,.10),0 10px 30px rgba(255,130,0,.28)}
.voice-mic:disabled{opacity:.55;cursor:not-allowed}.voice-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.voice-live{margin-top:14px;min-height:42px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);direction:ltr;text-align:left;white-space:pre-wrap}.voice-bars{height:18px;display:flex;align-items:center;justify-content:center;gap:3px;opacity:.8}.voice-bars i{width:3px;height:7px;border-radius:3px;background:currentColor}.voice-panel.active .voice-bars i{animation:voiceBar .7s ease-in-out infinite alternate}.voice-bars i:nth-child(2){animation-delay:.08s}.voice-bars i:nth-child(3){animation-delay:.16s}.voice-bars i:nth-child(4){animation-delay:.24s}.voice-bars i:nth-child(5){animation-delay:.32s}.voice-bars i:nth-child(6){animation-delay:.24s}.voice-bars i:nth-child(7){animation-delay:.16s}
.spk-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.typing-fallback{margin-top:10px}.typing-fallback summary{cursor:pointer;opacity:.7;font-size:13px}.typing-fallback .spk-row textarea{min-height:70px;flex:1;min-width:240px;direction:ltr;text-align:left}
.spk-phases{display:flex;gap:8px;flex-wrap:wrap}.phase.active{outline:2px solid currentColor}
.eval-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.eval-item{padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px}.eval-score{font-size:20px;font-weight:700}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes voiceBar{from{height:5px}to{height:17px}}.speaking-model-head-actions{display:flex;align-items:center;gap:10px;justify-content:flex-end}.speaking-model-head-actions small{max-width:340px}.speaking-model-dialogue{direction:ltr}.speaking-model-line{direction:ltr;text-align:left}.speaking-model-section{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--white)}.speaking-model-section h4{margin:0 0 8px;font-size:14px}.speaking-model-list{margin:0;padding-inline-start:20px;line-height:1.8}.speaking-model-q{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);direction:ltr;text-align:left}.speaking-model-q:last-child{border-bottom:0}.speaking-model-q button,.speaking-model-speak{flex:0 0 auto}.speaking-model-empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
@media(max-width:650px){.eval-grid{grid-template-columns:1fr}.bubble{max-width:94%}.spk-chat{max-height:42vh}.voice-mic{width:70px;height:70px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/dashboard.html">TELC Voll</a><nav>
<a href="/dashboard.html">الرئيسية</a><a href="/errors.html">أخطائي</a><a href="/summaries.html">الملخصات</a><a href="#" id="logout">خروج</a>
</nav></header>
<main class="wrap spk-shell"><div class="panel">
<div id="loading">جارٍ تحميل موضوع Sprechen…</div>
<div id="app" hidden>
<div class="spk-phases" id="phases"></div>
<span class="tag" id="level"></span><h1 id="title"></h1>
<div class="question"><strong id="teilLabel"></strong><div class="spk-task" id="task"></div></div>
<div class="speaking-model-box" id="modelBox">
  <div class="speaking-model-head">
    <div><span class="tag">AI</span><h3>الإجابة النموذجية</h3></div>
    <div class="speaking-model-head-actions"><small>نموذج تدريبي مبني على موضوعك، مع حوار وأسئلة مشابهة لطريقة التدريب.</small><button class="btn speaking-model-btn" id="modelBtn" type="button">🧠 توليد الإجابة النموذجية</button></div>
  </div>
  <div id="modelContent" hidden></div>
</div>
<div class="spk-chat" id="chat"></div>
<div class="voice-panel" id="voicePanel">
  <div class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="voice-status" id="voiceStatus">اضغط على الميكروفون وابدأ الحديث بالألمانية مع Jerry</div>
  <button class="voice-mic" id="mic" type="button" aria-label="ابدأ المحادثة الصوتية">🎙️</button>
  <div class="voice-actions"><button class="btn" id="stop" disabled>إيقاف المحادثة</button><button class="btn" id="finish">إنهاء وتقييم Jerry</button></div>
  <div class="voice-live" id="liveTranscript">سيظهر كلامك هنا أثناء المحادثة…</div>
</div>
<details class="typing-fallback"><summary>استخدام الكتابة بدل الميكروفون</summary><div class="spk-row"><textarea id="input" placeholder="اكتب إجابتك بالألمانية هنا…"></textarea><button class="btn dark" id="send">إرسال</button></div></details>
<div id="eval" class="card" hidden></div>
</div></div></main>
<footer>TELC Voll</footer>
<script src="/assets/app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const $=x=>document.getElementById(x); let ex=null, history=[], transcript=[], recognition=null, busy=false, voiceRunning=false, speakingNow=false, turnToken=0, modelBusy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addBubble(who,text){const d=document.createElement('div');d.className='bubble '+who;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function currentTeil(){return String(ex?.teil||'Teil 1').match(/Teil\s*[123]/i)?.[0]||'Teil 1'}
function speak(text,done){if(!('speechSynthesis'in window)){done?.();return} speechSynthesis.cancel(); speakingNow=true; const u=new SpeechSynthesisUtterance(String(text||''));u.lang='de-DE';u.rate=.98;u.pitch=1; const voices=speechSynthesis.getVoices(); const v=voices.find(x=>x.lang?.toLowerCase().startsWith('de-de'))||voices.find(x=>x.lang?.toLowerCase().startsWith('de')); if(v)u.voice=v; u.onend=()=>{speakingNow=false;done?.()};u.onerror=()=>{speakingNow=false;done?.()};speechSynthesis.speak(u)}
function setVoiceStatus(text){$('voiceStatus').textContent=text}
function setPhase(t){const u=new URLSearchParams(location.search); if(t===currentTeil())return; u.set('teil',t); location.href='/speaking.html?id='+encodeURIComponent(id)+'&teil='+encodeURIComponent(t)}
function renderPhases(){const selected=currentTeil(); $('phases').innerHTML=['Teil 1','Teil 2','Teil 3'].map(t=>`<button class="btn phase ${t===selected?'active':''}" data-t="${t}">${t}</button>`).join('');document.querySelectorAll('.phase').forEach(b=>b.onclick=()=>setPhase(b.dataset.t))}
function modelSpeak(text){if(String(text||'').trim())speak(text)}
function modelSection(title,items){if(!Array.isArray(items)||!items.length)return '';return `<div class="speaking-model-section"><h4>${esc(title)}</h4><ul class="speaking-model-list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function renderModel(out){
 const c=$('modelContent');
 const dialogue=Array.isArray(out.dialogue)?out.dialogue:[];
 const questions=Array.isArray(out.questions)?out.questions:[];
 const phrases=Array.isArray(out.redemittel)?out.redemittel:[];
 let html=`<div class="speaking-model-head" style="margin-top:4px"><div><span class="tag">${esc(currentTeil())}</span><h3>${esc(out.title||'Modellantwort')}</h3></div><small>${esc(out.note||'Trainingsbeispiel – keine offizielle telc Musterlösung.')}</small></div>`;
 if(dialogue.length){html+=`<div class="speaking-model-dialogue">${dialogue.map(x=>`<div class="speaking-model-line model-${esc(x.speaker||'partner')}"><div><b>${esc(x.speaker==='student'?'Schüler':x.speaker==='partner'?'Partner':'Jerry')}</b><p>${esc(x.text||'')}</p></div><button class="icon-btn speaking-model-speak" type="button" aria-label="Anhören" data-speak="${esc(x.text||'')}">🔊</button></div>`).join('')}</div>`}
 if(out.structure&&typeof out.structure==='object'){
   const st=out.structure;
   html+=modelSection('Inhalt',st.inhalt);
   html+=modelSection('Meinung',st.meinung);
   html+=modelSection('Erfahrung',st.erfahrung);
   html+=modelSection('Vorteile',st.vorteile);
   html+=modelSection('Nachteile',st.nachteile);
   html+=modelSection('Planung / Vereinbarung',st.planung);
 }
 if(questions.length){html+=`<div class="speaking-model-questions"><div class="speaking-model-questions-head"><h4>أسئلة للتدرب — بدون إجابات</h4><small>أسئلة فقط، أجب عنها بنفسك.</small></div>${questions.map((q,i)=>`<div class="speaking-model-q"><span>${i+1}.</span><div style="flex:1">${esc(q)}</div><button class="icon-btn speaking-model-speak" type="button" data-speak="${esc(q)}">🔊</button></div>`).join('')}</div>`}
 if(phrases.length){html+=`<div class="speaking-model-phrases"><h4>Redemittel</h4><div>${phrases.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`}
 c.innerHTML=html;c.hidden=false;c.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>modelSpeak(b.dataset.speak));
}
async function generateModel(){if(modelBusy)return;modelBusy=true;$('modelBtn').disabled=true;$('modelBtn').textContent='⏳ جارٍ التوليد…';$('modelContent').hidden=false;$('modelContent').innerHTML='<div class="speaking-model-empty">جارٍ إنشاء نموذج مناسب لهذا الموضوع…</div>';try{const r=await api('ai-speaking-session',{method:'POST',body:{id,mode:'model',teil:currentTeil()}});if(r.error)throw new Error(r.error);renderModel(r)}catch(e){$('modelContent').innerHTML=`<div class="alert bad">${esc(e?.message||'حدث خطأ أثناء توليد الإجابة النموذجية.')}</div>`}finally{modelBusy=false;$('modelBtn').disabled=false;$('modelBtn').textContent='🧠 توليد الإجابة النموذجية'}}
async function load(){try{
 const wanted=new URLSearchParams(location.search).get('teil');
 let data=await api('exercise-get?id='+encodeURIComponent(id));
 ex=data.exercise;
 if(String(ex.section)!=='Sprechen')throw new Error('هذا ليس تمرين Sprechen.');
 if(wanted && wanted!==currentTeil()){
   const list=await api('exercises-list',{method:'GET',query:{level:ex.level,section:'Sprechen'}});
   const rows=Array.isArray(list?.exercises)?list.exercises:(Array.isArray(list)?list:[]);
   const same=rows.find(x=>String(x.teil||'').replace(/\s/g,'').toLowerCase()===wanted.replace(/\s/g,'').toLowerCase() &&
     (String(x.title||'').trim().toLowerCase()===String(ex.title||'').trim().toLowerCase() || String(x.body||'').includes(String(ex.title||''))));
   if(same){data=await api('exercise-get',{method:'GET',query:{id:same.id}});ex=data.exercise}
 }
 $('level').textContent=ex.level||'';$('title').textContent=ex.title||'Sprechen';$('teilLabel').textContent=ex.teil||'Teil 1';$('task').textContent=ex.body||'';renderPhases();$('chat').innerHTML='';history=[];transcript=[];$('liveTranscript').textContent='اضغط على الميكروفون وابدأ الحديث بالألمانية…';addBubble('jerry','Hallo! Ich bin Jerry, dein Gesprächspartner. Wir sprechen jetzt gemeinsam auf Deutsch.');$('app').hidden=false;$('loading').hidden=true;
 }catch(e){$('loading').textContent=e?.message||'Fehler beim Laden.'}}
function getRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return null; const r=new SR();r.lang='de-DE';r.interimResults=true;r.continuous=false;r.maxAlternatives=1; return r}
function startListening(){if(!voiceRunning||busy||speakingNow)return; if(!recognition)recognition=getRecognition(); if(!recognition){setVoiceStatus('هذا المتصفح لا يدعم التعرف على الكلام. استخدم Chrome على الكمبيوتر أو خيار الكتابة.');return} $('voicePanel').classList.add('active');$('mic').classList.add('listening');$('mic').disabled=true;$('stop').disabled=false;setVoiceStatus('Jerry يستمع إليك… تحدث الآن بالألمانية');$('liveTranscript').textContent='…';let finalText='';
 recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}$('liveTranscript').textContent=(finalText+interim).trim()||'…'};
 recognition.onend=()=>{ $('mic').classList.remove('listening'); if(!voiceRunning){$('mic').disabled=false;$('stop').disabled=true;return} const text=finalText.trim(); if(text){send(text,true)} else { $('mic').disabled=false; setVoiceStatus('لم أسمع كلامًا واضحًا. تحدث مرة أخرى.'); if(voiceRunning)setTimeout(startListening,450)}};
 recognition.onerror=e=>{ $('mic').classList.remove('listening'); $('mic').disabled=false; if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceRunning=false;$('stop').disabled=true;setVoiceStatus('يرجى السماح للمتصفح باستخدام الميكروفون.')} else if(voiceRunning){setVoiceStatus('تعذر سماع الكلام. حاول مرة أخرى.')}};
 try{recognition.start()}catch{setTimeout(()=>{try{recognition.start()}catch{}},300)}
}
async function send(text,fromVoice=false){text=String(text||'').trim();if(!text||busy)return;busy=true;turnToken++;const myToken=turnToken;$('send').disabled=true;$('liveTranscript').textContent=text;addBubble('me',text);transcript.push('Schüler: '+text);history.push({role:'student',content:text});$('input').value='';setVoiceStatus('Jerry يفكر في ردّه…');
 try{const r=await api('ai-speaking-session',{method:'POST',body:{id,mode:'turn',transcript:transcript.join('\n'),history,teil:currentTeil()}});if(r.reply){addBubble('partner',r.reply);history.push({role:'partner',content:r.reply});setVoiceStatus('Jerry يتحدث…');if(voiceRunning){speak(r.reply,()=>{if(voiceRunning&&myToken===turnToken)setTimeout(startListening,350)})}else speak(r.reply)}}catch(e){addBubble('jerry','Entschuldigung, ich konnte gerade nicht antworten.');setVoiceStatus('حدث خطأ في الاتصال بـ Jerry. حاول مرة أخرى.')}finally{busy=false;$('send').disabled=false;if(!voiceRunning)$('mic').disabled=false}}
$('send').onclick=()=>send($('input').value,false);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send($('input').value,false)});
$('mic').onclick=()=>{if(!getRecognition()){setVoiceStatus('هذا المتصفح لا يدعم المحادثة الصوتية. استخدم Chrome على الكمبيوتر.');return} if(voiceRunning){voiceRunning=false;turnToken++;speechSynthesis?.cancel();recognition?.stop();$('voicePanel').classList.remove('active');$('mic').classList.remove('listening');$('mic').disabled=false;$('stop').disabled=true;setVoiceStatus('تم إيقاف المحادثة الصوتية. اضغط الميكروفون للمتابعة.')}else{voiceRunning=true;setVoiceStatus('جارٍ تشغيل المحادثة الصوتية…');startListening()}};
$('stop').onclick=()=>{voiceRunning=false;turnToken++;speechSynthesis?.cancel();if(recognition)try{recognition.stop()}catch{}$('voicePanel').classList.remove('active');$('mic').classList.remove('listening');$('mic').disabled=false;$('stop').disabled=true;setVoiceStatus('تم إيقاف المحادثة. يمكنك المتابعة بالضغط على الميكروفون.')};
$('finish').onclick=async()=>{if(busy||!transcript.length)return;voiceRunning=false;turnToken++;speechSynthesis?.cancel();if(recognition)try{recognition.stop()}catch{}$('mic').disabled=true;$('stop').disabled=true;busy=true;$('finish').disabled=true;setVoiceStatus('جارٍ تقييم المحادثة…');try{const r=await api('ai-speaking-session',{method:'POST',body:{id,mode:'evaluate',transcript:transcript.join('\n'),teil:currentTeil()}});$('eval').hidden=false;$('eval').innerHTML='<h2>Jerry · Bewertung</h2><p><b>Gesamt: '+esc(r.total)+' / 25</b></p><div class="eval-grid">'+(r.criteria||[]).map(c=>`<div class="eval-item"><b>${esc(c.label)}</b><div class="eval-score">${esc(c.score)} / ${esc(c.max||5)}</div><div>${esc(c.comment)}</div></div>`).join('')+'</div><hr><h3>Stärken</h3><ul>'+(r.strengths||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h3>Prioritäten</h3><ul>'+(r.priorities||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p>'+esc(r.summary_de||'')+'</p><p>'+esc(r.summary_ar||'')+'</p>';$('eval').scrollIntoView({behavior:'smooth'})}catch(e){setVoiceStatus('حدث خطأ أثناء التقييم: '+(e?.message||'AI'))}finally{busy=false;$('finish').disabled=false}};
$('modelBtn').onclick=generateModel;
$('logout').onclick=async e=>{e.preventDefault();await api('auth-logout',{method:'POST'});location.href='/'};
load();
</script></body></html>
