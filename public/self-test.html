<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اختبر نفسك</title><link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"></head><body><header class="top"><a class="brand" href="/dashboard.html">TELC Voll</a><nav><a href="/dashboard.html">الرئيسية</a><a href="#" id="logoutLink">خروج</a></nav></header><main class="self-test-page" id="content"><div class="student-loading">جارٍ التحميل…</div></main><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script>
const LEVELS=['B1','B2','C1'];
let exercises=[],level=['B1','B2','C1'].includes(qs('level'))?qs('level'):'B2';
const txt=(a,d)=>getLang()==='ar'?a:d;
const groups={Lesen:['Teil 1','Teil 2','Teil 3'],Hören:['Teil 1','Teil 2','Teil 3'],Sprachbausteine:['Teil 1','Teil 2'],Schreiben:['Teil 1'],Sprechen:['Teil 1','Teil 2','Teil 3']};

function render(){
  document.getElementById('content').innerHTML=`<section class="self-test-shell mock-start-shell">
    <span class="tag">${txt('امتحان تجريبي','Probeprüfung')}</span>
    <h1>${txt('اختر مستوى الامتحان','Prüfungsniveau wählen')}</h1>
    <p class="muted">${txt('اختر B1 أو B2 أو C1 فقط. بعد البدء يختار الموقع التمارين عشوائياً من المحتوى المنشور ويبدأ المؤقت تلقائياً.','Wähle nur B1, B2 oder C1. Danach wählt die Plattform die veröffentlichten Aufgaben zufällig aus und startet die Prüfungszeit automatisch.')}</p>
    <div class="self-levels">${LEVELS.map(l=>`<button class="level-btn ${level===l?'active':''}" data-level="${l}">Telc ${l}</button>`).join('')}</div>
    <div class="self-test-grid mock-rules">
      <article><span class="self-icon">↝</span><h2>${txt('اختيار عشوائي','Zufällige Auswahl')}</h2><p>${txt('لا تظهر قائمة بالمواضيع ولا يمكنك اختيار موضوع أو قسم.','Keine Themenliste und keine Auswahl einzelner Themen oder Bereiche.')}</p></article>
      <article><span class="self-icon">◷</span><h2>${txt('وقت الامتحان','Prüfungszeit')}</h2><p>${txt('يبدأ المؤقت عند بدء المحاكاة ويستمر أثناء الانتقال بين المهام.','Die Prüfungszeit startet beim Beginn und läuft beim Wechsel zwischen Aufgaben weiter.')}</p></article>
      <article><span class="self-icon">✓</span><h2>${txt('تجربة امتحان','Prüfungserlebnis')}</h2><p>${txt('أسماء المواضيع والترجمات وأدوات التعلم مخفية أثناء المحاكاة.','Themennamen, Übersetzungen und Lernwerkzeuge bleiben während der Simulation verborgen.')}</p></article>
    </div>
    <button class="btn self-test-btn" id="startBtn">${txt('بدء امتحان Telc','Telc-Prüfung starten')} ←</button>
  </section>`;
  document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;render();});
  document.getElementById('startBtn').onclick=start;
}

function start(){
  const picks=[];
  // One random published exercise for every available TELC Teil in the selected level.
  for(const section of Object.keys(groups)){
    for(const teil of groups[section]){
      const pool=exercises.filter(x=>(x.level||'B2')===level && x.section===section && x.teil===teil && x.status==='published');
      if(pool.length)picks.push(pool[Math.floor(Math.random()*pool.length)]);
    }
  }
  if(!picks.length){alert(txt('لا توجد تمارين منشورة لهذا المستوى.','Keine veröffentlichten Übungen für dieses Niveau.'));return;}
  const defaults={Lesen:2700,Hören:1800,Sprachbausteine:900,Schreiben:1800,Sprechen:900};
  const totalSeconds=Math.max(60,picks.reduce((sum,x)=>{const settings=x.settings_json&&typeof x.settings_json==='object'?x.settings_json:{};return sum+(Number(settings.duration_seconds||x.duration_seconds||0)||defaults[x.section]||900);},0));
  const now=Date.now();
  const session={id:(window.crypto&&typeof window.crypto.randomUUID==='function'?window.crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),level,ids:picks.map(x=>x.id),index:0,results:[],startedAt:now,endAt:now+totalSeconds*1000,totalSeconds,mock:true,tasks:picks.map(x=>({id:x.id,section:x.section,teil:x.teil,task_type:x.task_type})),answersByExercise:{},spoken:{status:'not_started'} };
  localStorage.setItem('telc_self_test',JSON.stringify(session));
  location.href='/exercise.html?id='+encodeURIComponent(picks[0].id)+'&session='+encodeURIComponent(session.id)+'&mock=1';
}
(async()=>{try{const d=await api('me');exercises=d.exercises||[];render();}catch(e){location.href='/?error=session';}})();
logoutLink.onclick=async e=>{e.preventDefault();await api('auth-logout',{method:'POST'});location.href='/';};
</script>`;
