<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}.telc-ai-subscription-lock{margin:24px auto;max-width:520px;padding:22px 24px;border:1px solid #ffd9c7;border-radius:20px;background:linear-gradient(180deg,#fffaf7,#fff);text-align:center;box-shadow:0 12px 30px rgba(20,28,45,.06)}.telc-ai-lock-title{font-size:18px;font-weight:850;color:#111827}.telc-ai-lock-text{margin-top:7px;color:#6b7280;font-size:14px;line-height:1.8}.telc-ai-lock-btn{display:inline-flex;margin-top:15px;align-items:center;justify-content:center;padding:10px 18px;border-radius:12px;background:#ff6b24;color:#fff;text-decoration:none;font-weight:800}.telc-ai-lock-btn:hover{filter:brightness(.97);transform:translateY(-1px)}@media(prefers-color-scheme:dark){.telc-ai-subscription-lock{background:#15171b;border-color:#4a2b1f}.telc-ai-lock-title{color:#f3f4f6}.telc-ai-lock-text{color:#aeb4c0}}
</style>
<style>
/* TELC Voll site logo — use the same brand mark as the main platform. */
.telc-ai-site-logo .brand-dot{display:block;width:14px;height:14px;border-radius:50%;background:var(--brand,#ff7a2f);box-shadow:0 0 0 6px rgba(255,122,47,.10)}
.telc-ai-logo.telc-ai-site-logo{background:transparent;color:var(--brand,#ff7a2f);border:1px solid var(--line,#e6e8eb);box-shadow:none}
.telc-ai-avatar.telc-ai-site-logo{background:var(--white,#fff);border:1px solid var(--line,#e6e8eb);box-shadow:0 4px 12px rgba(20,28,45,.06)}
.telc-ai-welcome-mark.telc-ai-site-logo{background:var(--white,#fff);border:1px solid var(--line,#e6e8eb);box-shadow:0 12px 30px rgba(20,28,45,.08)}
.telc-ai-site-logo .brand-dot{width:18px;height:18px}
.telc-ai-avatar.telc-ai-site-logo .brand-dot{width:11px;height:11px;box-shadow:0 0 0 4px rgba(255,122,47,.10)}
@media(prefers-color-scheme:dark){
  .telc-ai-avatar.telc-ai-site-logo,.telc-ai-welcome-mark.telc-ai-site-logo{background:#15171b;border-color:#343840}
}

<body class="telc-ai-body">
<header class="top telc-ai-top">
  <a class="brand" href="/dashboard.html"><span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span></a>
  <nav class="student-nav-links">
    <a href="/dashboard.html" data-i18n="nav_home_student">منصة الطالب</a>
    <a href="/self-test.html" data-i18n="nav_mock">امتحان تجريبي</a>
    <a href="/telc-chat.html" class="active" data-i18n="nav_speaking">مساعد TELC</a>
    <a href="/profile.html" data-i18n="profile_link">ملفي</a>
    <a href="#" id="logoutLink" data-i18n="nav_logout" class="nav-logout-btn">خروج</a>
  </nav>
</header>
<main class="telc-ai-page">
  <section class="telc-ai-app" aria-label="TELC Voll AI">
    <header class="telc-ai-header">
      <div class="telc-ai-identity">
        <div class="telc-ai-logo telc-ai-site-logo" aria-hidden="true"><span class="brand-dot"></span></div>
        <div>
          <div class="telc-ai-name">TELC Voll AI</div>
          <div class="telc-ai-status"><span class="telc-ai-status-dot"></span><span id="aiStatusText">جاهز للمحادثة</span></div>
        </div>
      </div>
      <div class="telc-ai-header-actions">
        <button type="button" class="ai-header-btn" id="newChatBtn" title="محادثة جديدة" aria-label="محادثة جديدة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div id="chatMessages" class="telc-ai-messages" aria-live="polite" aria-atomic="false">
      <div id="welcome" class="telc-ai-welcome">
        <div class="telc-ai-welcome-mark telc-ai-site-logo" aria-hidden="true"><span class="brand-dot"></span></div>
        <h1>كيف يمكنني مساعدتك؟</h1>
        <p>اسأل عن TELC، تعلم الألمانية، أو الدراسة والعمل في ألمانيا.</p>
        <div class="telc-ai-suggestions">
          <button type="button" data-prompt="اشرح لي الفرق بين obwohl و trotzdem مع أمثلة على مستوى B2">اشرح قاعدة ألمانية</button>
          <button type="button" data-prompt="كيف أستعد لجزء Schreiben في TELC B2؟">حضّرني لـ Schreiben</button>
          <button type="button" data-prompt="أعطني محادثة قصيرة للتدرب على Sprechen B2">تدرّب على Sprechen</button>
        </div>
      </div>
    </div>
    <form id="chatForm" class="telc-ai-composer">
      <div class="telc-ai-composer-inner">
        <textarea id="chatInput" rows="1" maxlength="4000" data-i18n-ph="chat_placeholder" placeholder="اكتب رسالتك…" required></textarea>
        <div class="telc-ai-composer-actions">
          <button type="submit" class="composer-send-btn" id="sendBtn" aria-label="إرسال">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Zm3 8h13"/></svg>
          </button>
        </div>
      </div>
      <div class="telc-ai-composer-hint"><span>Enter للإرسال</span><span>Shift + Enter لسطر جديد</span></div>
    </form>
    <p class="telc-ai-disclaimer">قد يخطئ الذكاء الاصطناعي. تحقّق من المعلومات الرسمية المتعلقة بالتأشيرات والقوانين.</p>
  </section>
</main>
<script src="/assets/i18n.js?v=20260927-subscription-activation-mail-v10"></script><script src="/assets/app.js"></script>
<script>
const $ = id => document.getElementById(id);
let history = [];
let sending = false;

const icons = {
  copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'
};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inlineMarkdown(s){
  let x=esc(s);
  x=x.replace(/`([^`]+)`/g,'<code>$1</code>');
  x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  x=x.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  x=x.replace(/_([^_]+)_/g,'<em>$1</em>');
  x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return x;
}
function renderMarkdown(text){
  const lines=String(text??'').replace(/\r/g,'').split('\n');
  let html='', inUl=false, inOl=false, inCode=false, code=[];
  const closeLists=()=>{if(inUl){html+='</ul>';inUl=false;}if(inOl){html+='</ol>';inOl=false;}};
  for(const raw of lines){
    const line=raw.trimEnd();
    if(line.trim().startsWith('```')){if(!inCode){closeLists();inCode=true;code=[];}else{html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';inCode=false;code=[];}continue;}
    if(inCode){code.push(line);continue;}
    if(/^###\s+/.test(line)){closeLists();html+='<h4>'+inlineMarkdown(line.replace(/^###\s+/,''))+'</h4>';continue;}
    if(/^##\s+/.test(line)){closeLists();html+='<h3>'+inlineMarkdown(line.replace(/^##\s+/,''))+'</h3>';continue;}
    if(/^#\s+/.test(line)){closeLists();html+='<h2>'+inlineMarkdown(line.replace(/^#\s+/,''))+'</h2>';continue;}
    if(/^>\s?/.test(line)){closeLists();html+='<blockquote>'+inlineMarkdown(line.replace(/^>\s?/,''))+'</blockquote>';continue;}
    if(/^[-*]\s+/.test(line)){if(!inUl){if(inOl){html+='</ol>';inOl=false;}html+='<ul>';inUl=true;}html+='<li>'+inlineMarkdown(line.replace(/^[-*]\s+/,''))+'</li>';continue;}
    if(/^\d+[.)]\s+/.test(line)){if(!inOl){if(inUl){html+='</ul>';inUl=false;}html+='<ol>';inOl=true;}html+='<li>'+inlineMarkdown(line.replace(/^\d+[.)]\s+/,''))+'</li>';continue;}
    closeLists();
    if(!line.trim()){html+='<div class="md-spacer"></div>';continue;}
    html+='<p>'+inlineMarkdown(line)+'</p>';
  }
  closeLists(); if(inCode)html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>'; return html;
}
function plainText(s){return String(s??'').replace(/```[\s\S]*?```/g,'').replace(/[*_`#>]/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').trim();}
function scrollBottom(){const box=$('chatMessages');box.scrollTo({top:box.scrollHeight,behavior:'smooth'});}
function addMessage(role,text,{stream=true}={}){
  $('welcome')?.remove();
  const el=document.createElement('article'); el.className='telc-ai-message '+role;
  const isAssistant=role==='assistant';
  el.innerHTML=`<div class="telc-ai-message-inner">${isAssistant?'<div class="telc-ai-avatar telc-ai-site-logo" aria-hidden="true"><span class="brand-dot"></span></div>':''}<div class="telc-ai-message-body"><div class="telc-ai-message-content"></div>${isAssistant?`<div class="telc-ai-message-tools"><button type="button" class="msg-tool copy-tool" title="نسخ">${icons.copy}</button></div>`:''}</div></div>`;
  $('chatMessages').appendChild(el);
  const content=el.querySelector('.telc-ai-message-content');
  const finish=()=>{content.innerHTML=renderMarkdown(text);scrollBottom();};
  if(!stream || !isAssistant){content.textContent=text;}
  else {const clean=String(text);let i=0;const step=()=>{i=Math.min(clean.length,i+Math.max(3,Math.ceil(clean.length/90)));content.innerHTML=renderMarkdown(clean.slice(0,i));scrollBottom();if(i<clean.length)requestAnimationFrame(step);else finish();};requestAnimationFrame(step);}
  const copy=el.querySelector('.copy-tool'); if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(plainText(text));copy.classList.add('done');setTimeout(()=>copy.classList.remove('done'),900);}catch{}};
  if(!isAssistant)scrollBottom(); return el;
}
function showTyping(){hideTyping();const el=document.createElement('div');el.id='typing';el.className='telc-ai-message assistant';el.innerHTML='<div class="telc-ai-message-inner"><div class="telc-ai-avatar telc-ai-site-logo"><span class="brand-dot"></span></div><div class="telc-ai-message-body"><div class="telc-ai-typing"><i></i><i></i><i></i></div></div></div>';$('chatMessages').appendChild(el);scrollBottom();}
function hideTyping(){$('typing')?.remove();}
async function sendMessage(message){
  const previousHistory=history.slice(-12);
  const res=await fetch('/api/ai-telc-chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({message,history:previousHistory,lang:getLang()})});
  const raw=await res.text();let data={};try{data=JSON.parse(raw)}catch{}
  if(!res.ok)throw new Error(data.error||data.details||('خطأ من الخادم: HTTP '+res.status));
  if(!data.answer)throw new Error('لم يرجع المساعد إجابة.');
  return data.answer;
}
async function handleMessage(message){
  if(sending||!message.trim())return;
  sending=true;$('sendBtn').disabled=true;
  addMessage('user',message,{stream:false});$('chatInput').value='';autoGrow();showTyping();setAiStatus('يكتب الآن…');
  try{const answer=await sendMessage(message);hideTyping();history.push({role:'user',content:message});history.push({role:'assistant',content:answer});addMessage('assistant',answer,{stream:true});setAiStatus('جاهز للمحادثة');}
  catch(err){hideTyping();addMessage('assistant','تعذر إكمال الرد.\n\n'+(err.message||'حدث خطأ غير متوقع.'),{stream:true});setAiStatus('جاهز للمحادثة');}
  finally{sending=false;$('sendBtn').disabled=false;}
}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const m=$('chatInput').value.trim();if(m)handleMessage(m);});
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatForm').requestSubmit();}});
function autoGrow(){const x=$('chatInput');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,180)+'px';}
$('chatInput').addEventListener('input',autoGrow);
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('chatInput').value=b.dataset.prompt;autoGrow();$('chatInput').focus();});
$('newChatBtn').onclick=()=>{history=[];$('chatMessages').innerHTML='<div id="welcome" class="telc-ai-welcome"><div class="telc-ai-welcome-mark telc-ai-site-logo" aria-hidden="true"><span class="brand-dot"></span></div><h1>كيف يمكنني مساعدتك؟</h1><p>اسأل عن TELC، تعلم الألمانية، أو الدراسة والعمل في ألمانيا.</p><div class="telc-ai-suggestions"><button type="button" data-prompt="اشرح لي الفرق بين obwohl و trotzdem مع أمثلة على مستوى B2">اشرح قاعدة ألمانية</button><button type="button" data-prompt="كيف أستعد لجزء Schreiben في TELC B2؟">حضّرني لـ Schreiben</button><button type="button" data-prompt="أعطني محادثة قصيرة للتدرب على Sprechen B2">تدرّب على Sprechen</button></div></div>';document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('chatInput').value=b.dataset.prompt;autoGrow();$('chatInput').focus();});};
function setAiStatus(t){$('aiStatusText').textContent=t;}
$('logoutLink').onclick=async e=>{e.preventDefault();try{await fetch('/api/auth-logout',{method:'POST',credentials:'same-origin'});}catch{}location.href='/';};
document.addEventListener('langchange',()=>{applyI18n();});
(async()=>{try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok){location.href='/login.html?next='+encodeURIComponent('/telc-chat.html');return;}const me=await r.json();const student=me?.student;if(!student){location.href='/login.html?next='+encodeURIComponent('/telc-chat.html');return;}const activeSubscription=me?.subscription?.active===true && me?.is_paid===true;if(!activeSubscription){$('chatInput').disabled=true;$('sendBtn').disabled=true;$('chatInput').placeholder='المساعد متاح للمشتركين فقط';setAiStatus('يتطلب اشتراكاً مفعلاً');const box=document.createElement('div');box.className='telc-ai-subscription-lock';box.innerHTML='<div class="telc-ai-lock-title">مساعد TELC متاح للمشتركين</div><div class="telc-ai-lock-text">فعّل اشتراكك للوصول إلى المحادثة مع مساعد TELC.</div><a class="telc-ai-lock-btn" href="/plans.html">عرض الخطط</a>';$('chatMessages').appendChild(box);}else{setAiStatus('جاهز للمحادثة');}}catch{location.href='/login.html?next='+encodeURIComponent('/telc-chat.html');}})();
</script>
</body></html>
