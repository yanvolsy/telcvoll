<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التثبيت — Installation</title>
<link rel="stylesheet" href="/assets/app.css?v=20260926-clean-v4">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>
</head>
<body>
<main class="wrap">
  <div class="panel" style="max-width:480px;margin:50px auto">
    <h1>Installation</h1>
    <p class="muted" data-i18n="install_desc">يُنفَّذ مرة واحدة فقط لإنشاء حساب المشرف. بعد ذلك احذف هذه الصفحة أو أزل SETUP_KEY.</p>
    <form id="f">
      <input name="setup_key" placeholder="SETUP_KEY (aus Netlify Umgebungsvariablen)" required>
      <input name="email" type="email" placeholder="admin@example.com" required>
      <input name="password" type="password" data-i18n-ph="install_password_ph" placeholder="كلمة مرور قوية (8 أحرف على الأقل)" required>
      <button class="btn" data-i18n="install_btn">تثبيت</button>
    </form>
    <div id="msg"></div>
  </div>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
f.onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(f);
  try {
    const res = await fetch('/api/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Setup-Key': fd.get('setup_key') },
      body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
    });
    const d = await res.json();
    msg.innerHTML = res.ok
      ? `<div class="alert ok">${esc(d.message)}</div>`
      : `<div class="alert bad">${esc(d.error)}</div>`;
  } catch (err) {
    msg.innerHTML = `<div class="alert bad">${esc(err.message)}</div>`;
  }
};
</script>
</body>
</html>
