<script>
const id=qs('id'); const duration=Number(qs('duration')||0); const sessionId=qs('session'); const mockMode=qs('mock')==='1' && !!sessionId; let model=null; let answers={}; let activeItem=null; let submitted=false; let resultData=null;
let matchingOrder=null; let headingOrder=null; let optionOrders={}; let showModelAnswers=false; let titleRevealed=false; let hoerenOrder=null; let hoerenAllTranslated=false; let wordOrder=null; const translationCache=new Map();
const TELC_DUR = {
  B1: { Lesen: { 'Teil 1': 20, 'Teil 2': 20, 'Teil 3': 15, _default: 20 }, Sprachbausteine: { 'Teil 1': 10, 'Teil 2': 10, _default: 10 }, Hören: { 'Teil 1': 10, 'Teil 2': 10, 'Teil 3': 10, _default: 10 }, Schreiben: { 'Teil 1': 30, _default: 30 }, Sprechen: { 'Teil 1': 4, 'Teil 2': 5, 'Teil 3': 5, _default: 5 } },
  B2: { Lesen: { 'Teil 1': 20, 'Teil 2': 25, 'Teil 3': 20, _default: 20 }, Sprachbausteine: { 'Teil 1': 15, 'Teil 2': 10, _default: 15 }, Hören: { 'Teil 1': 6, 'Teil 2': 8, 'Teil 3': 6, _default: 7 }, Schreiben: { 'Teil 1': 30, _default: 30 }, Sprechen: { 'Teil 1': 5, 'Teil 2': 5, 'Teil 3': 5, _default: 5 } },
  C1: { Lesen: { 'Teil 1': 25, 'Teil 2': 25, 'Teil 3': 20, _default: 25 }, Sprachbausteine: { 'Teil 1': 20, 'Teil 2': 20, _default: 20 }, Hören: { 'Teil 1': 12, 'Teil 2': 15, 'Teil 3': 13, _default: 13 }, Schreiben: { 'Teil 1': 70, _default: 70 }, Sprechen: { 'Teil 1': 6, 'Teil 2': 6, 'Teil 3': 6, _default: 6 } }
};
function parseSettings(x){if(!x||!x.settings_json)return {};if(typeof x.settings_json==='object')return x.settings_json;try{return JSON.parse(x.settings_json);}catch(_){return {};}}
function getTelcDurationSeconds(ex){
  const s = parseSettings(ex);
  const explicit = Number(s?.duration_seconds || ex?.duration_seconds || ex?.time_limit_seconds || 0);
  if(explicit > 0) return explicit > 180 ? explicit : explicit * 60;
  const lvl = String(ex?.level || 'B2').toUpperCase();
  const sec = String(ex?.section || '');
  const teil = String(ex?.teil || 'Teil 1').trim();
  const lvlMap = TELC_DUR[lvl] || TELC_DUR.B2;
  const secMap = lvlMap[sec] || TELC_DUR.B2[sec];
  if(!secMap) return 1200;
  for(const k of Object.keys(secMap)){
    if(k !== '_default' && (teil.includes(k) || k.includes(teil))) return secMap[k] * 60;
  }
  return (secMap._default || 20) * 60;
}
var text = window.text || ((ar,de)=>getLang()==='ar'?ar:de);
function saveExerciseReturn(){try{sessionStorage.setItem('telc_exercise_return',JSON.stringify({url:location.href,scrollY:window.scrollY}));}catch{}}
document.getElementById('exerciseBack')?.addEventListener('click',e=>{e.preventDefault();saveExerciseReturn();location.href='/dashboard.html';});
function escBody(v){return esc(v).replace(/\n/g,'<br>');}
function answerValue(n){return answers[String(n)]||'';}
function labelFor(n,val){const it=model.items.find(x=>String(x.position_no)===String(n));const o=(it?.options||[]).find(x=>x.option_key===val);return o?o.option_text:val;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let activeSpeakButton=null;
function bindTitleReveal(){document.querySelectorAll('[data-title-reveal]').forEach(btn=>{btn.onclick=()=>{titleRevealed=!titleRevealed;document.querySelectorAll('#thema-title').forEach(el=>el.classList.toggle('thema-title-hidden',!titleRevealed));document.querySelectorAll('[data-title-reveal]').forEach(b=>{b.setAttribute('aria-pressed',String(titleRevealed));b.setAttribute('aria-label',titleRevealed?text('إخفاء عنوان الموضوع','Thema ausblenden'):text('إظهار عنوان الموضوع','Thema anzeigen'));b.textContent=titleRevealed?'◉':'◌';});};});}
function stopSpeaking(){window.speechSynthesis.cancel();if(activeSpeakButton){activeSpeakButton.classList.remove('speaking-active');activeSpeakButton.setAttribute('aria-pressed','false');activeSpeakButton=null;}}
function speakGerman(raw,btn=null){const source=String(raw||'').trim();if(!source)return;if(btn&&activeSpeakButton===btn&&window.speechSynthesis.speaking){stopSpeaking();return;}stopSpeaking();const u=new SpeechSynthesisUtterance(source);u.lang='de-DE';u.rate=.9;if(btn){activeSpeakButton=btn;btn.classList.add('speaking-active');btn.setAttribute('aria-pressed','true');u.onend=()=>{if(activeSpeakButton===btn){btn.classList.remove('speaking-active');btn.setAttribute('aria-pressed','false');activeSpeakButton=null;}};u.onerror=u.onend;}window.speechSynthesis.speak(u);}
async function translateText(raw,target=getLang()==='ar'?'ar':'de'){
  const source=String(raw||'').trim(); if(!source)return '';
  const key=target+'|'+source; if(translationCache.has(key))return translationCache.get(key);
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(source);
    const r=await fetch(url); if(!r.ok)throw new Error('translation failed'); const d=await r.json();
    const out=(d?.[0]||[]).map(x=>x?.[0]||'').join('').trim(); if(!out)throw new Error('translation empty');
    translationCache.set(key,out); return out;
  }catch(e){return ''}
}
function translationBox(idKey){return `<div class="inline-translation" id="${idKey}"></div>`;}
function textTools(raw,targetId){return `<div class="text-tools"><button type="button" class="mini-tool" data-translate="${targetId}-translation" data-source-id="${targetId}" aria-label="${text('ترجمة','Übersetzen')}" aria-pressed="false">文</button><button type="button" class="mini-tool" data-speak="${targetId}" aria-label="${text('نطق بالألمانية','Deutsch vorlesen')}" aria-pressed="false">◉</button></div>`;}
function toolRegistry(){const map=new Map(); document.querySelectorAll('[data-content-id]').forEach(el=>map.set(el.dataset.contentId,el.dataset.source||''));return map;}
function bindTextTools(){const registry=toolRegistry();document.querySelectorAll('[data-translate]').forEach(btn=>btn.onclick=async()=>{const target=document.getElementById(btn.dataset.translate);if(!target)return;if(target.classList.contains('visible')){target.classList.remove('visible');target.textContent='';btn.setAttribute('aria-pressed','false');return;}const source=registry.get(btn.dataset.sourceId)||'';target.classList.add('loading');const out=await translateText(source,'ar');target.classList.remove('loading');target.textContent=out||text('تعذرت الترجمة.','Übersetzung nicht verfügbar.');target.classList.add('visible');btn.setAttribute('aria-pressed','true');});document.querySelectorAll('[data-speak]').forEach(btn=>btn.onclick=()=>{const source=registry.get(btn.dataset.speak)||'';speakGerman(source,btn);});}
function renderUnifiedAudioPlayer(audioUrl) {
  const hasAudio = Boolean(String(audioUrl || '').trim());
  if (!hasAudio) {
    return `
      <div class="hoeren-audio-player-card is-unavailable" data-hoeren-player>
        <div class="hoeren-audio-unavailable" role="status">
          <span class="hoeren-audio-unavailable-icon" aria-hidden="true">♪</span>
          <div>
            <strong>${text('الصوت غير متوفر', 'Audio nicht verfügbar')}</strong>
            <small>${text('لا يوجد ملف صوتي لهذا التمرين حالياً.', 'Für diese Übung ist derzeit keine Audiodatei verfügbar.')}</small>
          </div>
        </div>
      </div>`;
  }
  return `
    <div class="hoeren-audio-player-card" data-hoeren-player>
      <audio class="hoeren-native-audio" preload="metadata" src="${esc(audioUrl)}"></audio>
      <div class="hoeren-audio-controls-group">
        <button type="button" class="hoeren-audio-play" data-audio-play aria-label="${text('تشغيل الصوت','Audio abspielen')}" title="${text('تشغيل / إيقاف مؤقت','Abspielen / Pause')}">
          <span class="hoeren-audio-play-icon" aria-hidden="true">▶</span>
        </button>
        <button type="button" class="hoeren-audio-icon-btn hoeren-audio-skip-btn" data-audio-skip="-5" title="${text('تراجع 5 ثوانٍ','5s zurück')}" aria-label="${text('تراجع 5 ثوانٍ','5s zurück')}">
          <span>↺ 5s</span>
        </button>
        <button type="button" class="hoeren-audio-icon-btn hoeren-audio-skip-btn" data-audio-skip="5" title="${text('تقدم 5 ثوانٍ','5s vor')}" aria-label="${text('تقدم 5 ثوانٍ','5s vor')}">
          <span>5s ↻</span>
        </button>
      </div>
      <div class="hoeren-audio-main">
        <div class="hoeren-audio-topline">
          <span class="hoeren-audio-label">${text('الملف الصوتي TELC Hören','Audiodatei TELC Hören')}</span>
          <span class="hoeren-audio-time"><span data-audio-current>0:00</span><span> / </span><span data-audio-duration>0:00</span></span>
        </div>
        <input class="hoeren-audio-progress" data-audio-progress type="range" min="0" max="100" value="0" step="0.1" aria-label="${text('تقدم الصوت','Audiofortschritt')}">
      </div>
      <div class="hoeren-audio-actions">
        <button type="button" class="hoeren-audio-icon-btn hoeren-audio-speed-btn" data-audio-speed title="${text('سرعة التشغيل: 1x / 0.8x / 1.2x','Wiedergabegeschwindigkeit')}">
          <span data-audio-speed-label>1x</span>
        </button>
        <button type="button" class="hoeren-audio-icon-btn" data-audio-mute aria-label="${text('كتم الصوت','Stummschalten')}" title="${text('كتم الصوت','Stummschalten')}">
          <span data-audio-volume-icon aria-hidden="true">🔊</span>
        </button>
        <input class="hoeren-audio-volume" data-audio-volume type="range" min="0" max="1" value="1" step="0.05" aria-label="${text('مستوى الصوت','Lautstärke')}">
      </div>
    </div>`;
}
function getExerciseBody(model) {
  const ex = model?.exercise || {};
  const st = parseSettings(ex);
  const candidates = [
    ex.body,
    ex.instructions,
    st.text,
    st.body,
    st.passage,
    st.reading_text,
    st.reading,
    st.article,
    st.content,
    st.story,
    st.situation,
    st.situation_text,
    st.thema_text,
    st.prompt,
    st.passage_text,
    st.long_text,
    st.reading_passage,
    st.text_de,
    st.german_text,
    st.content_text,
    model?.items?.[0]?.body,
    model?.items?.[0]?.settings_json?.body,
    model?.items?.[0]?.settings_json?.text,
    model?.items?.[0]?.settings_json?.passage,
    model?.items?.[0]?.text,
    model?.items?.[0]?.passage,
    model?.items?.[0]?.reading_text,
    model?.items?.[0]?.content,
    model?.items?.[0]?.text_de,
    model?.items?.[0]?.german_text,
    model?.items?.[0]?.settings_json?.content,
    model?.items?.[0]?.settings_json?.text_de,
    ...(Array.isArray(model?.items) ? model.items.map(it => it?.body || it?.text || it?.passage || it?.reading_text || it?.content).filter(Boolean) : [])
  ];
  for (const c of candidates) {
    if (typeof c === 'string' && c.trim()) return c.trim();
  }
  return '';
}

function getExerciseHeadings(model) {
  const ex = model?.exercise || {};
  const st = parseSettings(ex);
  if (Array.isArray(st.headings) && st.headings.filter(Boolean).length) return st.headings.filter(Boolean);
  if (Array.isArray(ex.headings) && ex.headings.filter(Boolean).length) return ex.headings.filter(Boolean);
  if (Array.isArray(st.situations) && st.situations.filter(Boolean).length) return st.situations.filter(Boolean);
  if (Array.isArray(st.anzeigen) && st.anzeigen.filter(Boolean).length) return st.anzeigen.filter(Boolean);
  if (Array.isArray(st.ads) && st.ads.filter(Boolean).length) return st.ads.filter(Boolean);

  const isLesen3 = ex.section === 'Lesen' && ex.teil === 'Teil 3';
  const optMap = new Map();
  (model?.items || []).forEach(it => {
    (it.options || []).forEach(o => {
      const k = String(o.option_key || '').trim().toUpperCase();
      const txt = String(o.option_text || '').trim();
      if (k && !optMap.has(k)) {
        optMap.set(k, txt || (isLesen3 ? (k === 'X' ? 'x (Keine Anzeige passt)' : `Anzeige ${k}`) : k));
      }
    });
  });
  if (optMap.size) {
    return Array.from(optMap.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(entry => entry[1]);
  }
  if (isLesen3) {
    return [
      'Anzeige a', 'Anzeige b', 'Anzeige c', 'Anzeige d', 'Anzeige e',
      'Anzeige f', 'Anzeige g', 'Anzeige h', 'Anzeige i', 'Anzeige j',
      'Anzeige k', 'Anzeige l', 'x (Keine Anzeige passt)'
    ];
  }
  return [];
}

function renderAudio(){return model.exercise.audio_url ? renderUnifiedAudioPlayer(model.exercise.audio_url) : '';}
function matchingMeta(){
  return model.exercise.section==='Lesen'&&model.exercise.teil==='Teil 1'?{title:'ÜBERSCHRIFTEN',sub:'FÜR TEXT',ar:'العناوين'}:
  model.exercise.section==='Lesen'&&model.exercise.teil==='Teil 3'?{title:'ANZEIGEN',sub:'ZUORDNUNG',ar:'الإعلانات'}:
  model.exercise.section==='Hören'&&model.exercise.teil==='Teil 3'?{title:'AUSSAGEN',sub:'ZUORDNUNG',ar:'العبارات'}:
  {title:'AUSWAHL',sub:'ZUORDNUNG',ar:'الاختيارات'};
}
function captureExerciseScroll(){
 const anchor=document.querySelector('.exam-main .active-item, .exam-main .exam-text-card, .exam-main .tf-row, .exam-side .side-question, .hoeren-table-row');
 return {main:document.querySelector('.exam-main')?.scrollTop||0,side:document.querySelector('.exam-side')?.scrollTop||0,workspace:document.querySelector('.exam-workspace, .hoeren-workspace-shell')?.scrollTop||0,x:window.scrollX||0,y:window.scrollY||0,anchorTop:anchor?.getBoundingClientRect().top??null};
}
function restoreExerciseScroll(state){if(!state)return;const restore=()=>{const m=document.querySelector('.exam-main'),sd=document.querySelector('.exam-side'),ws=document.querySelector('.exam-workspace');if(m)m.scrollTop=state.main;if(sd)sd.scrollTop=state.side;if(ws)ws.scrollTop=state.workspace;window.scrollTo(state.x,state.y);if(state.anchorTop!==null){const anchor=document.querySelector('.exam-main .active-item, .exam-main .exam-text-card, .exam-main .tf-row, .exam-side .side-question');if(anchor){const delta=anchor.getBoundingClientRect().top-state.anchorTop;if(Math.abs(delta)>1)window.scrollTo(state.x,window.scrollY+delta);}}};restore();requestAnimationFrame(restore);requestAnimationFrame(()=>requestAnimationFrame(restore));setTimeout(restore,40);}
function rerenderExerciseStable(state){renderWorkspace(false);bindActions();restoreExerciseScroll(state);}

function renderMatching(){
 const heads=getExerciseHeadings(model);
 const items=model.items||[];
 const bodyText=getExerciseBody(model);
 const isLesen3=model.exercise.section==='Lesen'&&model.exercise.teil==='Teil 3';
 if(!matchingOrder)matchingOrder=items.map(it=>String(it.position_no));
 if(!headingOrder)headingOrder=heads.map((_,i)=>i);
 const usedKeys=new Set(Object.values(answers).filter(Boolean).map(String));

 const bodySection = bodyText ? `
   <div class="long-text matching-reading-panel" style="margin-bottom:24px;">
     <div class="long-text-tools">${textTools(bodyText, 'matching-main-body')}</div>
     <div class="long-text-content" id="matching-main-body" data-content-id="matching-main-body" data-source="${esc(bodyText)}">${escBody(bodyText)}</div>
     ${translationBox('matching-main-body-translation')}
   </div>
 ` : '';

 const situationsHeader = (isLesen3 && bodyText) ? `
   <div class="matching-situations-head" style="margin:20px 0 14px;padding-top:16px;border-top:1px solid var(--line);">
     <h3 style="margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;">
       <span>📋</span>
       <span>${text('المواقف والمطلوب مطابقتها مع الإعلانات:','Situationen (Zuordnung zu den Anzeigen):')}</span>
     </h3>
   </div>
 ` : '';

 const cards = matchingOrder.map(n=>items.find(it=>String(it.position_no)===n)).filter(Boolean).map(it=>{
   const selected=answerValue(it.position_no);
   const cid='para-'+it.position_no;
   const detail=resultData?(resultData.details||[]).find(d=>String(d.prompt)===String(it.prompt)):null;
   const correctVal=detail?.correct_answer||'';
   const shownAnswer=showModelAnswers&&correctVal?correctVal:selected;
   const shownLabel=shownAnswer?labelFor(it.position_no,shownAnswer):'';
   const resultClass=detail?(detail.ok?'answer-correct':'answer-wrong'):'';
   const options=heads.map((h,i)=>({key:String.fromCharCode(65+i),text:h}));
   const selectOptions=options.map(o=>{
     const used=usedKeys.has(o.key)&&selected!==o.key;
     return `<option value="${esc(o.key)}" ${selected===o.key?'selected':''} ${used?'disabled':''}>${esc(o.text)}${used?' — '+text('تم اختياره','Bereits ausgewählt'):''}</option>`;
   }).join('');
   const assignLabel = isLesen3 ? text('الإعلان المناسب لهذا الموقف:','Passende Anzeige für diese Situation:') : text('العنوان المناسب لهذه الفقرة:','Passende Überschrift für diesen Text:');
   const assignPlaceholder = isLesen3 ? text('— اختر الإعلان المناسب —','— Passende Anzeige auswählen —') : text('— اختر العنوان —','— Überschrift auswählen —');
   return `<article class="exam-text-card ${selected?'answered':''} ${resultClass} ${String(activeItem)===String(it.position_no)?'active-item':''}" data-item="${it.position_no}">
     <div class="paragraph-assignment">
        <div class="paragraph-assignment-head">
          <span class="assignment-label">${assignLabel}</span>
          <div class="paragraph-assignment-tools">${textTools(it.prompt,cid)}</div>
        </div>
        <div class="paragraph-assignment-controls">
          <select data-paragraph-select="${it.position_no}" aria-label="${assignLabel}"><option value="">${assignPlaceholder}</option>${selectOptions}</select>
          ${shownLabel?`<button type="button" class="assignment-selected" data-clear="${it.position_no}" aria-label="${text('إلغاء الاختيار','Auswahl löschen')}"><span>${esc(shownLabel)}</span><b>×</b></button>`:`<span class="assignment-empty">${text('لم يتم الاختيار بعد','Noch nicht ausgewählt')}</span>`}
        </div>
      </div>
      <div class="exam-text" id="${cid}" data-content-id="${cid}" data-source="${esc(it.prompt)}">${escBody(it.prompt)}</div>
     <div class="inline-translation" id="${cid}-translation"></div>
   </article>`;
 }).join('');

 const main = `${bodySection}${situationsHeader}${cards}`;
 const side=headingOrder.map(i=>({h:heads[i],i})).map(({h,i})=>{
   const key=String.fromCharCode(65+i);
   const owner=items.find(it=>String(answerValue(it.position_no))===key);
   const ownerDetail=owner&&resultData?(resultData.details||[]).find(d=>String(d.prompt)===String(owner.prompt)):null;
   const modelDetail=(resultData?.details||[]).find(d=>String(d.correct_answer)===key);
   const modelOwner=modelDetail?items.find(it=>String(it.prompt)===String(modelDetail.prompt)):null;
   const selectedForActive=activeItem&&answerValue(activeItem)===key;
   const isUsed=!!owner;
   const resultClass=ownerDetail?(ownerDetail.ok?'result-correct':'result-wrong'):'';
   const modelClass=showModelAnswers&&modelOwner?'model-correct':'';
   const cid='head-'+key;
   return `<div class="heading-option-wrap ${selectedForActive?'is-active-match':''} ${isUsed?'heading-used':''} ${selectedForActive?'heading-current':''}">
      <button type="button" class="choice-card ${selectedForActive?'selected':''} ${resultClass} ${modelClass}" data-choice="${key}" ${isUsed&&!selectedForActive?'disabled':''}><b id="${cid}" data-content-id="${cid}" data-source="${esc(h)}">${esc(h)}</b>${isUsed?`<small class="heading-used-badge">✓ ${text('تم اختياره','Ausgewählt')}</small>`:''}</button>
      ${textTools(h,cid)}
      <div class="inline-translation" id="${cid}-translation"></div>
   </div>`;
 }).join('');
 const answeredCount=Object.keys(answers).filter(k=>answers[k]).length;
 const resultHtml='';
  const meta=matchingMeta();
  const headingsBankUnder = `
    <div class="matching-headings-bank" style="margin-top:32px;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;">
      <div class="matching-bank-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;">
        <div>
          <h3 style="margin:0 0 4px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;">
            <span>🏷️</span>
            <span>${esc(meta.title)} — ${text('العناوين المتاحة للمطابقة', 'Verfügbare Überschriften')}</span>
          </h3>
          <small style="color:var(--muted);font-size:12.5px;">${text('يمكنك مراجعة جميع العناوين هنا أو الضغط على أي عنوان لاختياره مباشرة للفقرة المحددة.', 'Überschriften zur Auswahl für die Absätze.')}</small>
        </div>

function renderBody(body){
 const fullBody=getExerciseBody(model);
 let html=escBody(fullBody||'');
 (model.items||[]).forEach(i=>{
   const n=String(i.position_no);
   const val=answerValue(n);
   const detail=resultData?.details?.find(d=>String(d.prompt)===String(i.prompt));
   const correct=String(detail?.correct_answer||'');
   const displayVal=showModelAnswers&&correct?correct:val;
   const resultClass=detail&&val?(detail.ok?'result-correct':'result-wrong'):'';
   const modelClass=showModelAnswers&&correct?'model-correct':'';
   const isSpb1=model.exercise.section==='Sprachbausteine'&&model.exercise.teil==='Teil 1';
   const isSpb2=model.exercise.section==='Sprachbausteine'&&model.exercise.teil==='Teil 2';
   const examNo=isSpb1?Number(n)+20:isSpb2?Number(n)+30:Number(n);

   let gapHtml='';
   if(isSpb1){
     const options=(i.options||[]).slice(0,3);
     const selectOpts=options.map(o=>{
       const isSel=String(displayVal).toLowerCase()===String(o.option_key).toLowerCase();
       return `<option value="${esc(o.option_key)}" ${isSel?'selected':''}>${esc(o.option_key)}) ${esc(o.option_text||o.option_key)}</option>`;
     }).join('');
     gapHtml=`<select class="inline-gap-select ${val?'answered':''} ${resultClass} ${modelClass}" data-gap-select="${n}" aria-label="${text('الفراغ','Lücke')} ${examNo}"><option value="">(${examNo}) — ${text('اختر','wählen')}</option>${selectOpts}</select>`;
   }else if(isSpb2){
     const opts=sharedOptions();
     const selectOpts=opts.map(([k,v])=>{
       const isSel=String(displayVal).toLowerCase()===String(k).toLowerCase();
       return `<option value="${esc(k)}" ${isSel?'selected':''}>${esc(k)}: ${esc(v)}</option>`;
     }).join('');
     gapHtml=`<select class="inline-gap-select ${val?'answered':''} ${resultClass} ${modelClass}" data-gap-select="${n}" aria-label="${text('الفراغ','Lücke')} ${examNo}"><option value="">(${examNo}) — ${text('اختر كلمة','Wort')}</option>${selectOpts}</select>`;
   }else{
     const shown=displayVal?esc(labelFor(n,displayVal)):'('+examNo+')';
     gapHtml='<span class="inline-answer '+(displayVal?'filled ':'')+resultClass+' '+modelClass+'">'+shown+'</span>';
   }

   const re=new RegExp('(?:_{2,}|\\(|\\[|\\{)\\s*(?:'+examNo+'|'+n+')\\s*(?:_{2,}|\\)|\\]|\\})','g');
   if(re.test(html)){
     html=html.replace(re,gapHtml);
   }else{
     const fallbackRe=new RegExp('\\b'+examNo+'\\b','g');
     if(fallbackRe.test(html)){
       html=html.replace(fallbackRe,gapHtml);
     }
   }
 });
 return html;
}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}function selectAnswer(n,val){
 const scrollState=captureExerciseScroll();
 activeItem=String(n);answers[String(n)]=val;
 submitted=false; resultData=null; showModelAnswers=false;
 rerenderExerciseStable(scrollState);
}
function sharedOptions(){const map=new Map();(model.items||[]).forEach(it=>(it.options||[]).forEach(o=>{if(o.option_text&&!map.has(o.option_key))map.set(o.option_key,o.option_text);}));return [...map.entries()];}
function getHoerenDisplayNumber(item, index, teil){
  const p = Number(item.position_no);
  if(p >= 41 && p <= 65) return p;
  const t = String(teil || '').toLowerCase();
  if(t.includes('teil 1') || t.includes('1')) return 41 + index;
  if(t.includes('teil 2') || t.includes('2')) return 46 + index;
  if(t.includes('teil 3') || t.includes('3')) return 56 + index;
  return p || (index + 1);
}

function formatAudioTime(seconds){
  const n=Number(seconds);
  if(!Number.isFinite(n)||n<0)return '0:00';
  return Math.floor(n/60)+':'+Math.floor(n%60).toString().padStart(2,'0');
}
function bindHoerenAudioPlayer(){
  const cards=document.querySelectorAll('[data-hoeren-player]');
  cards.forEach(card => {
    const audio=card.querySelector('.hoeren-native-audio');
    const play=card.querySelector('[data-audio-play]');
    const icon=card.querySelector('.hoeren-audio-play-icon');
    const progress=card.querySelector('[data-audio-progress]');
    const current=card.querySelector('[data-audio-current]');
    const durationEl=card.querySelector('[data-audio-duration]');
    const mute=card.querySelector('[data-audio-mute]');
    const volume=card.querySelector('[data-audio-volume]');
    const volumeIcon=card.querySelector('[data-audio-volume-icon]');
    if(!audio||!play)return;
    const markUnavailable=()=>{
      card.classList.add('is-unavailable');
      card.innerHTML = `<div class="hoeren-audio-unavailable" role="status"><span class="hoeren-audio-unavailable-icon" aria-hidden="true">♪</span><div><strong>${text('الصوت غير متوفر','Audio nicht verfügbar')}</strong><small>${text('تعذر تحميل الملف الصوتي لهذا التمرين.','Die Audiodatei für diese Übung konnte nicht geladen werden.')}</small></div></div>`;
    };
    audio.addEventListener('error', markUnavailable, {once:true});
    const sync=()=>{ if(card.classList.contains('is-unavailable')) return;
      const dur=Number.isFinite(audio.duration)?audio.duration:0;
      current.textContent=formatAudioTime(audio.currentTime);
      durationEl.textContent=formatAudioTime(dur);
      const pct = dur ? (audio.currentTime / dur * 100) : 0;
      progress.value = pct;
      progress.style.background = `linear-gradient(to right, var(--green) 0%, var(--green) ${pct}%, var(--line) ${pct}%, var(--line) 100%)`;
      icon.textContent=audio.paused?'▶':'❚❚';
      card.classList.toggle('is-playing',!audio.paused);
      play.setAttribute('aria-label',audio.paused?text('تشغيل الصوت','Audio abspielen'):text('إيقاف مؤقت','Pause'));
    };
    const syncVolume=()=>{
      const v=audio.muted?0:audio.volume;
      if (volume) {
        volume.value=v;
        const vPct = v * 100;
        volume.style.background = `linear-gradient(to right, var(--green) 0%, var(--green) ${vPct}%, var(--line) ${vPct}%, var(--line) 100%)`;
      }
      if (volumeIcon) volumeIcon.textContent=v===0?'🔇':v<.5?'🔉':'🔊';
    };
    play.onclick=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();
    audio.addEventListener('loadedmetadata',sync); audio.addEventListener('timeupdate',sync); audio.addEventListener('play',sync); audio.addEventListener('pause',sync); audio.addEventListener('ended',sync);
    progress.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(progress.value)/100*audio.duration;};
    if (volume) volume.oninput=()=>{audio.muted=false;audio.volume=Number(volume.value);syncVolume();};
    if (mute) mute.onclick=()=>{audio.muted=!audio.muted;syncVolume();};

    // Skip -5s / +5s
    card.querySelectorAll('[data-audio-skip]').forEach(btn => {
      btn.onclick = () => {
        const delta = Number(btn.dataset.audioSkip || 0);
        if (Number.isFinite(audio.duration)) {
          audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
        }
      };
    });

    // Speed toggle: 1x -> 0.8x -> 1.2x
    const speedBtn = card.querySelector('[data-audio-speed]');
    const speedLabel = card.querySelector('[data-audio-speed-label]');
    const speeds = [1, 0.8, 1.2];
    let speedIdx = 0;
    if (speedBtn) {
      speedBtn.onclick = () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        const rate = speeds[speedIdx];
        audio.playbackRate = rate;
        if (speedLabel) speedLabel.textContent = rate + 'x';
      };
    }

    sync(); syncVolume();
  });
}

function startExerciseTimer(){
  const el = document.getElementById('timerEl');
  if(!el || mockMode) return;
  const activeDuration = duration || (model?.exercise ? getTelcDurationSeconds(model.exercise) : 1200);
  if(!exerciseTimerEnd && activeDuration > 0){
    exerciseTimerEnd = Date.now() + activeDuration * 1000;
  }
  if(!exerciseTimerEnd) return;
  el.dataset.started = '1';
  if(exerciseTimerInterval) clearInterval(exerciseTimerInterval);
  const tick = () => {
    const curEl = document.getElementById('timerEl');
    if(!curEl) return;
    const remaining = Math.max(0, Math.ceil((exerciseTimerEnd - Date.now()) / 1000));
    const timeStr = String(Math.floor(remaining / 60)).padStart(2, '0') + ':' + String(remaining % 60).padStart(2, '0');
    curEl.innerHTML = `<span class="timer-icon" aria-hidden="true">⏱️</span> <span class="timer-digits">${timeStr}</span>`;
    curEl.classList.toggle('timer-danger', remaining <= 60);
    if(remaining <= 0){
      clearInterval(exerciseTimerInterval);
      exerciseTimerInterval = null;
      submit();
    }
  };
  tick();
  exerciseTimerInterval = setInterval(tick, 500);
}

function parseSpeakingTasks(body){
 const raw=String(body||'').replace(/\r/g,'');
 const settings=parseSettings(model.exercise);
 const candidates=[];
 const fromSettings=Array.isArray(settings.tasks)?settings.tasks:Array.isArray(settings.aufgaben)?settings.aufgaben:[];
 fromSettings.forEach(x=>{const v=typeof x==='string'?x:(x?.text||x?.title||'');if(v.trim())candidates.push(v.trim())});
 if(!candidates.length){
   raw.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{
     const m=line.match(/^(?:[-•]\s*)?(\d{1,2})[.)]\s*(.+)$/);
     if(m)candidates.push(m[2].trim());
   });
 }
 return [...new Set(candidates)].slice(0,12);
}

function loadSavedPres(catKey, lvl){
  try {
    const key = 'telc_saved_pres_' + catKey + '_' + (lvl || model?.exercise?.level || 'B2');
    const fallbackKey = 'telc_saved_pres_' + catKey;
    const raw = localStorage.getItem(key) || localStorage.getItem(fallbackKey);
    return raw ? JSON.parse(raw) : null;
  } catch(_){ return null; }
}

function savePresData(data){
  if(!data) return;
  const cat = data.category || currentPresCategory;
  const lvl = data.level || model?.exercise?.level || 'B2';
  try {
    const str = JSON.stringify(data);
    localStorage.setItem('telc_saved_pres_' + cat + '_' + lvl, str);
    localStorage.setItem('telc_saved_pres_' + cat, str);
  } catch(_){}
}

function deleteSavedPres(catKey, lvl){
  try {
    localStorage.removeItem('telc_saved_pres_' + catKey + '_' + (lvl || model?.exercise?.level || 'B2'));
    localStorage.removeItem('telc_saved_pres_' + catKey);
  } catch(_){}
}

async function copyPresText(str, btn){
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(str);
      ok = true;
    }
  } catch(_) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok = true;
    } catch(_) {}
  }
  if (btn) {
    const span = btn.querySelector('span') || btn;
    const old = span.textContent;
    btn.style.borderColor = '#228151';
    btn.style.color = '#228151';
    span.textContent = text('تم النسخ بنجاح ✓','Kopiert ✓');
    setTimeout(() => {
      span.textContent = old;
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2200);
  }
}

    items.forEach(it=>{const n=String(it.position_no);optionOrders[n]=shuffle((it.options||[]).slice(0,3).map(o=>o.option_key));});
  }else if(sec==='Hören'){
    if(items.some(it=>(it.options||[]).some(o=>String(o.option_text||o.option_key).toLowerCase()==='richtig'||String(o.option_text||o.option_key).toLowerCase()==='falsch')) || String(model?.exercise?.task_type||'')==='AUDIO_TF'){
      hoerenOrder=shuffle(hoerenOrder||items.map((_,i)=>i));
    }else{
      items.forEach(it=>{const n=String(it.position_no);optionOrders[n]=shuffle((it.options||[]).slice(0,4).map(o=>o.option_key));});
    }
  }else if(sec==='Sprachbausteine' && teil==='Teil 1'){
    items.forEach(it=>{const n=String(it.position_no);optionOrders[n]=shuffle((it.options||[]).slice(0,3).map(o=>o.option_key));});
  }else if(sec==='Sprachbausteine' && teil==='Teil 2'){
    const opts=sharedOptions();
    wordOrder=shuffle((wordOrder||opts.map(([k])=>k)));
  }
  const st=captureExerciseScroll();
  rerenderExerciseStable(st);
}

function unifiedExerciseHeading({section, teil='', timer='', showTeil=true, showShuffle=false, title='', showTitle=true, extraClass=''}){
 const safeSection=esc(section||'');
 const safeTeil=esc(teil||'');
 const shuffle=showShuffle&&!mockMode?`<button type="button" class="exercise-heading-shuffle" id="headingShuffleBtn" title="${text('خلط الأسئلة','Aufgaben mischen')}" aria-label="${text('خلط الأسئلة','Aufgaben mischen')}"><span aria-hidden="true">⤨</span><span>${text('خلط الأسئلة','Aufgaben mischen')}</span></button>`:'';
 const titleMarkup=showTitle&&!mockMode?`<div class="thema-title-row"><h1 id="thema-title" class="${titleRevealed?'':'thema-title-hidden'}" data-content-id="thema-title" data-source="${esc(title||'')}">${esc(title||'')}</h1><div class="thema-tools">${textTools(title||'','thema-title')}<button type="button" class="mini-tool title-reveal" data-title-reveal aria-pressed="${titleRevealed}" aria-label="${titleRevealed?text('إخفاء عنوان الموضوع','Thema ausblenden'):text('إظهار عنوان الموضوع','Thema anzeigen')}">${titleRevealed?'◉':'◌'}</button><div class="inline-translation" id="thema-title-translation"></div></div></div>`:'';
 return `<div class="exercise-heading ${extraClass}"><div class="exercise-heading-meta"><div class="exercise-heading-tags"><span class="tag tag-level-section">Telc ${esc(model.exercise.level||'B2')} · ${safeSection}</span>${showTeil&&safeTeil?`<span class="tag tag-teil">${safeTeil}</span>`:''}</div><div class="exercise-heading-controls">${shuffle}${timer?`<div class="exercise-heading-timer">${timer}</div>`:''}</div></div><div class="exercise-heading-title">${titleMarkup}</div></div>`;
}

function layout(main,side,workspaceClass=''){
 const activeDuration = duration || (model?.exercise ? getTelcDurationSeconds(model.exercise) : 1200);
 const initialMin = String(Math.floor(activeDuration/60)).padStart(2,'0');
 const timer = (mockMode || activeDuration) ? `<div class="progress-pill ${mockMode ? 'mock-global-timer' : ''}" id="timerEl"><span class="timer-icon" aria-hidden="true">⏱️</span> <span class="timer-digits">${initialMin}:00</span></div>` : '';
 const isHoeren = String(model?.exercise?.section||'').toLowerCase().includes('hör') || String(model?.exercise?.section||'').toLowerCase().includes('hoer');
 const combinedWorkspaceClass = [workspaceClass, isHoeren ? 'hoeren-workspace' : ''].filter(Boolean).join(' ');
 const shuffleSections = ['Lesen','Hören','Sprachbausteine'];
 const hasTopShuffle = !mockMode && shuffleSections.includes(String(model.exercise.section||''));
 const headingMarkup = unifiedExerciseHeading({section:model.exercise.section, teil:model.exercise.teil, timer, showTeil:true, showShuffle:hasTopShuffle, title:model.exercise.title||'', showTitle:true});
 return `${headingMarkup}
 ${renderAudio()}
 ${resultPanel}
 <div class="exam-workspace ${combinedWorkspaceClass}">
   <section class="exam-main">${main}</section>
 </div>
 <div class="exercise-actions">
   <div class="exercise-nav">
     <button class="btn" id="checkBtn">${text(mockMode?'إنهاء الجزء':'تحقق من الإجابات',mockMode?'Teil beenden':'Antworten prüfen')}</button>
     ${mockMode?'':`<button class="btn model-btn" id="modelBtn">${text(showModelAnswers ? 'إخفاء الإجابة' : 'الإجابة النموذجية', showModelAnswers ? 'Musterlösung ausblenden' : 'Musterlösung')}</button>`}
   </div>
 </div>`;
}

function bindActions(){
 const b=document.getElementById('checkBtn');
 if(b)b.onclick=submit;
 const mb=document.getElementById('modelBtn');
 if(mb)mb.onclick=async()=>{
   const st=captureExerciseScroll();
   try{
     if(!submitted && !resultData) await submit();
     showModelAnswers=!showModelAnswers;
     rerenderExerciseStable(st);
   }catch(e){document.getElementById('content').insertAdjacentHTML('beforeend',`<div class="alert bad">${esc(e.message)}</div>`);restoreExerciseScroll(st);}
 };
  const topShuffle=document.getElementById('headingShuffleBtn');
  if(topShuffle) topShuffle.onclick=e=>{e.preventDefault();e.stopPropagation();topShuffleCurrentExercise();};
  if(mockMode){startMockTimer();}else{startExerciseTimer();}
  bindHoerenAudioPlayer();
}

function renderWorkspace(){
  stopSpeaking();
  const t=model.exercise.task_type;
  const isSpb1=model.exercise.section==='Sprachbausteine'&&model.exercise.teil==='Teil 1';
  const isMatching=(t==='MATCHING')||(model.exercise.section==='Lesen'&&['Teil 1','Teil 3'].includes(model.exercise.teil))||(model.exercise.section==='Hören'&&model.exercise.teil==='Teil 3');
  const isHoerenTF=(t==='AUDIO_TF')||(model.exercise.section==='Hören'&&['Teil 1','Teil 2','Teil 3'].includes(model.exercise.teil)&&(model.items||[]).length>0&&(model.items||[]).every(it=>{
    const keys=(it.options||[]).map(o=>String(o.option_text||o.option_key).toLowerCase());
    const sol=String(it.correct_answer||'').toLowerCase();
    return keys.includes('richtig')||keys.includes('falsch')||sol==='richtig'||sol==='falsch'||keys.length===0;
  }));
  if(t==='WRITING')return renderWriting();
  if(t==='SPEAKING')return renderSpeaking();
  // Hören always uses the dedicated TELC True/False layout: audio above the questions,
  // RICHTIG / FALSCH / AUSSAGE table in the middle, with the existing header and bottom actions unchanged.
  if(model.exercise.section==='Hören')return renderTF();
  if(isSpb1)return renderSprachbausteine1();
  if(isMatching)return renderMatching();
  return renderChoiceQuestions();
}
function renderResult(r){const st=captureExerciseScroll();submitted=true;resultData=r;rerenderExerciseStable(st);}
async function submit(){if(!model.items.length){if(mockMode){goNextMock();}return;}showModelAnswers=false;try{const r=await api('exercise-submit',{method:'POST',body:{exercise_id:id,answers}});localStorage.setItem('last_exercise_result_'+id,JSON.stringify(r));markExerciseCompleted(id);if(mockMode){const s=getMockSession();if(s){s.results=s.results||[];s.results.push({id,title:model.exercise.title,section:model.exercise.section,teil:model.exercise.teil,score:r.score,max:r.max,percent:r.percent,result:r.result});s.index=(s.ids||[]).findIndex(x=>String(x)===String(id));localStorage.setItem('telc_self_test',JSON.stringify(s));}goNextMock();return;}renderResult(r);}catch(e){document.getElementById('content').insertAdjacentHTML('beforeend',`<div class="alert bad">${esc(e.message)}</div>`);}}
document.addEventListener('langchange', () => {
  if (!model?.exercise || model.exercise.section !== 'Hören') return;
  const st = captureExerciseScroll();
  renderTF();
  bindActions();
  restoreExerciseScroll(st);
});
(async()=>{
  try{
    if(!id){
      throw new Error(text('معرف التمرين غير محدد في الرابط.','Keine Übungs-ID angegeben.'));
    }
    const d=await api('exercise-get?id='+encodeURIComponent(id));
    if(!d||!d.exercise){
      throw new Error(text('تعذر العثور على التمرين المطلوب. قد يكون غير منشور أو محذوف.','Übung nicht gefunden oder nicht veröffentlicht.'));
    }
    model=d;
    titleRevealed=false;
    document.body.classList.toggle('mock-mode',mockMode);
    renderWorkspace();
    bindActions();
    if(mockMode)startMockTimer();
  }catch(e){
    console.error('Exercise load error:', e);
    if (e?.status === 401) {
      try { localStorage.removeItem('telc_student_token'); } catch (_) {}
      location.href = '/login.html?error=login_required';
      return;
    }
    const isDe = (typeof getLang === 'function' && getLang() === 'de');
    if (e?.status === 403 || e?.data?.error === 'payment_required') {
      const contentEl = document.getElementById('content');
      if (contentEl) {
        contentEl.innerHTML = `
          <div class="empty-panel" style="margin:50px auto;max-width:540px;text-align:center;padding:36px 28px;background:var(--white);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg)">
            <div style="font-size:48px;margin-bottom:14px">🔒</div>
            <h2 style="margin-bottom:8px;font-size:22px;color:var(--ink);">${isDe ? 'Kostenpflichtige Übung' : 'تمرين مخصص للمشتركين'}</h2>
            <p class="muted" style="margin-bottom:24px;line-height:1.7;font-size:14px;">${isDe ? 'Diese Übung ist nur für Abonnenten verfügbar. Schalten Sie jetzt alle B1-, B2- und C1-Inhalte frei.' : 'هذا التمرين متاح فقط مع الاشتراكات المدفوعة. يمكنك ترقية حسابك لفتح جميع تمارين واختبارات B1 وB2 وC1 كاملة.'}</p>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
              <a class="btn" href="/plans.html" style="padding:12px 24px;font-size:15px;font-weight:900;">${isDe ? 'Pläne ansehen & Freischalten →' : 'عرض الخطط والاشتراك الآن ←'}</a>
              <a class="btn light" href="/dashboard.html">${isDe ? 'Zurück zum Dashboard' : 'العودة للتمارين المجانية'}</a>
            </div>
          </div>`;
      }
      return;
    }
    const msg = e?.message || (isDe ? 'Fehler beim Laden der Übung.' : 'حدث خطأ أثناء تحميل التمرين.');
    const retryTxt = isDe ? 'Erneut versuchen' : 'إعادة المحاولة';
    const backTxt = isDe ? 'Zurück zum Dashboard' : 'العودة إلى لوحة التمارين';
    const contentEl = document.getElementById('content');
    if(contentEl){
      contentEl.innerHTML = `
        <div class="empty-panel" style="margin:50px auto;max-width:540px;text-align:center;padding:32px;background:var(--white);border-radius:20px;box-shadow:var(--shadow)">
          <div style="font-size:36px;margin-bottom:12px">⚠️</div>
          <h3 style="margin-bottom:10px">${isDe ? 'Übung konnte nicht geladen werden' : 'تعذر تحميل التمرين'}</h3>
          <p class="muted" style="margin-bottom:24px">${esc(msg)}</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            <button class="btn" type="button" onclick="location.reload()">${retryTxt}</button>
            <a class="btn light" href="/dashboard.html">${backTxt}</a>
          </div>
        </div>`;
    }
  }
})();

</script></body></html>
