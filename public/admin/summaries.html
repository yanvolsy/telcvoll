<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملخصات</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>
</head>
<body>
<header class="top admin-nav">
  <a class="brand" href="/admin/index.html" aria-label="TELC Voll">
    <span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span>
    <span class="admin-badge">Admin</span>
  </a>
  <nav class="admin-top-links" aria-label="لوحة الإدارة">
    <a href="/admin/index.html">الرئيسية</a>
    <a href="/admin/questions.html">التمارين</a>
    <a href="/admin/students.html">الطلاب</a>
    <a href="/admin/plans.html">الخطط</a>
    <a href="/admin/orders.html">طلبات الدفع</a>
    <a href="/admin/campaigns.html">البريد</a>
    <a href="/admin/notifications.html">التنبيهات</a>
    <a href="/admin/settings.html">الإعدادات</a>
    <a href="#" id="logoutLink" class="nav-logout-btn">خروج</a>
  </nav>
</header>
<main class="wrap">
  <div class="panel">
    <h1>الملخصات</h1>
    <form id="f">
      <select name="section">
        <option>Lesen</option><option>Hören</option><option>Sprachbausteine</option><option>Schreiben</option><option>Sprechen</option>
      </select>
      <input name="teil" placeholder="Teil 1">
      <input name="title" placeholder="العنوان">
      <textarea name="body" placeholder="الملخص"></textarea>
      <textarea name="keywords" placeholder="الكلمات المهمة"></textarea>
      <textarea name="strategy" placeholder="الاستراتيجية"></textarea>
      <textarea name="errors" placeholder="الأخطاء الشائعة"></textarea>
      <button class="btn">نشر</button>
    </form>
  </div>
  <div class="grid" id="list" style="margin-top:18px"></div>
</main>
<footer class="admin-footer">TELC Voll — لوحة إدارة المنصة</footer>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script><script src="/assets/admin-guard.js"></script>
<script>
logoutLink.onclick = async (e) => { e.preventDefault(); await api('admin-logout', { method: 'POST' }); location.href = '/admin/login.html'; };

f.onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(f);
  await api('admin-summaries', { method: 'POST', body: {
    section: fd.get('section'), teil: fd.get('teil'), title: fd.get('title'),
    body: fd.get('body'), keywords: fd.get('keywords'), strategy: fd.get('strategy'), errors: fd.get('errors'),
  }});
  f.reset();
  load();
};

async function load() {
  const { summaries } = await api('admin-summaries');
  list.innerHTML = summaries.map((r) => `
    <div class="card"><span class="tag">${esc(r.section)} · ${esc(r.teil)}</span><h3>${esc(r.title)}</h3></div>`
  ).join('');
}

load().catch(() => location.href = '/admin/login.html');
</script>
</body>
</html>
