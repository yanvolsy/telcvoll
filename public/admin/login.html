<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل دخول المشرف | TELC Voll</title>
<link rel="stylesheet" href="/assets/app.css?v=20260927-subscription-activation-mail-v10">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style>
html, html body, html body * { font-family: "Cairo", "Segoe UI", Arial, sans-serif !important; }
body.admin-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg, #f8fafc); }
.admin-login-wrap { width: 100%; max-width: 440px; margin: auto; }
.login-card { background: var(--bg-surface, #fff); border: 1px solid var(--border-subtle, var(--line)); border-radius: 24px; padding: clamp(24px, 5vw, 36px) clamp(20px, 4vw, 32px); box-shadow: var(--shadow-lg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-align: center; color: var(--text-primary); }
.brand-center { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; text-decoration: none; color: var(--text-primary); }
.login-card h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.03em; color: var(--text-primary); font-weight: 900; }
.login-card p.muted { margin: 0 0 24px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }

.login-form { text-align: right; }
.form-field { margin-bottom: 18px; }
.form-field label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; }
.form-field input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--border-subtle, var(--line)); border-radius: 12px; font-size: 14px; background: var(--bg-surface-elevated, var(--bg)); color: var(--text-primary); font-family: inherit; transition: all .15s; }
.form-field input:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-subtle); }

.login-btn { width: 100%; padding: 12px 16px; font-size: 14px; font-weight: 900; border-radius: 12px; background: var(--brand-primary, #FF7A2F); border: 1px solid var(--brand-primary, #FF7A2F); color: #fff; cursor: pointer; transition: all .18s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 12px rgba(255, 122, 47, 0.25); font-family: inherit; }
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255, 122, 47, 0.35); }
.login-btn:active { transform: translateY(0); }

.alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 13px; font-weight: 850; text-align: right; }
.alert.bad { background: var(--state-danger-subtle, #fee2e2); color: var(--state-danger, #991b1b); border: 1px solid var(--state-danger-border, #fca5a5); }

.back-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; font-size: 12.5px; font-weight: 800; color: var(--text-muted); text-decoration: none; transition: color .15s; }
.back-link:hover { color: var(--brand-primary); }
</style>
</head>
<body class="admin-shell">
<main class="admin-login-wrap">
  <div class="login-card">
    <div class="brand-center">
      <span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span>
      <span class="admin-badge">Admin</span>
    </div>
    <h1>دخول المشرف</h1>
    <p class="muted">الوصول إلى لوحة الإدارة والتحكم في منصة TELC Voll.</p>

    <div id="msg"></div>

    <form id="f" class="login-form">
      <div class="form-field">
        <label>كلمة مرور المشرف</label>
        <input name="password" type="password" required placeholder="••••••••••••" autocomplete="current-password" autofocus>
      </div>
      <button class="login-btn" type="submit" id="submitBtn">تسجيل الدخول ←</button>
    </form>

    <a href="/index.html" class="back-link">← العودة إلى منصة الطلاب</a>
  </div>
</main>

<script src="/assets/i18n.js?v=20260927-subscription-activation-mail-v10"></script>
<script src="/assets/app.js"></script>
<script>
function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
f.onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('submitBtn') || f.querySelector('button');
  const fd = new FormData(f);
  btn.disabled = true;
  btn.textContent = 'جارٍ التحقق…';
  try {
    await api('admin-login', { method: 'POST', body: { password: fd.get('password') } });
    location.href = '/admin/index.html';
  } catch (err) {
    msg.innerHTML = `<div class="alert bad">${esc(err.data?.error || err.message || 'بيانات الدخول غير صحيحة')}</div>`;
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول ←';
  }
};
</script>
</body>
</html>
