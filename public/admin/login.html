<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FF7A2F"><title>دخول المشرف</title><link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="admin-shell">
<main class="wrap">
<div class="panel admin-card" style="max-width:480px;margin:70px auto;border-radius:24px;padding:36px">
  <div style="display:flex;justify-content:center;margin-bottom:20px">
    <a class="brand" href="/" aria-label="TELC Voll"><span class="brand-dot"></span><span class="brand-name"><span class="brand-telc">TELC</span> <span class="brand-voll">Voll</span></span></a>
  </div>
  <div style="text-align:center">
    <span class="tag">بوابة المشرف</span>
    <h1 style="margin:10px 0 6px">دخول المشرف</h1>
    <p class="muted" style="margin:0 0 24px">الوصول إلى إدارة المحتوى والطلاب والخطط والإحصائيات.</p>
  </div>
  <div id="msg"></div>
  <form id="f">
    <label style="font-weight:700">كلمة المرور</label>
    <input name="password" type="password" required placeholder="أدخل كلمة مرور المشرف" autocomplete="current-password">
    <button class="btn" style="width:100%">دخول إلى لوحة الإدارة ←</button>
  </form>
</div>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script><script>
f.onsubmit=async(e)=>{e.preventDefault();const fd=new FormData(f);try{await api('admin-login',{method:'POST',body:{password:fd.get('password')}});location.href='/admin/index.html';}catch(err){msg.innerHTML=`<div class="alert bad">${esc(err.data?.error||'بيانات الدخول غير صحيحة')}</div>`;}};
</script></body></html>
