<style>
:root{--admin-max:1320px}.exercise-admin{max-width:var(--admin-max);margin:auto;padding:28px 22px 70px}.admin-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.admin-head h1{margin:7px 0 5px;font-size:clamp(30px,4vw,46px);letter-spacing:-.04em}.admin-head p{margin:0;color:var(--muted)}
.context-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.context-item{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:13px 16px}.context-item span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.context-item strong{font-size:15px}
.browser{background:transparent}.browser-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.browser-toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.browser-toolbar h2{margin:0;font-size:22px}.browser-filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:10px;margin-bottom:16px}.browser-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.student-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column}.student-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.student-card h3{font-size:19px;margin:17px 0 7px}.student-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}.student-card .open-like{margin-top:auto;padding-top:16px;color:var(--green);font-weight:900;font-size:13px}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.icon-btn{width:36px;height:34px;border:1px solid var(--line);background:var(--white);border-radius:10px;cursor:pointer;font-size:16px;font-weight:900}.icon-btn:hover{border-color:var(--green)}.icon-btn.danger{color:var(--danger);border-color:#e4b0aa}.empty{grid-column:1/-1;padding:42px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:var(--white)}
.modal{position:fixed;inset:0;background:rgba(7,16,12,.48);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal.open{display:flex}.modal-box{width:min(1040px,100%);max-height:92vh;overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.22)}.modal-head{position:sticky;top:0;z-index:2;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:19px 22px}.modal-head h2{margin:0;font-size:22px}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--white);cursor:pointer;font-size:20px}.modal-body{padding:22px}.context-lock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.locked{background:var(--green-soft);border:1px solid var(--line);border-radius:13px;padding:11px 13px}.locked small{display:block;color:var(--muted);font-size:10px}.locked b{display:block;margin-top:3px}.field{margin-bottom:16px}.field label{display:block;font-weight:900;margin-bottom:7px}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:125px;resize:vertical}.section-box{border:1px solid var(--line);border-radius:17px;padding:16px;margin-top:17px;background:rgba(255,241,229,.55)}.section-box h3{margin:0 0 5px;font-size:16px}.help{color:var(--muted);font-size:11px;margin:0 0 13px;line-height:1.7}.dynamic-row{display:flex;gap:8px;align-items:center;margin:9px 0}.dynamic-row input,.dynamic-row textarea,.dynamic-row select{flex:1}.remove-btn{border:0;background:#fff0ee;color:var(--danger);border-radius:9px;padding:9px 11px;cursor:pointer;font-weight:900;flex:0 0 auto}.add-btn{margin-top:9px}.para-card,.question-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.row-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;font-weight:900}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--white)}.choice-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-weight:900}.choice input[type=text]{margin-top:3px}.correct-radio{accent-color:var(--green)}.audio-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}.audio-preview{font-size:11px;color:var(--muted);margin-top:8px}.modal-footer{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:15px 22px;display:flex;justify-content:flex-start;gap:10px}.toast{position:fixed;top:22px;right:22px;z-index:1200;background:#d96b12;color:#fff;padding:13px 18px;border-radius:13px;font-weight:900;box-shadow:0 15px 40px rgba(0,0,0,.18);display:none}.toast.show{display:block}.toast.bad{background:#b83c35}

.spb-editor-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:16px;align-items:start}.spb-editor-pane,.spb-preview-pane{min-width:0}.section-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.editor-badge,.preview-status{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900}.spb-text-editor{min-height:260px;font-family:inherit;direction:ltr;text-align:left;line-height:2}.gap-editor-card{padding:14px}.gap-editor-card .row-title{margin-bottom:12px}.gap-editor-card .row-title small{color:var(--muted);font-weight:700}.correct-word-chip{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:5px 9px}.gap-answer-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:start}.correct-source label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.source-word{min-height:42px;display:flex;align-items:center;padding:9px 12px;border:1px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.6);font-weight:900;direction:ltr;text-align:left}.spb-preview-pane{position:sticky;top:10px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:var(--shadow);overflow:hidden}.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.preview-head h3{margin:2px 0 0;font-size:17px}.preview-kicker{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:900}.student-preview{padding:16px;max-height:70vh;overflow:auto}.preview-meta{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted);margin-bottom:13px}.preview-text{direction:ltr;text-align:left;font-size:14px;line-height:2.05;border:1px solid var(--line);border-radius:13px;padding:15px;background:rgba(0,0,0,.025)}.preview-gap{display:inline-flex;min-width:34px;height:24px;align-items:center;justify-content:center;border:1px solid #8a9bb1;border-radius:6px;background:rgba(244,123,32,.08);color:#8a5a2a;font-size:11px;font-weight:900;vertical-align:middle;margin:0 2px}.preview-questions{margin-top:14px;display:grid;gap:8px}.preview-q{border:1px solid var(--line);border-radius:11px;padding:9px}.preview-q-title{font-size:11px;font-weight:900;margin-bottom:7px}.preview-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.preview-options button,.bank-grid button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px;font-size:11px;font-weight:800}.preview-bank{margin-top:14px;border:1px solid var(--line);border-radius:13px;padding:12px}.bank-title{font-size:11px;font-weight:900;margin-bottom:9px}.bank-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.bank-grid button{display:flex;gap:7px;align-items:center;text-align:left;direction:ltr}.bank-grid small{color:var(--muted);font-weight:900}.distractor-box{background:rgba(244,123,32,.035)}
@media(max-width:900px){.browser-list{grid-template-columns:1fr}.browser-filters{grid-template-columns:1fr 1fr}.context-bar,.context-lock{grid-template-columns:1fr}.choice-grid,.audio-box{grid-template-columns:1fr}.spb-editor-grid{grid-template-columns:1fr}.spb-preview-pane{position:relative;top:auto}.gap-answer-grid{grid-template-columns:1fr}}
@media(max-width:600px){.exercise-admin{padding:20px 13px 55px}.admin-head{align-items:flex-start;flex-direction:column}.browser-filters{grid-template-columns:1fr}.modal{padding:8px}.modal-box{max-height:96vh;border-radius:18px}.modal-body{padding:15px}.modal-head{padding:15px}.modal-footer{padding:12px 15px}.dynamic-row{align-items:stretch}.dynamic-row .remove-btn{align-self:center}}
</style>
<script src="/assets/pwa-theme.js" defer></script></head>
<body class="admin-shell">
<header class="top admin-nav"><a class="brand" href="/admin/index.html" aria-label="TELC Voll"><span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span></a><nav><a href="/admin/index.html">الرئيسية</a><a href="#" id="logoutLink">خروج</a></nav></header>
<main class="exercise-admin">
  <div class="admin-head"><div><span class="tag">لوحة المشرف</span><h1>إدارة التمارين</h1><p>اختر المستوى والقسم وTeil، وستظهر التمارين بنفس منطق بطاقات الطالب.</p></div></div>
  <div class="context-bar"><div class="context-item"><span>المستوى</span><strong id="pageLevel">Telc B2</strong></div><div class="context-item"><span>القسم</span><strong id="pageSection">Lesen — القراءة</strong></div><div class="context-item"><span>Teil</span><strong id="pageTeil">Teil 1</strong></div></div>
  <section class="panel browser"><div class="browser-toolbar"><div><h2>التمارين</h2></div><div class="browser-toolbar-actions"><button class="small-btn" id="refreshBtn">تحديث</button><button class="small-btn" id="importBtn">⇧ استيراد تمارين</button><button class="btn" id="newBtn">+ إضافة موضوع جديد</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></div>
    <div class="browser-filters"><select id="browserLevel"><option>B1</option><option selected>B2</option><option>C1</option></select><select id="browserSection"><option value="Lesen">Lesen — القراءة</option><option value="Hören">Hören — الاستماع</option><option value="Sprachbausteine">Sprachbausteine — القواعد والمفردات</option><option value="Schreiben">Schreiben — الكتابة</option><option value="Sprechen">Sprechen — التحدث</option></select><select id="browserTeil"></select><input id="browserSearch" placeholder="ابحث عن موضوع…"></div>
    <div class="browser-list" id="browserList"></div>
  </section>
</main>
<footer class="admin-footer">TELC Voll — لوحة إدارة المنصة</footer>
<div id="toast" class="toast"></div>

<div class="modal" id="editorModal" aria-hidden="true"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">إضافة موضوع جديد</h2><button class="close" id="closeModal">×</button></div><div class="modal-body">
  <div class="context-lock"><div class="locked"><small>المستوى</small><b id="lockLevel">Telc B2</b></div><div class="locked"><small>القسم</small><b id="lockSection">Lesen — القراءة</b></div><div class="locked"><small>Teil</small><b id="lockTeil">Teil 1</b></div></div>
  <div class="field"><label>عنوان الموضوع / Thema</label><input id="title" placeholder="مثال: LimOnade"></div>
  <div id="dynamic"></div>
</div><div class="modal-footer"><button class="btn" id="saveBtn">إضافة الموضوع</button><button class="small-btn" id="cancelBtn">إلغاء</button></div></div></div>
<script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script src="/assets/admin-guard.js"></script>
<script>
const state={editId:null,cloneMode:false,exercises:[]};
const teilMap={Lesen:['Teil 1','Teil 2','Teil 3'],Hören:['Teil 1','Teil 2','Teil 3'],Sprachbausteine:['Teil 1','Teil 2'],Schreiben:['Teil 1'],Sprechen:['Teil 1','Teil 2','Teil 3']};
const taskMap={Lesen:{'Teil 1':'MATCHING','Teil 2':'MCQ','Teil 3':'MATCHING'},Hören:{'Teil 1':'AUDIO_MCQ','Teil 2':'AUDIO_TF','Teil 3':'MATCHING'},Sprachbausteine:{'Teil 1':'GAP','Teil 2':'GAP'},Schreiben:{'Teil 1':'WRITING'},Sprechen:{'Teil 1':'SPEAKING','Teil 2':'SPEAKING','Teil 3':'SPEAKING'}};
const sectionNames={Lesen:'Lesen — القراءة',Hören:'Hören — الاستماع',Sprachbausteine:'Sprachbausteine — القواعد والمفردات',Schreiben:'Schreiben — الكتابة',Sprechen:'Sprechen — التحدث'};
const $=id=>document.getElementById(id); const modal=$('editorModal');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function currentContext(){return {level:$('browserLevel').value,section:$('browserSection').value,teil:$('browserTeil').value||'Teil 1'};}
function setTeile(select,section,keep){const old=keep||select.value;select.innerHTML=(teilMap[section]||['Teil 1']).map(t=>`<option>${t}</option>`).join('');if([...select.options].some(o=>o.value===old))select.value=old;}
function updateContext(){const c=currentContext();$('pageLevel').textContent='Telc '+c.level;$('pageSection').textContent=sectionNames[c.section];$('pageTeil').textContent=c.teil;}
function openModal(mode='new',data=null){const c=currentContext();state.editId=mode==='edit'?data.id:null;state.cloneMode=mode==='clone';modal.classList.add('open');modal.setAttribute('aria-hidden','false');$('modalTitle').textContent=mode==='edit'?'تعديل الموضوع':mode==='clone'?'مضاعفة الموضوع':'إضافة موضوع جديد';$('saveBtn').textContent=mode==='edit'?'حفظ التعديلات':mode==='clone'?'إضافة النسخة':'إضافة الموضوع';$('lockLevel').textContent='Telc '+c.level;$('lockSection').textContent=sectionNames[c.section];$('lockTeil').textContent=c.teil;$('title').value=mode==='new'?'':(data?.title||'');let formData=mode==='new'?{}:JSON.parse(JSON.stringify(data||{}));if(c.section==='Sprachbausteine'&&formData.body&&Array.isArray(formData.items)){formData.body=formData.body.replace(/\((\d+)\)/g,(_,n)=>{const it=formData.items.find(x=>String(x.position_no||formData.items.indexOf(x)+1)===String(n));return it?.correctText?'['+it.correctText+']':'('+n+')';});}renderDynamic(taskMap[c.section]?.[c.teil],formData);setTimeout(()=>$('title').focus(),30);}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');state.editId=null;state.cloneMode=false;}
function renderDynamic(type,data={}){const c=currentContext();const d=$('dynamic');d.innerHTML='';
 if(type==='MATCHING') renderMatching(data);
 else if(type==='MCQ'||type==='AUDIO_MCQ') renderMCQ(data,type==='AUDIO_MCQ');
 else if(type==='AUDIO_TF') renderTF(data);
 else if(type==='GAP') { if(c.section==='Sprachbausteine' && c.teil==='Teil 2') renderGap2(data); else renderGap1(data); }
 else if(type==='WRITING') renderSimpleText(data,'نص الموضوع / Situation','اكتب نص الموضوع الذي سيظهر للطالب.');
 else renderSimpleText(data,'موضوع التحدث / Aufgabenstellung','اكتب موضوع أو تعليمات التحدث.');
}
function renderMatching(data){$('dynamic').innerHTML=`<div class="section-box"><h3>العناوين / الخيارات</h3><p class="help">أضف العناوين أولاً. يمكنك إضافة أي عدد من العناوين، ثم ستظهر تلقائياً في قائمة اختيار الإجابة الصحيحة لكل فقرة.</p><div id="heads"></div><button type="button" class="small-btn add-btn" id="addHead">+ إضافة عنوان</button></div><div class="section-box"><h3>الفقرات</h3><p class="help">لكل فقرة اكتب النص ثم اختر العنوان الصحيح من القائمة.</p><div id="paras"></div><button type="button" class="small-btn add-btn" id="addPara">+ إضافة فقرة</button></div>`;
 const heads=(data.headings||[]);(heads.length?heads:['']).forEach(x=>addHead(x));const items=data.items||[];(items.length?items:[{}]).forEach(x=>addPara(x));$('addHead').onclick=()=>addHead('');$('addPara').onclick=()=>addPara({});refreshHeadingSelects();}
function addHead(value){const wrap=$('heads');if(!wrap)return;const row=document.createElement('div');row.className='dynamic-row';row.innerHTML=`<input class="head-input" value="${esc(value)}" placeholder="عنوان / Überschrift"><button type="button" class="remove-btn">حذف</button>`;wrap.appendChild(row);row.querySelector('.remove-btn').onclick=()=>{row.remove();refreshHeadingSelects();};row.querySelector('input').oninput=refreshHeadingSelects;}
function refreshHeadingSelects(){const heads=[...document.querySelectorAll('.head-input')].map(x=>x.value.trim());document.querySelectorAll('.correct-head').forEach(sel=>{const cur=sel.value;sel.innerHTML='<option value="">اختر العنوان الصحيح…</option>'+heads.map((h,i)=>`<option value="${String.fromCharCode(65+i)}">${String.fromCharCode(65+i)} — ${esc(h||'عنوان فارغ')}</option>`).join('');if([...sel.options].some(o=>o.value===cur))sel.value=cur;});}
function addPara(data){const wrap=$('paras');const n=wrap.children.length+1;const row=document.createElement('div');row.className='para-card';row.innerHTML=`<div class="row-title"><span>الفقرة ${n}</span><button type="button" class="remove-btn">حذف</button></div><textarea class="para-text" placeholder="اكتب الفقرة هنا">${esc(data.prompt||'')}</textarea><label class="field-label">العنوان الصحيح للفقرة</label><select class="correct-head" data-value="${esc(data.correct||'')}"><option value="">اختر العنوان الصحيح…</option></select>`;wrap.appendChild(row);row.querySelector('.remove-btn').onclick=()=>{row.remove();[...wrap.children].forEach((x,i)=>x.querySelector('.row-title span').textContent='الفقرة '+(i+1));};refreshHeadingSelects();const sel=row.querySelector('.correct-head');if(data.correct)sel.value=data.correct;}
function renderMCQ(data,audio){$('dynamic').innerHTML=`${audio?`<div class="section-box"><h3>ملف الصوت</h3><p class="help">اختر ملف MP3 إن وجد. يمكن أيضاً وضع رابط الصوت إذا كان الملف مستضافاً مسبقاً.</p><div class="audio-box"><input id="audioFile" type="file" accept="audio/*"><input id="audioUrl" placeholder="رابط الصوت (اختياري)" value="${esc(data.audio_url||'')}"></div><div class="audio-preview">سيتم حفظ ملف الصوت المختار مباشرة مع الموضوع (حتى 5MB). ويمكنك بدلاً منه استعمال رابط مستضاف.</div></div>`:''}<div class="section-box"><h3>${audio?'الأسئلة والاختيارات':'النص الطويل والأسئلة'}</h3>${!audio?`<div class="field"><label>النص الطويل</label><textarea id="mainBody" placeholder="أدخل النص الطويل هنا">${esc(data.body||'')}</textarea></div>`:''}<div id="questions"></div><button type="button" class="small-btn add-btn" id="addQuestion">+ إضافة سؤال</button></div>`;const items=data.items||[];(items.length?items:[{}]).forEach(x=>addQuestion(x));$('addQuestion').onclick=()=>addQuestion({});}
function addQuestion(data){const wrap=$('questions');const n=wrap.children.length+1;const opts=data.options||{};const row=document.createElement('div');row.className='question-card';row.innerHTML=`<div class="row-title"><span>السؤال ${n}</span><button type="button" class="remove-btn">حذف</button></div><textarea class="q-prompt" placeholder="نص السؤال">${esc(data.prompt||'')}</textarea><div class="choice-grid">${['A','B','C'].map(k=>`<label class="choice"><div class="choice-head"><input class="correct-radio" type="radio" name="correct-${n}" value="${k}" ${data.correct===k?'checked':''}> ${k} <span>الإجابة</span></div><input type="text" class="q-opt" data-key="${k}" value="${esc(opts[k]||'')}" placeholder="نص الاختيار"></label>`).join('')}</div>`;wrap.appendChild(row);row.querySelector('.remove-btn').onclick=()=>{row.remove();[...wrap.children].forEach((x,i)=>x.querySelector('.row-title span').textContent='السؤال '+(i+1));};}
function renderTF(data){$('dynamic').innerHTML=`<div class="section-box"><h3>ملف الصوت</h3><div class="audio-box"><input id="audioFile" type="file" accept="audio/*"><input id="audioUrl" placeholder="رابط الصوت (اختياري)" value="${esc(data.audio_url||'')}"></div></div><div class="section-box"><h3>العبارات</h3><p class="help">لكل عبارة حدد هل الإجابة النموذجية Richtig أم Falsch.</p><div id="questions"></div><button type="button" class="small-btn add-btn" id="addQuestion">+ إضافة عبارة</button></div>`;(data.items?.length?data.items:[{}]).forEach(x=>addTF(x));$('addQuestion').onclick=()=>addTF({});}
function addTF(data){const wrap=$('questions'),n=wrap.children.length+1,row=document.createElement('div');row.className='question-card';row.innerHTML=`<div class="row-title"><span>العبارة ${n}</span><button type="button" class="remove-btn">حذف</button></div><textarea class="q-prompt" placeholder="اكتب العبارة">${esc(data.prompt||'')}</textarea><div class="choice-grid"><label class="choice"><div class="choice-head"><input class="correct-radio" type="radio" name="tf-${n}" value="Richtig" ${data.correct==='Richtig'?'checked':''}> Richtig</div></label><label class="choice"><div class="choice-head"><input class="correct-radio" type="radio" name="tf-${n}" value="Falsch" ${data.correct==='Falsch'?'checked':''}> Falsch</div></label></div>`;wrap.appendChild(row);row.querySelector('.remove-btn').onclick=()=>{row.remove();[...wrap.children].forEach((x,i)=>x.querySelector('.row-title span').textContent='العبارة '+(i+1));};}

async function collect(){const c=currentContext(),type=taskMap[c.section]?.[c.teil];const items=[];let body=document.getElementById('mainBody')?.value||'';
 if(type==='MATCHING'){document.querySelectorAll('#paras .para-card').forEach(p=>items.push({prompt:p.querySelector('.para-text').value,correct:p.querySelector('.correct-head').value,points:1,options:{}}));}
 else if(type==='MCQ'||type==='AUDIO_MCQ'){document.querySelectorAll('#questions .question-card').forEach(q=>{const options={};q.querySelectorAll('.q-opt').forEach(x=>options[x.dataset.key]=x.value.trim());items.push({prompt:q.querySelector('.q-prompt').value,correct:q.querySelector('.correct-radio:checked')?.value||'',points:1,options});});}
 else if(type==='AUDIO_TF'){document.querySelectorAll('#questions .question-card').forEach(q=>items.push({prompt:q.querySelector('.q-prompt').value,correct:q.querySelector('.correct-radio:checked')?.value||'',points:1,options:{Richtig:'Richtig',Falsch:'Falsch'}}));}
 else if(type==='GAP'&&c.section==='Sprachbausteine'&&c.teil==='Teil 1'){
   const gaps=[...body.matchAll(/\[([^\]]*)\]/g)].map(m=>m[1].trim());
   const cards=[...document.querySelectorAll('#questions .question-card')];
   if(gaps.length!==cards.length)throw Error('أكمل الفراغات بين [ ] في النص.');
   let n=0;body=body.replace(/\[([^\]]*)\]/g,()=>{n++;return '('+(20+n)+')';});
   cards.forEach((q,i)=>{const options={};q.querySelectorAll('.q-opt').forEach(x=>options[x.dataset.key]=x.value.trim());items.push({prompt:gaps[i],correct:q.querySelector('.correct-radio:checked')?.value||'',correctText:gaps[i],points:1,options});});
 } else if(type==='GAP'&&c.section==='Sprachbausteine'&&c.teil==='Teil 2'){
   const words=[...body.matchAll(/\[([^\]]*)\]/g)].map(m=>m[1].trim()).filter(Boolean);
   let n=0;body=body.replace(/\[([^\]]*)\]/g,()=>{n++;return '('+(30+n)+')';});
   if(!words.length)throw Error('ضع كلمة صحيحة واحدة على الأقل بين [ ].');
   const distractors=[...document.querySelectorAll('.distractor-input')].map(x=>x.value.trim()).filter(Boolean);
   const bank=[]; const seen=new Set(); [...words,...distractors].forEach(w=>{const k=w.toLocaleLowerCase();if(w&&!seen.has(k)){seen.add(k);bank.push(w);}});
   if(!bank.length)throw Error('أضف كلمة صحيحة واحدة على الأقل.');
   words.forEach((word,i)=>{const options={};bank.forEach((w,j)=>options['W'+(j+1)]=w);items.push({prompt:word,correct:'W'+(bank.findIndex(w=>w.toLocaleLowerCase()===word.toLocaleLowerCase())+1),correctText:word,points:1,options});});
 } else if(type==='GAP'){document.querySelectorAll('#questions .question-card').forEach(q=>{const word=q.querySelector('.gap-word').value.trim();items.push({prompt:word,correct:word,correctText:word,points:1,options:{[word]:word}});});}
 let settings={};if(type==='GAP'&&c.section==='Sprachbausteine'&&c.teil==='Teil 2')settings.distractors=[...document.querySelectorAll('.distractor-input')].map(x=>x.value.trim()).filter(Boolean);
 let audio_url=document.getElementById('audioUrl')?.value||'';const file=document.getElementById('audioFile')?.files?.[0];if(file){if(file.size>5*1024*1024)throw Error('ملف الصوت كبير جداً. استخدم ملفاً أقل من 5MB.');audio_url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
 return {id:state.editId,level:c.level,section:c.section,teil:c.teil,title:$('title').value.trim(),task_type:type,body,translation:'',audio_url,allow_replay:true,headings:[...document.querySelectorAll('.head-input')].map(x=>x.value.trim()).filter(Boolean),items,settings};}
function validate(data){if(!data.title)throw Error('اكتب عنوان الموضوع.');if(data.task_type==='MATCHING'){if(data.headings.length<2)throw Error('أضف عنوانين على الأقل.');if(!data.items.length)throw Error('أضف فقرة واحدة على الأقل.');if(data.items.some(x=>!x.prompt.trim()||!x.correct))throw Error('أكمل نص كل فقرة وحدد عنوانها الصحيح.');}if(['MCQ','AUDIO_MCQ'].includes(data.task_type)){if(!data.items.length)throw Error('أضف سؤالاً واحداً على الأقل.');if(data.items.some(x=>!x.prompt.trim()||!x.correct||Object.keys(x.options).length!==3||Object.values(x.options).some(v=>!String(v).trim())))throw Error('كل سؤال يجب أن يحتوي على سؤال و3 اختيارات وتحديد الإجابة الصحيحة.');}if(data.task_type==='AUDIO_TF'&&data.items.some(x=>!x.prompt.trim()||!x.correct))throw Error('أكمل كل عبارة وحدد Richtig أو Falsch.');if(data.task_type==='GAP'){if(!data.body.trim())throw Error('أدخل النص.');if(!data.items.length)throw Error('أضف فراغاً واحداً على الأقل.');if(data.section==='Sprachbausteine'&&data.teil==='Teil 1'&&data.items.some(x=>!x.correctText.trim()||!['A','B','C'].includes(x.correct)||Object.keys(x.options).length!==3||Object.values(x.options).some(v=>!String(v).trim())))throw Error('أكمل كل فراغ بكلمة صحيحة و3 اختيارات وحدد الصحيحة.');if(data.section==='Sprachbausteine'&&data.teil==='Teil 2'&&data.items.some(x=>!x.correctText.trim()||!x.correct))throw Error('أكمل الكلمات الصحيحة لكل الفراغات.');}if(['WRITING','SPEAKING'].includes(data.task_type)&&!data.body.trim())throw Error('أدخل نص الموضوع.');}

$('importFile').onchange=async e=>{
  const file=e.target.files?.[0]; e.target.value=''; if(!file)return;
  try{
    const raw=await file.text(); const pack=JSON.parse(raw); const list=Array.isArray(pack)?pack:(Array.isArray(pack.exercises)?pack.exercises:[]);
    if(!list.length) throw Error('ملف JSON لا يحتوي على تمارين.');
    const c=currentContext();
    const wrong=list.find(x=>{
      const level=String(x.level||c.level);
      const section=String(x.section||c.section);
      const teil=String(x.teil||c.teil);
      return level!==c.level || section!==c.section || teil!==c.teil;
    });
    if(wrong) throw Error(`الملف لا يطابق الاختيار الحالي: Telc ${c.level} / ${sectionNames[c.section]} / ${c.teil}.`);
    if(!confirm(`سيتم استيراد ${list.length} تمرينًا إلى Telc ${c.level} — ${sectionNames[c.section]} — ${c.teil}. هل تريد المتابعة؟`))return;
    const btn=$('importBtn'); btn.disabled=true; btn.textContent='جارٍ الاستيراد…';
    let done=0;
    for(const x of list){
      const section=String(x.section||c.section), teil=String(x.teil||c.teil);
      let body=String(x.body||'');
      let items=Array.isArray(x.items)?x.items.map(it=>{
        const options=Array.isArray(it.options)
          ? Object.fromEntries(it.options.map(o=>[String(o.option_key||o.key||'').trim(),String(o.option_text??o.text??'')]).filter(([k])=>k))
          : (it.options||{});
        return {...it, prompt:String(it.prompt||''), correct:String(it.correct||it.correct_answer||''), correct_answer:String(it.correct_answer||it.correct||''), options};
      }):[];
      if(section==='Sprachbausteine'&&teil==='Teil 1'){
        const gaps=[...body.matchAll(/\[([^\]]*)\]/g)];
        if(gaps.length!==10) throw Error(`الموضوع «${x.title||'بدون عنوان'}» يجب أن يحتوي على 10 فراغات بين [ ].`);
        if(items.length!==10 || items.some(it=>!String(it.correct||it.correctText||'').trim() || Object.keys(it.options||{}).length!==3)) throw Error(`بيانات الخيارات غير مكتملة في «${x.title||'بدون عنوان'}».`);
        let n=0; body=body.replace(/\[([^\]]*)\]/g,()=>`(${21+n++})`);
      }
      const payload={
        level:String(x.level||c.level), section, teil,
        title:String(x.title||'').trim(),
        task_type:String(x.task_type|| (section==='Schreiben'?'WRITING':section==='Sprechen'?'SPEAKING':section==='Sprachbausteine'?'GAP':'MCQ')),
        body,
        translation:String(x.translation||''), audio_url:String(x.audio_url||''),
        allow_replay:x.allow_replay!==false,
        headings:Array.isArray(x.headings)?x.headings:(Array.isArray(x.settings?.headings)?x.settings.headings:[]),
        items,
        settings:x.settings||{}
      };
      if(!payload.title) throw Error('كل تمرين يجب أن يحتوي على عنوان.');
      if(section==='Schreiben' || section==='Sprechen'){
        if(!payload.body.trim()) throw Error(`الموضوع «${payload.title}» لا يحتوي على نص المهمة.`);
      }
      await api('admin-questions',{method:'POST',body:payload});
      done++; btn.textContent=`استيراد ${done}/${list.length}…`;
    }
    showToast(`تم استيراد ${done} تمارين بنجاح`); await load();
  }catch(err){showToast(err.message||'فشل الاستيراد',true);}finally{const b=$('importBtn');b.disabled=false;b.textContent='⇧ استيراد تمارين';}
};
$('newBtn').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('cancelBtn').onclick=closeModal;$('saveBtn').onclick=save;$('refreshBtn').onclick=load;$('browserLevel').onchange=()=>{updateContext();renderBrowser();};$('browserSection').onchange=()=>{setTeile($('browserTeil'),$('browserSection').value);updateContext();renderBrowser();};$('browserTeil').onchange=()=>{updateContext();renderBrowser();};$('browserSearch').oninput=renderBrowser;modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();});$('logoutLink').onclick=async e=>{e.preventDefault();await api('admin-logout',{method:'POST'});location.href='/admin/login.html'};
setTeile($('browserTeil'),'Lesen','Teil 1');load().catch(e=>{if(e.status===401)location.href='/admin/login.html';else showToast(e.message||'تعذر تحميل التمارين',true);});
</script>
