<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الخطط | TELC Voll</title><link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"><style>
.codes-page{max-width:1280px}
.admin-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:25px;margin-bottom:28px}
.admin-hero h1{font-size:clamp(30px,4vw,46px);margin:8px 0 5px;letter-spacing:-.04em}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:0 7px 24px rgba(16,35,30,.05)}
.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:28px;margin-top:3px}
.workspace{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,.8fr);gap:20px;align-items:start}
.plans-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.plan-item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;position:relative}
.plan-item.inactive{opacity:.62}
.plan-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.plan-name{font-size:20px;font-weight:900;margin:0}
.plan-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:12px;margin-top:3px}
.status{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:850}
.status.on{background:#fff1e5;color:#f47b20}.status.off{background:#f0f2f1;color:#68746f}
.plan-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.meta{background:#f7faf9;border-radius:11px;padding:9px}.meta small{display:block;color:var(--muted);font-size:10px}.meta b{font-size:14px}
.plan-actions{display:flex;gap:7px;flex-wrap:wrap}
.plan-actions .btn{font-size:12px;padding:8px 11px}
.side-stack{display:grid;gap:16px;position:sticky;top:95px}
.form-title{font-size:18px;margin:0 0 14px}.field-label{font-size:12px;font-weight:800;color:#52615c;display:block;margin-top:8px}
.checkline{display:flex;align-items:center;gap:8px;margin:7px 0 13px;font-weight:700}.checkline input{width:auto;margin:0}
.code-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:30px 0 12px}
.code-toolbar h2{margin:0;font-size:24px}.search{max-width:330px}
.code-table-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto;box-shadow:var(--shadow)}
.code-table{width:100%;border-collapse:collapse;min-width:930px}
.code-table th{background:#7a3708;color:#fff;padding:12px 13px;text-align:right;font-size:12px}
.code-table td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.code-table tr:last-child td{border-bottom:0}.code-table tr:hover td{background:#fbfdfc}
.code-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;letter-spacing:.03em;direction:ltr;display:inline-block}
.code-status{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;display:inline-block}
.code-status.active{background:#fff1e5;color:#f47b20}.code-status.disabled{background:#f1f2f2;color:#6a746f}.code-status.expired{background:#fff1ed;color:#a33a2f}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button{padding:7px 9px;font-size:11px}
.empty{text-align:center;padding:45px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(12,29,24,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:20px;width:min(540px,100%);padding:23px;box-shadow:0 25px 70px rgba(0,0,0,.22)}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-head h2{margin:0}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}
.toast{position:fixed;left:22px;bottom:22px;z-index:200;background:#7a3708;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);display:none}.toast.show{display:block}
@media(max-width:950px){.workspace{grid-template-columns:1fr}.side-stack{position:static}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.plans-list{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.admin-hero{display:block}.hero-actions{margin-top:15px}.code-toolbar{display:block}.search{max-width:none;margin-top:10px}}

.plans-page{max-width:1180px} .plans-toolbar{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px} .plans-toolbar h1{margin:8px 0 4px;font-size:clamp(32px,4vw,48px)} .plans-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px} .plan-item{min-height:220px} .plan-actions{margin-top:auto} .empty{background:var(--white);border:1px solid var(--line);border-radius:18px}
@media(max-width:1000px){.plans-grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:650px){.plans-grid{grid-template-columns:1fr} .plans-toolbar{display:block} .plans-toolbar .hero-actions{margin-top:14px}}
</style><style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>
</head>
<body class="admin-shell">
<header class="top admin-nav"><a class="brand" href="/admin/index.html" aria-label="TELC Voll"><span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span></a><nav><a href="/admin/index.html">الرئيسية</a><a href="#" id="logoutLink">خروج</a></nav></header>
<main class="wrap plans-page">
<section class="plans-toolbar"><div><span class="tag">الإدارة</span><h1>إدارة الخطط</h1><p class="muted">أنشئ الخطط وحدد مدة الوصول وعدد المحاولات وميزات كل خطة.</p></div><div class="hero-actions"><button class="btn light" id="refreshBtn">تحديث</button><button class="btn" id="newPlanBtn">إضافة خطة</button></div></section>
<section class="stats"><div class="stat"><small>إجمالي الخطط</small><strong id="statPlans">—</strong></div><div class="stat"><small>الخطط النشطة</small><strong id="statActivePlans">—</strong></div><div class="stat"><small>إجمالي الرموز المرتبطة</small><strong id="statCodes">—</strong></div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px"><div><h2 style="margin:0">الخطط الحالية</h2><p class="muted" style="margin:2px 0;font-size:13px">يمكنك تعديل الخطة أو تعطيلها أو الانتقال مباشرة إلى إنشاء الأكواد.</p></div><span class="tag" id="planCount">0</span></div><div class="plans-grid" id="plansList"></div></section>
</main>
<div class="modal-backdrop" id="planModal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">إضافة خطة</h2><button class="icon-btn" id="closeModal">×</button></div><form id="planForm"><input type="hidden" name="id"><label class="field-label">معرف الخطة</label><input name="plan_key" placeholder="مثال: 30d" required><label class="field-label">اسم الخطة</label><input name="name" placeholder="مثال: 30 يوماً" required><label class="field-label">مدة الخطة بالأيام</label><input name="days" type="number" min="1" value="30" required><label class="field-label">عدد المحاولات</label><input name="attempts" type="number" min="0" value="0" required><label class="checkline"><input type="checkbox" name="ai" checked> تفعيل Sprechen AI</label><div class="actions"><button class="btn" type="submit">حفظ الخطة</button><button class="btn light" type="button" id="cancelModal">إلغاء</button></div></form></div></div>
<div class="toast" id="toast"></div><footer class="admin-footer">TELC Voll — لوحة إدارة المنصة</footer>
<script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script src="/assets/admin-guard.js"></script><script>
const $=id=>document.getElementById(id); let state={plans:[],codes:[]};
function notify(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
function openPlan(p){$('planModal').classList.add('show');$('modalTitle').textContent=p?'تعديل الخطة':'إضافة خطة';const f=$('planForm');f.reset();f.id.value=p?.id||'';f.plan_key.value=p?.plan_key||'';f.name.value=p?.name||'';f.days.value=p?.duration_days||30;f.attempts.value=p?.max_attempts||0;f.ai.checked=p?p.ai_enabled!==false:true;}
function closePlan(){$('planModal').classList.remove('show')}
function render(){$('statPlans').textContent=state.plans.length;$('statActivePlans').textContent=state.plans.filter(p=>p.active).length;$('statCodes').textContent=state.codes.length;$('planCount').textContent=state.plans.length;$('plansList').innerHTML=state.plans.length?state.plans.map(p=>`<article class="plan-item ${p.active?'':'inactive'}"><div class="plan-top"><div><h3 class="plan-name">${esc(p.name)}</h3><div class="plan-key">${esc(p.plan_key)}</div></div><span class="status ${p.active?'on':'off'}">${p.active?'نشطة':'معطلة'}</span></div><div class="plan-meta"><div class="meta"><small>المدة</small><b>${esc(p.duration_days)} يوم</b></div><div class="meta"><small>المحاولات</small><b>${p.max_attempts?esc(p.max_attempts):'غير محدودة'}</b></div><div class="meta"><small>الأكواد</small><b>${esc(p.code_count||0)}</b></div></div><div class="plan-actions"><button class="btn light" data-edit-plan="${p.id}">تعديل</button><button class="btn dark" data-toggle-plan="${p.id}">${p.active?'تعطيل':'تفعيل'}</button><button class="btn light" data-generate-plan="${p.id}">إنشاء أكواد</button></div></article>`).join(''):'<div class="empty">لا توجد خطط حتى الآن.</div>';}
async function load(){state=await api('admin-codes');render()}
$('newPlanBtn').onclick=()=>openPlan();$('closeModal').onclick=closePlan;$('cancelModal').onclick=closePlan;$('planModal').onclick=e=>{if(e.target===$('planModal'))closePlan()};$('refreshBtn').onclick=()=>load().then(()=>notify('تم تحديث البيانات')).catch(()=>location.href='/admin/login.html');
$('planForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('admin-codes',{method:'POST',body:{action:f.get('id')?'update-plan':'plan',id:f.get('id')||undefined,plan_key:f.get('plan_key'),name:f.get('name'),days:f.get('days'),attempts:f.get('attempts'),ai:f.get('ai')==='on'}});closePlan();await load();notify('تم حفظ الخطة')};
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit-plan]');if(edit){openPlan(state.plans.find(p=>String(p.id)===edit.dataset.editPlan));return}const tog=e.target.closest('[data-toggle-plan]');if(tog){await api('admin-codes',{method:'POST',body:{action:'toggle-plan',id:tog.dataset.togglePlan}});await load();notify('تم تغيير حالة الخطة');return}const gen=e.target.closest('[data-generate-plan]');if(gen){location.href='/admin/codes.html?plan='+encodeURIComponent(gen.dataset.generatePlan)}});
$('logoutLink').onclick=async e=>{e.preventDefault();await api('admin-logout',{method:'POST'});location.href='/admin/login.html'};load().catch(()=>location.href='/admin/login.html');
</script></body></html>
