<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A2F">
<title data-i18n="err_page_title">أخطائي</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="/assets/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="alternate icon" href="/assets/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">

</head>
<body>
<header class="top">
  <a class="brand" href="/dashboard.html" aria-label="TELC Voll">
    <span class="brand-mark">
      <span class="brand-dot"></span>
      <span class="brand-wrapper">
        <span class="brand-name"><span class="brand-telc">TELC</span><span class="brand-voll">Voll</span></span>
        <span class="brand-tagline">Lernen • Üben • Bestehen</span>
      </span>
    </span>
  </a>
  <nav>
    <a href="/dashboard.html" data-i18n="nav_home">الرئيسية</a>
    <a href="/errors.html" data-i18n="nav_errors">أخطائي</a>
    <a href="/summaries.html" data-i18n="nav_summaries">الملخصات</a>
    <a href="/speaking.html" data-i18n="nav_speaking_ai">Sprechen AI</a>
    <a href="#" id="logoutLink" data-i18n="nav_logout">خروج</a>
  </nav>
</header>
<main class="wrap">
  <h1 data-i18n="err_page_title">أخطائي</h1>
  <div class="grid" id="list"><p class="muted" data-i18n="loading">جارٍ التحميل…</p></div>
</main>
<footer data-i18n="footer">TELC Voll</footer>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
logoutLink.onclick = async (e) => {
  e.preventDefault();
  await api('auth-logout', { method: 'POST' });
  location.href = '/';
};

(async () => {
  try {
    const { errors } = await api('errors-list');
    list.innerHTML = errors.map((r) => `
      <div class="card">
        <span class="tag">${esc(r.section)} · ${esc(r.teil)}</span>
        <h3>${esc(r.prompt)}</h3>
        <p>${t('err_your_answer')} ${esc(r.wrong_answer)}</p>
        <p>${t('err_correct')} <b>${esc(r.correct_answer)}</b></p>
        <span class="tag">${t('err_count',{n:r.error_count})}</span>
      </div>`).join('') || `<div class="card">${t('err_none')}</div>`;
  } catch (err) {
    location.href = '/?error=session';
  }
})();
document.addEventListener('langchange', () => location.reload());
</script>
</body>
</html>
