<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتيجة الامتحان</title><link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/assets/icons/TELC_Voll_AppIcon_Light.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest"></head><body><header class="top"><a class="brand" href="/dashboard.html">TELC Voll</a><nav><a href="/dashboard.html">الرئيسية</a></nav></header><main class="self-test-page" id="content"></main><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script>(function(){const s=JSON.parse(localStorage.getItem('telc_self_test')||'null');if(!s){location.href='/dashboard.html';return;}const scored=(s.results||[]).filter(r=>r.max>0),score=scored.reduce((a,r)=>a+r.score,0),max=scored.reduce((a,r)=>a+r.max,0),pct=max?Math.round(score/max*10000)/100:0;document.getElementById('content').innerHTML=`<section class="self-test-shell"><span class="tag">Telc ${esc(s.level)}</span><h1>${getLang()==='ar'?'النتيجة الكاملة':'Gesamtergebnis'}</h1><div class="result-card" style="margin:20px 0"><h1>${score} / ${max}</h1><h2>${pct}%</h2><p class="muted">${getLang()==='ar'?'تم جمع نتائج الأجزاء المصححة آلياً. الكتابة والتحدث لا يدخلان في النسبة الآلية.':'Automatisch bewertete Teile wurden zusammengefasst. Schreiben und Sprechen sind nicht in der automatischen Prozentzahl enthalten.'}</p></div><div>${(s.results||[]).map(r=>`<div class="result-row ${r.max&&r.percent>=60?'ok':''}"><b>${r.max?r.percent+'%':'—'}</b><span>${esc([r.section,r.teil].filter(Boolean).join(' · ')||'Teil')}</span><small>${r.max?r.score+' / '+r.max:'manuell'}</small></div>`).join('')}</div><div class="actions"><a class="btn" href="/dashboard.html">${getLang()==='ar'?'العودة إلى المنصة':'Zur Plattform'}</a></div></section>`;})();</script></body></html>
