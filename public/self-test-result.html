<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نتيجة الامتحان التجريبي — TELC Voll</title>
<link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2">
<link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<style>
.result-page{direction:ltr;max-width:1100px;margin:0 auto;padding:32px 20px 80px}

/* Liquid Glass Hero Card */
.result-hero{border-radius:28px;padding:36px;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1.5px solid var(--line);box-shadow:0 10px 36px rgba(0,0,0,0.05);text-align:center;position:relative;overflow:hidden}
.result-hero.pass{border-color:rgba(45,155,104,0.4);background:linear-gradient(180deg,rgba(223,245,232,0.65),rgba(255,255,255,0.9))}
.result-hero.encourage{border-color:rgba(244,123,32,0.4);background:linear-gradient(180deg,rgba(255,243,235,0.7),rgba(255,255,255,0.9))}
html[data-theme="dark"] .result-hero{background:rgba(18,24,21,0.85);border-color:rgba(255,255,255,0.1);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
html[data-theme="dark"] .result-hero.pass{background:linear-gradient(180deg,rgba(45,155,104,0.18),rgba(18,24,21,0.95));border-color:rgba(74,222,128,0.3)}
html[data-theme="dark"] .result-hero.encourage{background:linear-gradient(180deg,rgba(244,123,32,0.18),rgba(18,24,21,0.95));border-color:rgba(251,146,60,0.3)}

.result-icon-glow{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:42px;box-shadow:0 8px 24px rgba(0,0,0,0.06);transition:transform .3s ease}
.result-hero.pass .result-icon-glow{background:#dff5e8;color:#228151;border:2px solid rgba(34,129,81,0.2)}
.result-hero.encourage .result-icon-glow{background:#fff3eb;color:#f47b20;border:2px solid rgba(244,123,32,0.25)}

.result-status{font-size:clamp(26px,4.5vw,42px);font-weight:1000;letter-spacing:-.03em;margin:8px 0 12px;line-height:1.25}
.result-hero.pass .result-status{color:#1e7e52}
.result-hero.encourage .result-status{color:#f47b20}
html[data-theme="dark"] .result-hero.pass .result-status{color:#4ade80}
html[data-theme="dark"] .result-hero.encourage .result-status{color:#fb923c}

.result-sub{color:var(--ink);font-size:16px;line-height:1.8;max-width:820px;margin:0 auto 24px;font-weight:700}
.result-badges-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.result-badge-item{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:130px}
.result-badge-item small{display:block;color:var(--muted);font-size:12px;font-weight:800}
.result-badge-item strong{display:block;font-size:18px;font-weight:950;color:var(--ink);margin-top:2px}

/* Official TELC Certificate Card (matches user uploaded sample media_1790422063367.png) */
.telc-cert-card{background:var(--white);border:2px solid var(--line);border-radius:24px;padding:34px;margin:28px 0;box-shadow:0 8px 30px rgba(0,0,0,0.04);position:relative}
html[data-theme="dark"] .telc-cert-card{background:rgba(20,28,24,0.88);border-color:rgba(255,255,255,0.1)}
.telc-cert-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.telc-cert-title{font-size:20px;font-weight:1000;color:var(--ink);display:flex;align-items:center;gap:10px}
.telc-cert-pill{background:rgba(244,123,32,0.12);color:#f47b20;border:1px solid rgba(244,123,32,0.3);padding:4px 14px;border-radius:999px;font-size:13px;font-weight:900}

.telc-cert-table{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.telc-cert-row{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;font-size:18px;font-weight:850;color:var(--ink)}
.telc-cert-row.total-row{font-size:21px;font-weight:1000;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.telc-cert-row.sub-row{color:var(--ink);font-size:17px;font-weight:800;padding-inline-start:12px}
.telc-cert-score-wrap{display:inline-flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;font-weight:900}
.telc-cert-score-val{display:inline-block;min-width:68px;text-align:end;padding-bottom:2px;border-bottom:1.5px solid var(--ink);font-size:19px;font-weight:1000}
.telc-cert-row.total-row .telc-cert-score-val{font-size:23px;border-bottom-width:2.5px;color:#f47b20}
.telc-cert-max{color:var(--muted);font-size:16px;font-weight:850}

/* Section Breakdown Cards */
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.result-section{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm);transition:all .2s ease}
.result-section.pass{border-color:rgba(45,155,104,0.4)}
.result-section.fail{border-color:rgba(201,74,67,0.35)}
html[data-theme="dark"] .result-section{background:rgba(20,28,24,0.85);border-color:rgba(255,255,255,0.08)}
.result-section-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.result-section-head h3{margin:0;font-size:19px;font-weight:950}
.result-section-score{font-size:21px;font-weight:1000;font-variant-numeric:tabular-nums}
.result-bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin:16px 0 10px}
.result-bar i{display:block;height:100%;border-radius:inherit;background:#2d9b68;transition:width .4s ease}
.result-section.fail .result-bar i{background:#c94a43}
.result-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:850}
.subscores{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.subscore{display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:10px;font-size:13.5px;font-weight:800}

/* Actions */
.result-actions{display:flex;justify-content:center;gap:12px;margin-top:32px;flex-wrap:wrap}
.result-actions .btn{font-size:15px;padding:12px 24px;border-radius:14px;font-weight:900}
.result-actions .btn-orange{background:#f47b20;color:#fff;border:none;box-shadow:0 4px 16px rgba(244,123,32,0.35)}
.result-actions .btn-orange:hover{background:#e06912}

@media(max-width:760px){
  .result-grid{grid-template-columns:1fr}
  .telc-cert-card{padding:22px 16px}
  .telc-cert-row{font-size:15.5px}
  .telc-cert-row.total-row{font-size:18px}
  .telc-cert-score-val{font-size:17px;min-width:54px}
  .result-hero{padding:24px 16px}
  .result-page{padding:16px 12px 60px}
}
</style>
<style><!-- TELC Voll: unified homepage typography -->
html,html body,html body *{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}
html body h1,html body h2,html body h3,html body h4,html body h5,html body h6,html body button,html body input,html body textarea,html body select,html body label,html body a{font-family:"Cairo","Segoe UI",Arial,sans-serif !important;}</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/dashboard.html"><span class="brand-mark"><span class="brand-dot"></span>TELC Voll</span></a>
  <nav class="student-nav-links">
    <a href="/self-test.html" data-i18n="nav_mock">امتحان تجريبي</a>
    <a href="/telc-chat.html" data-i18n="nav_speaking">مساعد TELC</a>
    <a href="/profile.html" data-i18n="profile_link">ملفي</a>
    <a href="#" id="logoutLink" data-i18n="nav_logout" class="nav-logout-btn">خروج</a>
  </nav>
</header>
<main id="content" class="result-page"></main>
<script src="/assets/i18n.js"></script><script src="/assets/app.js"></script>
<script>
const r = JSON.parse(localStorage.getItem('telc_mock_result') || 'null');
if (!r) { location.href = '/dashboard.html'; }

const sectionNames = ['Lesen', 'Sprachbausteine', 'Hören', 'Schreiben'];
const SECTION_DE_NAMES = {
  Lesen: 'Leseverstehen',
  Sprachbausteine: 'Sprachbausteine',
  Hören: 'Hörverstehen',
  Schreiben: 'Schriftlicher Ausdruck'
};

var text = window.text || ((ar, de) => getLang() === 'ar' ? ar : de);

function formatGermanScore(num) {
  const n = Number(num || 0);
  return n.toFixed(1).replace('.', ',');
}

function pct(s) {
  return s && s.max ? Math.round((Number(s.score) / Number(s.max)) * 10000) / 100 : 0;
}

function render() {
  const sections = {...(r?.sections || {})};
  const schrift = sectionNames.reduce((sum, name) => sum + Number(sections[name]?.score || 0), 0);
  const schriftMax = 225;
  const writtenPass = schrift >= 135;
  const passed = writtenPass;
  const grade = writtenPass ? (schrift >= 210 ? 'Sehr gut' : schrift >= 180 ? 'Gut' : schrift >= 157.5 ? 'Befriedigend' : 'Ausreichend') : 'Nicht bestanden';

  const cards = sectionNames.map(name => {
    const fallback = name === 'Lesen' ? 75 : name === 'Sprachbausteine' ? 30 : name === 'Hören' ? 75 : 45;
    const s = sections[name] || { score: 0, max: fallback };
    const p = pct(s);
    const ok = p >= 60;
    const deTitle = SECTION_DE_NAMES[name] || name;

    let sub = '';
    if (name === 'Schreiben' && r.writing?.criteria && r.writing.criteria.length) {
      sub = r.writing.criteria.map(x => `
        <div class="subscore">
          <span>${esc(x.label || x.name)}</span>
          <b>${formatGermanScore(x.score)} / ${x.max}</b>
        </div>`).join('');
    }

    return `
      <article class="result-section ${ok ? 'pass' : 'fail'}">
        <div class="result-section-head">
          <div>
            <h3>${esc(deTitle)}</h3>
            <small class="muted">${esc(name)}</small>
          </div>
          <span class="result-section-score">${formatGermanScore(s.score)} / ${s.max}</span>
        </div>
        <div class="result-bar"><i style="width:${Math.min(100, p)}%"></i></div>
        <div class="result-meta">
          <span>${p.toFixed(1)}%</span>
          <b>${ok ? text('ناجح ✓', 'Bestanden ✓') : text('غير مجتاز', 'Nicht bestanden')}</b>
        </div>
        ${sub ? `<div class="subscores">${sub}</div>` : ''}
      </article>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <!-- Hero Status & Encouragement -->
    <section class="result-hero ${passed ? 'pass' : 'encourage'}">
      <div class="result-icon-glow">
        <span class="result-icon">${passed ? '🏆' : '💪'}</span>
      </div>
      <div class="tag">TELC Voll · Prüfungssimulation · ${esc(r.level || 'B2')}</div>
      <h1 class="result-status">
        ${passed 
          ? text('أحسنت. اجتزت معيار الجزء الكتابي في هذه المحاكاة.', 'Gut gemacht. Du hast die Bestehensgrenze der schriftlichen Prüfungssimulation erreicht.')
          : text('هذه محاولة قيّمة وممتازة للتدريب. الجزء الكتابي لم يصل بعد إلى حد النجاح، ويمكنك تحديد نقاط الضعف من التفصيل أدناه.', 'Ein aussagekräftiges Trainingsergebnis. Die schriftliche Bestehensgrenze wurde noch nicht erreicht. Die Auswertung zeigt dir die Bereiche mit Verbesserungsbedarf.')}
      </h1>
      <p class="result-sub">
        ${passed 
          ? text('حققت ' + formatGermanScore(schrift) + ' من 225 نقطة. في امتحان TELC B2 الرسمي، يحتاج الجزء الكتابي إلى 135 نقطة على الأقل، كما يتطلب النجاح في الامتحان الكامل اجتياز الجزء الشفهي أيضًا.', 'Du hast ' + formatGermanScore(schrift) + ' von 225 Punkten erreicht. Im offiziellen telc B2 sind mindestens 135 Punkte im schriftlichen Teil erforderlich; für die gesamte Prüfung muss zusätzlich der mündliche Teil bestanden werden.')
          : text('حققت ' + formatGermanScore(schrift) + ' من 225 نقطة. حد الجزء الكتابي هو 135 نقطة. استخدم تفاصيل الأقسام لمعرفة أين تحتاج إلى مزيد من التدريب، ثم أعد المحاكاة.', 'Du hast ' + formatGermanScore(schrift) + ' von 225 Punkten erreicht. Die Bestehensgrenze des schriftlichen Teils liegt bei 135 Punkten. Nutze die Bereichsauswertung, um gezielt weiterzuüben und die Simulation erneut zu absolvieren.')}
      </p>
      <div class="result-badges-row">
        <div class="result-badge-item">
          <small>${text('التقدير التقريبي', 'Prädikat')}</small>
          <strong>${grade}</strong>
        </div>
        <div class="result-badge-item">
          <small>${text('حد الجزء الكتابي', 'Bestehensgrenze schriftlich')}</small>
          <strong>135 / 225 (60%)</strong>
        </div>
        <div class="result-badge-item">
          <small>${text('النسبة المحققة', 'Erreichte Quote')}</small>
          <strong style="color:${passed ? '#228151' : '#f47b20'}">${((schrift/225)*100).toFixed(1)}%</strong>
        </div>
      </div>
    </section>

    <!-- Official TELC Certificate Score Card (Exact Match to media_1790422063367.png) -->
    <div class="telc-cert-card">
      <div class="telc-cert-head">
        <div class="telc-cert-title">
          <span>📜</span>
          <span>${text('كشف درجات الامتحان الكتابي (TELC B2)', 'Ergebnis der schriftlichen Prüfung (TELC B2)')}</span>
        </div>
        <span class="telc-cert-pill">${text('تنسيق قريب من كشف الدرجات', 'Ergebnisübersicht im Prüfungsformat')}</span>
      </div>

      <div class="telc-cert-table">
        <div class="telc-cert-row total-row">
          <span>Schriftliche Prüfung</span>
          <span class="telc-cert-score-wrap">
            <span class="telc-cert-score-val">${formatGermanScore(schrift)}</span>
            <span class="telc-cert-max">/ 225 Punkte</span>
          </span>
        </div>

        <div class="telc-cert-row sub-row">
          <span>• Leseverstehen</span>
          <span class="telc-cert-score-wrap">
            <span class="telc-cert-score-val">${formatGermanScore(sections.Lesen?.score || 0)}</span>
            <span class="telc-cert-max">/ 75 Punkte</span>
          </span>
        </div>

        <div class="telc-cert-row sub-row">
          <span>• Sprachbausteine</span>
          <span class="telc-cert-score-wrap">
            <span class="telc-cert-score-val">${formatGermanScore(sections.Sprachbausteine?.score || 0)}</span>
            <span class="telc-cert-max">/ 30 Punkte</span>
          </span>
        </div>

        <div class="telc-cert-row sub-row">
          <span>• Hörverstehen</span>
          <span class="telc-cert-score-wrap">
            <span class="telc-cert-score-val">${formatGermanScore(sections.Hören?.score || 0)}</span>
            <span class="telc-cert-max">/ 75 Punkte</span>
          </span>
        </div>

        <div class="telc-cert-row sub-row">
          <span>• Schriftlicher Ausdruck</span>
          <span class="telc-cert-score-wrap">
            <span class="telc-cert-score-val">${formatGermanScore(sections.Schreiben?.score || 0)}</span>
            <span class="telc-cert-max">/ 45 Punkte</span>
          </span>
        </div>
      </div>
    </div>

    <!-- Breakdown Grid -->
    <div class="result-grid">
      ${cards}
    </div>

    <!-- Actions -->
    <div class="result-actions">
      <button class="btn light" onclick="window.print()">🖨️ ${text('طباعة النتيجة', 'Ergebnis drucken')}</button>
      <a class="btn btn-orange" href="/self-test.html?level=${encodeURIComponent(r.level || 'B2')}">🔄 ${text('إعادة الامتحان التجريبي', 'Prüfung wiederholen')}</a>
      <a class="btn dark" href="/dashboard.html">🏠 ${text('العودة إلى المنصة', 'Zurück zur Plattform')}</a>
    </div>
  `;
}

function enforceResultLTR(){
  document.documentElement.setAttribute('dir','ltr');
  document.body.setAttribute('dir','ltr');
  document.documentElement.classList.add('mock-result-ltr');
}

enforceResultLTR();
window.addEventListener('langchange', () => {
  enforceResultLTR();
  render();
});

render();
</script>
</body>
</html>
