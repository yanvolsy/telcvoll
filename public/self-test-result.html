<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A2F"><title>نتيجة الامتحان التجريبي — TELC Voll</title><link rel="stylesheet" href="/assets/app.css?v=20260918-cairo-local-v2"><link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)"><link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)"><link rel="manifest" href="/manifest.webmanifest"><style>
.result-page{max-width:1100px;margin:0 auto;padding:30px 18px 70px}.result-hero{border-radius:30px;padding:34px;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}.result-hero.pass{border-color:#43a56d;background:linear-gradient(180deg,#f0fbf5,var(--white))}.result-hero.fail{border-color:#d75a50;background:linear-gradient(180deg,#fff2f0,var(--white))}.result-icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:38px;font-weight:950}.result-hero.pass .result-icon{background:#dff5e8;color:#228151}.result-hero.fail .result-icon{background:#ffe1dd;color:#bd3f35}.result-status{font-size:clamp(34px,6vw,58px);font-weight:1000;letter-spacing:-.05em;margin:4px 0 8px}.result-hero.pass .result-status{color:#228151}.result-hero.fail .result-status{color:#bd3f35}.result-sub{color:var(--muted);font-size:15px}.result-total{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.score-box{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px}.score-box small{color:var(--muted)}.score-box strong{display:block;font-size:30px;margin-top:5px}.score-box .green{color:#228151}.score-box .red{color:#bd3f35}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.result-section{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px}.result-section.pass{border-color:#75c795}.result-section.fail{border-color:#e38c84}.result-section-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.result-section-head h3{margin:0;font-size:20px}.result-section-score{font-size:22px;font-weight:950}.result-bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0 8px}.result-bar i{display:block;height:100%;border-radius:inherit;background:#43a56d}.result-section.fail .result-bar i{background:#d75a50}.result-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.subscores{display:grid;gap:7px;margin-top:12px}.subscore{display:flex;justify-content:space-between;padding:9px 10px;background:var(--bg);border-radius:10px;font-size:13px}.result-note{margin-top:18px;padding:15px;border-radius:15px;background:var(--bg);color:var(--muted);line-height:1.8}.result-actions{display:flex;justify-content:center;gap:9px;margin-top:20px;flex-wrap:wrap}@media(max-width:700px){.result-total,.result-grid{grid-template-columns:1fr}.result-hero{padding:25px 16px}.result-page{padding:18px 12px 60px}}
</style>
</head><body><header class="top"><a class="brand" href="/dashboard.html" aria-label="TELC Voll"><span class="brand-mark"><span class="brand-dot"></span><span class="brand-wrapper"><span class="brand-name"><span class="brand-telc">TELC</span><span class="brand-voll">Voll</span></span><span class="brand-tagline">Lernen • Üben • Bestehen</span></span></span></a><nav><a href="/dashboard.html">الرئيسية</a></nav></header><main id="content" class="result-page"></main><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script>
const r=JSON.parse(localStorage.getItem('telc_mock_result')||'null');if(!r){location.href='/dashboard.html';}
const sectionNames=['Lesen','Sprachbausteine','Hören','Schreiben'];
function pct(s){return s&&s.max?Math.round((Number(s.score)/Number(s.max))*10000)/100:0}
function render(){
 const sections={...r.sections};
 const schrift=sectionNames.reduce((sum,name)=>sum+Number(sections[name]?.score||0),0);
 const schriftMax=225;
 const writtenPass=schrift>=135;
 const passed=writtenPass;
 const grade=schrift>=210?'Sehr gut':schrift>=180?'Gut':schrift>=157.5?'Befriedigend':schrift>=135?'Ausreichend':'—';
 const cards=sectionNames.map(name=>{const fallback=name==='Lesen'?75:name==='Sprachbausteine'?30:name==='Hören'?75:45;const s=sections[name]||{score:0,max:fallback};const p=pct(s);const ok=p>=60;let sub='';if(name==='Schreiben'&&r.writing?.criteria)sub=r.writing.criteria.map(x=>`<div class="subscore"><span>${esc(x.label)}</span><b>${x.score} / ${x.max}</b></div>`).join('');return `<article class="result-section ${ok?'pass':'fail'}"><div class="result-section-head"><h3>${name}</h3><span class="result-section-score">${Number(s.score||0).toFixed(Number(s.score)%1?1:0)} / ${s.max}</span></div><div class="result-bar"><i style="width:${Math.min(100,p)}%"></i></div><div class="result-meta"><span>${p.toFixed(1)}%</span><b>${ok?'Bestanden':'Nicht bestanden'}</b></div>${sub?`<div class="subscores">${sub}</div>`:''}</article>`}).join('');
 document.getElementById('content').innerHTML=`<section class="result-hero ${passed?'pass':'fail'}"><div class="result-icon">${passed?'✓':'×'}</div><div class="tag">TELC Voll · Prüfungssimulation · ${esc(r.level||'B2')}</div><div class="result-status">${passed?'مبروك! لقد نجحت':'للأسف، لم تنجح هذه المرة'}</div><p class="result-sub">${passed?'لقد تجاوزت 60% من نقاط الامتحان الكتابي.':'لم تصل إلى 60% من نقاط الامتحان الكتابي. يمكنك إعادة المحاكاة ومحاولة تحسين النتيجة.'}</p></section><section class="result-total"><div class="score-box"><small>Schriftliche Prüfung</small><strong class="${writtenPass?'green':'red'}">${schrift.toFixed(schrift%1?1:0)} / 225 Punkte</strong><span>${(schrift/225*100).toFixed(1)}%</span></div><div class="score-box"><small>Bestehensgrenze</small><strong>${writtenPass?'135 / 225':'135 / 225'}</strong><span>${writtenPass?'Bestanden':'Nicht bestanden'}</span></div></section><div class="result-grid">${cards}</div><div class="result-note"><b>Prädikat:</b> ${grade}<br>هذه نتيجة تدريبية داخل TELC Voll وليست شهادة رسمية من telc. الامتحان التجريبي هنا <b>كتابي فقط</b> ويشمل Lesen وSprachbausteine وHören وSchreiben. يتم تقييم Schreiben بالذكاء الاصطناعي فقط بعد إنهاء الامتحان.</div><div class="result-actions"><button class="btn light" onclick="window.print()">طباعة النتيجة</button><a class="btn" href="/self-test.html?level=${encodeURIComponent(r.level||'B2')}">إعادة الامتحان</a><a class="btn dark" href="/dashboard.html">العودة إلى المنصة</a></div>`
}
render();
</script></body></html>
