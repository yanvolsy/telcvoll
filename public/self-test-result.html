<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتيجة المحاكاة — TELC Voll</title><link rel="stylesheet" href="/assets/app.css"><link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml"><link id="app-manifest" rel="manifest" href="/manifest-light.webmanifest"><style>
.certificate{max-width:920px;margin:auto;background:var(--white);border:2px solid var(--exercise-accent);border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.14);position:relative;overflow:hidden}.certificate:before{content:'';position:absolute;inset:10px;border:1px solid var(--line);border-radius:18px;pointer-events:none}.cert-head{text-align:center;position:relative}.cert-brand{font-size:34px;font-weight:950;letter-spacing:-.04em}.cert-brand span{color:var(--exercise-accent)}.cert-title{font-size:30px;margin:12px 0}.cert-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.cert-score{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0}.cert-total{padding:20px;border-radius:18px;background:var(--exercise-accent-soft);text-align:center}.cert-total strong{display:block;font-size:42px}.section-results{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.section-result{padding:14px;border:1px solid var(--line);border-radius:15px;text-align:center}.section-result strong{display:block;font-size:22px}.pass{color:#2d9b68}.fail{color:#c94a43}.not-eval{color:var(--muted)}.cert-note{margin-top:22px;padding:14px;border-radius:13px;background:rgba(127,127,127,.08);line-height:1.8}.cert-actions{display:flex;justify-content:center;gap:8px;margin-top:22px;position:relative}@media(max-width:800px){.section-results{grid-template-columns:repeat(2,1fr)}.cert-score{grid-template-columns:1fr}}
</style><script src="/assets/pwa-theme.js" defer></script></head><body><header class="top"><a class="brand" href="/dashboard.html">TELC Voll</a><nav><a href="/dashboard.html">الرئيسية</a></nav></header><main class="wrap" id="content"></main><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script>
(function(){const s=JSON.parse(localStorage.getItem('telc_self_test')||'null');if(!s){location.href='/dashboard.html';return;}const names=['Lesen','Hören','Sprachbausteine','Schreiben','Sprechen'];const by={};for(const r of s.results||[]){by[r.section]??={score:0,max:0};by[r.section].score+=Number(r.score||0);by[r.section].max+=Number(r.max||0)}const auto=Object.values(by).reduce((a,r)=>({score:a.score+r.score,max:a.max+r.max}),{score:0,max:0});const oral=s.spoken?.status==='evaluated'?s.spoken:null;const writing=s.writing?.status==='evaluated'?s.writing:null;const overallMax=auto.max+(oral?.max||0)+(writing?.max||0);const overallScore=auto.score+(oral?.score||0)+(writing?.score||0);const pct=overallMax?Math.round(overallScore/overallMax*10000)/100:0;const oralPass=oral?oral.percent>=60:null;const allEvaluated=names.every(n=>n==='Sprechen'?!!oral:n==='Schreiben'?!!writing:(by[n]?.max>0));const passed=allEvaluated&&pct>=60&&(!oral||oralPass);const ended=s.finishedAt?new Date(s.finishedAt).toLocaleString('ar'):new Date().toLocaleString('ar');document.getElementById('content').innerHTML=`<section class="certificate"><div class="cert-head"><div class="cert-brand">TELC <span>Voll</span></div><div class="cert-title">Ergebnis der Prüfungssimulation</div><div class="cert-meta"><span class="tag">Niveau ${esc(s.level)}</span><span class="tag">${esc(ended)}</span></div></div><div class="cert-score"><div class="cert-total"><small>Gesamtpunktzahl</small><strong>${overallScore} / ${overallMax||'—'}</strong><b>${overallMax?pct+'%':'Nicht vollständig bewertet'}</b></div><div class="cert-total"><small>Gesamtergebnis</small><strong class="${passed?'pass':'fail'}">${passed?'BESTANDEN':'NICHT BESTANDEN'}</strong><b>${oral?('Sprechen: '+(oralPass?'Bestanden':'Nicht bestanden')):'Sprechen: nicht bewertet'}</b></div></div><div class="section-results">${names.map(n=>{if(n==='Schreiben'){return `<div class="section-result ${writing?(writing.percent>=60?'pass':'fail'):'not-eval'}"><span>${n}</span><strong>${writing?writing.score+' / '+writing.max:'—'}</strong><small>${writing?(writing.percent>=60?'Bestanden':'Nicht bestanden'):'nicht bewertet'}</small></div>`}if(n==='Sprechen'){return `<div class="section-result ${oral?(oralPass?'pass':'fail'):'not-eval'}"><span>${n}</span><strong>${oral?oral.score+' / '+oral.max:'—'}</strong><small>${oral?(oralPass?'Bestanden':'Nicht bestanden'):'nicht bewertet'}</small></div>`}const r=by[n]||{score:0,max:0};const ok=r.max>0&&r.score/r.max>=.6;return `<div class="section-result ${r.max?(ok?'pass':'fail'):'not-eval'}"><span>${n}</span><strong>${r.max?r.score+' / '+r.max:'—'}</strong><small>${r.max?(r.score/r.max*100).toFixed(0)+'%':'nicht bewertet'}</small></div>`}).join('')}</div><div class="cert-note">هذه النتيجة محاكاة تدريبية داخل TELC Voll وليست شهادة رسمية من telc. Schreiben وSprechen يتم تقييمهما داخل المحاكاة عبر أدوات التقييم المتاحة، ولا تمثل النتيجة شهادة رسمية. معيار النجاح في المنصة: 60% لكل جزء مقيم.</div><div class="cert-actions"><button class="btn" onclick="window.print()">طباعة النتيجة</button><a class="btn light" href="/dashboard.html">العودة إلى المنصة</a></div></section>`;})();</script></body></html>
