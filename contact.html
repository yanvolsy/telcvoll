<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14201D"><title>اتصل بنا — TELC Voll</title><link rel="stylesheet" href="/assets/app.css"><link rel="icon" href="/assets/favicon-light.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><style>
.contact-shell{max-width:900px;margin:auto}.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.contact-account{display:block;text-decoration:none;color:inherit;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:var(--shadow);transition:.2s}.contact-account:hover{transform:translateY(-2px);border-color:var(--exercise-accent)}.contact-account strong{font-size:19px}.contact-account small{display:block;color:var(--muted);margin-top:5px}.contact-form{display:grid;gap:12px}.contact-form input,.contact-form select,.contact-form textarea{width:100%}.contact-form textarea{min-height:120px}.contact-direct{display:block;margin-top:8px;color:var(--exercise-accent);font-weight:800;font-size:13px}.selected-contact{padding:10px 14px;border-radius:12px;background:var(--exercise-accent-soft);color:var(--exercise-accent);font-weight:800}@media(max-width:650px){.contact-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/">TELC Voll</a><nav><a href="/#plans">الخطط</a><a href="/contact.html">اتصل بنا</a></nav></header><main class="wrap contact-shell"><section class="panel"><span class="tag">TELC Voll</span><h1>اتصل بنا</h1><p class="muted">اختر وسيلة التواصل المناسبة، ثم املأ بيانات الطلب.</p><div id="accounts" class="contact-grid"><div class="card">جارٍ تحميل حسابات التواصل…</div></div><div id="formWrap" hidden><div class="selected-contact" id="selectedContact"></div><form id="contactForm" class="contact-form" style="margin-top:14px"><input name="name" placeholder="الاسم الكامل" required><select name="plan" id="planSelect" required><option value="">اختر الخطة</option></select><input name="country" placeholder="البلد" required><input name="contact" placeholder="رقمك أو بريدك الإلكتروني" required><textarea name="message" placeholder="رسالة إضافية (اختياري)"></textarea><button class="btn" type="submit">إرسال الطلب</button></form><div id="formMsg"></div></div></section></main><footer>TELC Voll — منصة تدريب B1 · B2 · C1</footer><script src="/assets/i18n.js"></script><script src="/assets/app.js"></script><script>
let accounts=[];let chosen=null;const escv=s=>esc(s);const params=new URLSearchParams(location.search);
async function load(){const [c,p]=await Promise.all([api('public-contact'),api('public-plans')]);accounts=c.accounts||[];accountsEl.innerHTML=accounts.length?accounts.map((a,i)=>`<button type="button" class="contact-account" data-account="${i}"><strong>${escv(a.label)}</strong><small>${escv(a.value)}</small><span class="contact-direct">فتح الحساب مباشرة ↗</span></button>`).join(''):'<div class="card">لا توجد وسائل تواصل مضافة حالياً.</div>';planSelect.innerHTML='<option value="">اختر الخطة</option>'+(p.plans||[]).map(x=>`<option value="${escv(x.name)}">${escv(x.name)} — ${escv(x.duration_days)} يوم</option>`).join('');const wanted=params.get('plan');if(wanted){const opt=[...planSelect.options].find(o=>o.value===wanted||o.textContent.startsWith(wanted));if(opt)planSelect.value=opt.value;}}
function accountUrl(a){
 const raw=String(a.url||a.value||'').trim();
 if(/^https?:\/\//i.test(raw)) return raw;
 const label=String(a.label||'').toLowerCase(); const value=String(a.value||'').trim();
 if(label.includes('whatsapp')||label.includes('واتساب')) { const num=value.replace(/[^0-9]/g,''); return num ? 'https://wa.me/'+num : ''; }
 if(label.includes('telegram')||label.includes('تلغرام')) { const u=value.replace(/^@/,'').replace(/^https?:\/\/(t\.me\/)?/i,'').replace(/\/$/,''); return u ? 'https://t.me/'+u : ''; }
 if(label.includes('email')||label.includes('mail')||label.includes('بريد')) return value ? 'mailto:'+value : '';
 return '';
}
accountsEl.onclick=e=>{const b=e.target.closest('[data-account]');if(!b)return;chosen=accounts[Number(b.dataset.account)];const direct=accountUrl(chosen);if(e.target.closest('.contact-direct')&&direct){window.open(direct,'_blank','noopener');return;}selectedContact.textContent='وسيلة التواصل المختارة: '+chosen.label+' — '+chosen.value;formWrap.hidden=false;formWrap.scrollIntoView({behavior:'smooth',block:'start'});};
contactForm.onsubmit=e=>{e.preventDefault();if(!chosen)return;const fd=new FormData(contactForm);const subject='TELC Voll — طلب خطة '+fd.get('plan');const body=`الاسم: ${fd.get('name')}\nالخطة: ${fd.get('plan')}\nالبلد: ${fd.get('country')}\nوسيلة التواصل: ${fd.get('contact')}\nالرسالة: ${fd.get('message')||'-'}`;let url=accountUrl(chosen); if(url && !/^mailto:/i.test(url) && !/[?&]text=/i.test(url)) url += (url.includes('?')?'&':'?')+'text='+encodeURIComponent(body); if(/^mailto:/i.test(url)) url += '?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);if(url){window.open(url,'_blank','noopener');formMsg.innerHTML='<div class="alert ok">تم تجهيز الرسالة. أكمل الإرسال في وسيلة التواصل.</div>';}else formMsg.innerHTML='<div class="alert bad">لم يتم إعداد رابط مباشر لهذا الحساب.</div>';};load().catch(e=>accountsEl.innerHTML='<div class="alert bad">تعذر تحميل وسائل التواصل.</div>');
</script></body></html>
